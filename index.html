        {t:'area', id:'varie', label:'Varie ed eventuali', righe:2},
        ...H.chiusura(),
      ];
    },
  });

  /* =====================================================================
     8. CONDIVISIONE DEL PDP
     ===================================================================== */
  registra({
    id:'pdp-condivisione',
    titolo:'Verbale di condivisione del PDP',
    sottotitolo:'DSA: L. 170/2010, D.M. 5669/2011 e Linee guida 2011 – BES: Dir. 27/12/2012, C.M. 8/2013',
    descrizione:'Incontro con la famiglia per illustrare e condividere il PDP',
    argomento:'pdp',
    scuole:['P', 'S'],
    file:'Condivisione_PDP',
    blocchi:(s) => {
      const organo = s === 'S' ? 'Consiglio di classe' : 'Team docenti';
      const ruoli = [s === 'S' ? 'Coordinatore di classe' : 'Docente prevalente', 'Referente inclusione / DSA', 'Genitore', 'Genitore'];
      if (s === 'S') ruoli.push('Alunno/a (per la parte che lo/la riguarda)');
      return [
        ...H.testata(s, [
          {t:'testo', id:'alunno', label:'Alunno/a (iniziali o codice)'},
          {t:'testo', id:'classe', label:'Classe'}]),
        {t:'riga', campi:[
          {t:'scelta', id:'tipologia', label:'Tipologia', w:8, col:3, opz:['DSA certificato', 'Altro BES con certificazione / diagnosi', 'BES senza certificazione']},
          {t:'testo', id:'doc_prot', label:'Documentazione agli atti (prot. n. e data)', w:4}]},
        H.privacy(),
        {t:'h', testo:'Incontro'},
        {t:'riga', campi:[
          {t:'ora', id:'ora_inizio', label:'Ora di inizio', w:3, nopdf:true},
          {t:'scelta', id:'modalita', nopdf:true, label:'Modalità', opz:['in presenza', 'a distanza'], w:4, def:'in presenza'},
          {t:'testo', id:'luogo', label:'Luogo / piattaforma', w:5, nopdf:true}]},
        {t:'testofisso', testo:'Il giorno {data}, alle ore {ora_inizio}, {modalita} ({luogo}), si svolge l’incontro di condivisione del Piano Didattico Personalizzato dell’alunno/a {alunno}, classe {classe}, per l’a.s. {as}.'},
        ...H.presenti(ruoli, 'Partecipanti'),

        {t:'h', testo:'Passaggi documentati'},
        {t:'tabella', id:'passaggi', col:[{h:'Passaggio', w:6}, {h:'Data', w:2}, {h:'Riferimento', w:4}],
         fisse:['Protocollo della certificazione / relazione', 'Colloquio preliminare con la famiglia',
           `Delibera del ${organo}`, 'Incontro di condivisione (presente verbale)'],
         init:[['', '', 'prot. n.'], ['', '', ''], ['', '', 'verbale n.'], ['', '', '']]},
        {t:'nota', testo:`Per i BES senza certificazione la decisione di predisporre un PDP va motivata nel verbale del ${organo} (C.M. 8/2013). Il PDP per DSA va redatto entro il primo trimestre.`},

        {t:'h', testo:'Sintesi del PDP illustrato'},
        {t:'tabella', id:'sintesi', col:[{h:'Voce', w:3}, {h:'Sintesi', w:9, tipo:'area'}],
         fisse:['Strumenti compensativi', 'Misure dispensative', 'Strategie didattiche',
           'Modalità di verifica e criteri di valutazione', 'Impegni della famiglia', 'Impegni dell’alunno/a']},
        {t:'area', id:'oss_famiglia', label:'Osservazioni e richieste della famiglia', righe:3},

        {t:'h', testo:'Validità e verifiche'},
        {t:'riga', campi:[
          {t:'data', id:'monitoraggio', nopdf:true, label:'Monitoraggio intermedio entro', w:6},
          {t:'data', id:'verifica_finale', nopdf:true, label:'Verifica finale entro', w:6}]},
        {t:'testofisso', testo:`Il PDP è efficace dalla data di approvazione del ${organo}. Il monitoraggio intermedio è previsto entro il {monitoraggio} e la verifica finale entro il {verifica_finale}.`},
        {t:'nota', testo:'La firma dei genitori attesta presa visione e collaborazione; il PDP resta valido anche senza firma, purché la condivisione sia documentata. Registrare l’effettiva applicazione delle misure.'},
        {t:'riga', campi:[{t:'ora', id:'ora_fine', label:'Ora di chiusura', w:3}]},
        {t:'firme', ruoli:[
          s === 'S' ? 'Il Coordinatore di classe' : 'Il Docente prevalente', 'Il Referente inclusione',
          'Il genitore / esercente la responsabilità genitoriale', 'Il genitore / esercente la responsabilità genitoriale',
          ...(s === 'S' ? ['L’alunno/a'] : [])]},
      ];
    },
  });
})();

</script>
<script data-schemi="pei">
/* =====================================================================
   PEI – Piano Educativo Individualizzato
   Modello nazionale D.I. 182/2020 come modificato dal D.I. 153/2023
   (Allegati A1 Infanzia, A2 Primaria, A3 Secondaria di I grado).
   Adattamenti per la scuola paritaria: "Coordinatore didattico" al posto
   di "Dirigente scolastico"; codice sostitutivo personale al posto del nome.
   Il campo iniziale "fasi" mostra/stampa solo le parti del PEI che servono
   (inizio anno, revisione intermedia, verifica finale, PEI provvisorio).
   ===================================================================== */
(() => {
  const F = 'Frontespizio e GLO';
  const S14 = 'Sezioni 1-4';
  const S59 = 'Sezioni 5-9';
  const RI = 'Revisione intermedia';
  const CC = 'Certificazione competenze';
  const VF = 'Verifica finale e proposte';
  const PP = 'PEI provvisorio';

  /* dimensioni del PEI (Sezioni 2, 4, 5) */
  const DIM = (s) => [
    {k:'a', L:'A', nome:'Socializzazione/Interazione/Relazione',
      oss:'a. Dimensione della relazione, dell’interazione e della socializzazione',
      tit:'Dimensione: RELAZIONE / INTERAZIONE / SOCIALIZZAZIONE',
      desc:'si faccia riferimento alla sfera affettivo relazionale, considerando l’area del sé, il rapporto con gli altri, la motivazione verso la relazione consapevole, anche con il gruppo dei pari, le interazioni con gli adulti di riferimento nel contesto scolastico, la motivazione all’apprendimento.'},
    {k:'b', L:'B', nome:'Comunicazione/Linguaggio',
      oss:'b. Dimensione della comunicazione e del linguaggio',
      tit:'Dimensione: COMUNICAZIONE / LINGUAGGIO',
      desc:'si faccia riferimento alla competenza linguistica, intesa come comprensione del linguaggio orale, produzione verbale e relativo uso comunicativo del linguaggio verbale o di linguaggi alternativi o integrativi; si consideri anche la dimensione comunicazionale, intesa come modalità di interazione, presenza e tipologia di contenuti prevalenti, utilizzo di mezzi privilegiati.'},
    {k:'c', L:'C', nome:'Autonomia/Orientamento',
      oss:'c. Dimensione dell’autonomia e dell’orientamento',
      tit:'Dimensione: AUTONOMIA / ORIENTAMENTO',
      desc:'si faccia riferimento all’autonomia della persona e all’autonomia sociale, alle dimensioni motorio-prassica (motricità globale, motricità fine, prassie semplici e complesse) e sensoriale (funzionalità visiva, uditiva, tattile).'},
    {k:'d', L:'D', nome:'Cognitiva, Neuropsicologica e dell’Apprendimento',
      oss:'d. Dimensione cognitiva, neuropsicologica e dell’apprendimento',
      tit:'Dimensione: COGNITIVA, NEUROPSICOLOGICA E DELL’APPRENDIMENTO',
      desc:'capacità mnesiche, intellettive e organizzazione spazio-temporale; livello di sviluppo raggiunto in ordine alle strategie utilizzate per la risoluzione di compiti propri per la fascia d’età, agli stili cognitivi, alla capacità di integrare competenze diverse per la risoluzione di compiti' +
        (s === 'I' ? '.' : ', alle competenze di lettura, scrittura, calcolo, decodifica di testi o messaggi.')},
  ];

  const DISCIPLINE = {
    P:['Italiano', 'Inglese', 'Storia', 'Geografia', 'Matematica', 'Scienze', 'Tecnologia', 'Musica', 'Arte e immagine', 'Educazione fisica', 'Educazione civica', 'Religione cattolica', 'Altra disciplina / area (specificare)'],
    S:['Italiano', 'Inglese', 'Seconda lingua comunitaria', 'Storia', 'Geografia', 'Matematica', 'Scienze', 'Tecnologia', 'Musica', 'Arte e immagine', 'Scienze motorie e sportive', 'Educazione civica', 'Religione cattolica', 'Altra disciplina / area (specificare)'],
  };
  const CAMPI = ['Il sé e l’altro', 'Il corpo e il movimento', 'Immagini, suoni, colori', 'I discorsi e le parole', 'La conoscenza del mondo'];
  const COMPETENZE = ['Competenza alfabetica funzionale', 'Competenza multilinguistica', 'Competenza matematica e competenza in scienze, tecnologie e ingegneria', 'Competenza digitale', 'Competenza personale, sociale e capacità di imparare a imparare', 'Competenza in materia di cittadinanza', 'Competenza imprenditoriale', 'Competenza in materia di consapevolezza ed espressione culturali'];
  const GIORNI = ['Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato'];
  const TENUTO = ['del Verbale di accertamento', 'del Profilo di Funzionamento', 'del suo eventuale aggiornamento'];
  const ENTITA = ['Assente', 'Lieve', 'Media', 'Elevata', 'Molto elevata'];

  /* tabella GLO: Nome e cognome | a quale titolo | firma (vuota, per la firma autografa) */
  const glo = (id, label, s) => ({t:'tabella', id, label,
    col:[{h:'Nome e cognome', w:4}, {h:'A quale titolo interviene al GLO', w:4}, {h:'Firma', w:4}],
    righe:7, aggiungi:true,
    init:[['', `${H.PRES[s]} (o suo delegato)`, ''], ['', 'Docente per le attività di sostegno', ''],
      ['', s === 'I' ? 'Docente di sezione' : s === 'P' ? 'Docente del team di classe' : 'Docente del Consiglio di classe', ''],
      ['', 'Genitore / esercente la responsabilità genitoriale', ''], ['', 'Genitore / esercente la responsabilità genitoriale', ''],
      ['', 'Specialista (ASST/UONPIA o struttura accreditata)', '']]});

  /* revisione intermedia e verifica conclusiva: data + punti */
  const rev = (n, label = 'Specificare i punti oggetto di eventuale revisione') => ({t:'se', campo:'fasi', vale:RI, blocchi:[
    {t:'riga', campi:[{t:'data', id:`rev${n}_data`, label:'Revisione a seguito di verifica intermedia – data', w:5}]},
    {t:'area', id:`rev${n}`, label, righe:3}]});
  const ver = (n, label = 'Con verifica dei risultati conseguiti e valutazione sull’efficacia di interventi, strategie e strumenti') => ({t:'se', campo:'fasi', vale:VF, blocchi:[
    {t:'riga', campi:[{t:'data', id:`ver${n}_data`, label:'Verifica conclusiva degli esiti – data', w:5}]},
    {t:'area', id:`ver${n}`, label, righe:4}]});

  /* assistenza di base/specialistica ed esigenze sanitarie (Sez. verifica finale e PEI provvisorio) */
  const assistenza = (p, s) => [
    {t:'multi', id:`${p}_base`, label:'Assistenza di base (per azioni di mera assistenza materiale, non riconducibili ad interventi educativi)', opz:['igienica', 'spostamenti', 'mensa'], altro:true, col:4},
    {t:'area', id:`${p}_base_dati`, label:'Dati relativi all’assistenza di base (collaboratori scolastici, organizzazione oraria ritenuta necessaria)', righe:2},
    {t:'multi', id:`${p}_com`, label:'Assistenza specialistica all’autonomia e/o alla comunicazione (per azioni riconducibili ad interventi educativi) – Comunicazione', opz:['assistenza a bambini/e con disabilità visiva', 'assistenza a bambini/e con disabilità uditiva', `assistenza ${s === 'I' ? 'a bambini/e' : 'ad alunni/e'} con disabilità intellettive e disturbi del neurosviluppo`], col:1},
    {t:'multi', id:`${p}_aut`, label:'Educazione e sviluppo dell’autonomia, nella:', opz:['cura di sé', 'mensa'], altro:true, col:3},
    {t:'area', id:`${p}_spec_dati`, label:'Dati relativi agli interventi educativi all’autonomia e alla comunicazione (educatori, organizzazione oraria ritenuta necessaria)', righe:2},
    {t:'testofisso', testo:'Esigenze di tipo sanitario: comprendono le eventuali somministrazioni di farmaci o altri interventi a supporto di funzioni vitali da assicurare, secondo i bisogni, durante l’orario scolastico.'},
    {t:'multi', id:`${p}_farmaci`, label:'Somministrazioni di farmaci', col:1, opz:[
      'non comportano il possesso di cognizioni specialistiche di tipo sanitario, né l’esercizio di discrezionalità tecnica da parte dell’adulto somministratore, ma solo adeguata formazione delle figure professionali coinvolte. Pertanto, possono essere coinvolte figure interne all’istituzione scolastica',
      'comportano cognizioni specialistiche e discrezionalità tecnica da parte dell’adulto somministratore, tali da richiedere il coinvolgimento di figure professionali esterne']},
    {t:'area', id:`${p}_sanitarie`, label:'Esigenze di tipo sanitario – indicazioni', righe:2},
    {t:'nota', testo:`Altre esigenze ed interventi non riferibili esclusivamente alla specifica disabilità sono definiti nelle modalità ritenute più idonee, conservando la relativa documentazione nel fascicolo personale ${s === 'I' ? 'del bambino o della bambina' : 'dell’alunno o dell’alunna'}. Non trascrivere diagnosi o dati sanitari: rinviare alla documentazione agli atti (prot. n.).`},
  ];
  const notaOre = {t:'nota', testo:'(1) L’indicazione delle ore è finalizzata unicamente a permettere al Coordinatore didattico di formulare la richiesta complessiva d’Istituto delle misure di sostegno ulteriori rispetto a quelle didattiche, da proporre e condividere con l’Ente Territoriale.'};

  registra({
    id: 'pei',
    titolo: 'Piano Educativo Individualizzato (PEI)',
    sottotitolo: 'Art. 7 D.Lgs. 66/2017 – modello nazionale D.I. 182/2020 mod. D.I. 153/2023',
    descrizione: 'PEI completo: frontespizio, GLO, sezioni 1-12, revisione intermedia, verifica finale e PEI provvisorio',
    argomento: 'pei',
    scuole: ['I', 'P', 'S'],
    file: 'PEI',
    blocchi: (s) => {
      const I = s === 'I', SEC = s === 'S';
      const alunno = I ? 'il bambino o la bambina' : 'l’alunno/a';
      const dell = I ? 'del bambino o della bambina' : 'dell’alunno/a';
      const classe = I ? 'sezione' : 'classe';
      const dim = DIM(s);
      const nVF = I ? 10 : 11, nPP = I ? 11 : 12;
      const fasi = [F, S14, S59, RI, ...(I ? [] : [CC]), VF, PP];
      const orari = ['8.00 – 9.00', '9.00 – 10.00', '10.00 – 11.00', '11.00 – 12.00', '12.00 – 13.00', '13.00 – 14.00', '14.00 – 15.00', '15.00 – 16.00'].slice(0, SEC ? 6 : 8);

      return [
        /* ---------- Dati identificativi (sempre stampati) ---------- */
        {t:'h', testo:'Dati identificativi'},
        {t:'riga', campi:[
          {t:'testo', id:'as', label:'Anno scolastico', w:2, def:annoScolastico()},
          {t:'testo', id:'codice', label:`${I ? 'Bambino/a' : 'Alunno/a'} – codice sostitutivo personale`, w:4},
          {t:'testo', id:'classe', label:I ? 'Sezione' : 'Classe', w:2},
          {t:'testo', id:'plesso', label:'Plesso o sede', w:4, def:`${H.NOMI[s]} – Orzinuovi`}]},
        H.privacy(),
        {t:'nota', testo:'Il nome non va scritto nel modulo: si usa il codice sostitutivo personale. La corrispondenza codice/nome resta agli atti della scuola nel fascicolo personale.'},
        {t:'multi', id:'fasi', label:'Parti del PEI incluse in questo documento', opz:fasi, col:4, def:[F, S14, S59]},
        {t:'nota', testo:'Selezionare le parti da compilare: il modulo mostra e stampa solo quelle. Inizio anno (entro il 31 ottobre): Frontespizio e GLO + Sezioni 1-4 + Sezioni 5-9. Revisione intermedia: i campi di revisione compaiono nelle sezioni 4-9. Fine anno (entro il 30 giugno): Verifica finale e proposte' + (I ? '' : ' (+ Certificazione competenze per le classi in uscita)') + '. PEI provvisorio: dopo il primo accertamento della condizione di disabilità.'},

        /* ---------- Frontespizio ---------- */
        {t:'se', campo:'fasi', vale:F, blocchi:[
          {t:'h', testo:'Documentazione di riferimento'},
          {t:'riga', campi:[
            {t:'data', id:'acc_data', label:'Accertamento della condizione di disabilità in età evolutiva ai fini dell’inclusione scolastica – rilasciato in data', w:6},
            {t:'data', id:'acc_scad', label:'Data scadenza o rivedibilità', w:3},
            {t:'scelta', id:'acc_nonind', label:'Scadenza', opz:['Non indicata'], w:3}]},
          {t:'riga', campi:[
            {t:'data', id:'inps_data', label:'Certificazione INPS – valutazione di base (D.Lgs. 62/2024, provincia di Brescia in sperimentazione) – data', w:6},
            {t:'testo', id:'inps_prot', label:'Riferimento agli atti (prot. n.)', w:6}]},
          {t:'riga', campi:[
            {t:'data', id:'pf_data', label:'Profilo di Funzionamento redatto in data', w:6},
            {t:'scelta', id:'pf_nd', label:'Nella fase transitoria', opz:['Profilo di Funzionamento non disponibile'], w:6}]},
          {t:'riga', campi:[
            {t:'data', id:'df_data', label:'Diagnosi Funzionale redatta in data', w:6},
            {t:'data', id:'pdf_data', label:'Profilo Dinamico Funzionale approvato in data', w:6}]},
          {t:'riga', campi:[
            {t:'scelta', id:'pi_stato', label:'Progetto individuale', opz:['redatto', 'da redigere'], w:6},
            {t:'data', id:'pi_data', label:'Progetto individuale redatto in data', w:6}]},
          {t:'nota', testo:'Non trascrivere diagnosi: indicare solo le date e rinviare alla documentazione agli atti. Nella fase transitoria, se il Profilo di Funzionamento non è disponibile, si fa riferimento a Diagnosi Funzionale e Profilo Dinamico Funzionale.'},
          {t:'tabella', id:'date_pei', label:'Date del PEI',
            col:[{h:'Fase', w:4}, {h:'Data', w:2}, {h:'Verbale allegato n.', w:2}, {h:`Firma del ${H.PRES[s]} (o suo delegato)`, w:4}],
            fisse:['PEI provvisorio', 'Approvazione del PEI e prima sottoscrizione', 'Verifica intermedia', 'Verifica finale e proposte per l’a.s. successivo']},

          {t:'h', testo:'Composizione del GLO – Gruppo di Lavoro Operativo per l’inclusione'},
          {t:'testofisso', testo:'Art. 15, commi 10 e 11 della L. 104/1992 (come modificato dal D.Lgs. 96/2019).'},
          glo('glo', 'Componenti del GLO', s),
          {t:'nota', testo:'Specificare a quale titolo ciascun componente interviene al GLO. La colonna Firma resta vuota per la firma autografa sul PDF stampato.'},
          {t:'tabella', id:'glo_mod', label:'Eventuali modifiche o integrazioni alla composizione del GLO, successive alla prima convocazione',
            col:[{h:'Data', w:2}, {h:'Nome e cognome', w:3}, {h:'A quale titolo interviene al GLO', w:4}, {h:'Variazione (nuovo membro, sostituzione, decadenza…)', w:3}],
            righe:2, aggiungi:true},
        ]},

        /* ---------- Sezioni 1-3 ---------- */
        {t:'se', campo:'fasi', vale:S14, blocchi:[
          {t:'h', testo:'1. Quadro informativo'},
          {t:'area', id:'quadro', label:`Situazione familiare / descrizione ${I ? 'del bambino o della bambina' : 'dell’alunno o dell’alunna'}`, righe:5,
            nota:'A cura dei genitori o esercenti la responsabilità genitoriale ovvero di altri componenti del GLO.'},

          {t:'h', testo:'2. Elementi generali desunti dal Profilo di Funzionamento'},
          {t:'nota', testo:'O, se non disponibile, dalla Diagnosi Funzionale e dal Profilo Dinamico Funzionale (ove compilato). Nessun dato diagnostico testuale: descrivere il funzionamento.'},
          {t:'area', id:'profilo', label:'Sintetica descrizione, considerando in particolare le dimensioni sulle quali va previsto l’intervento e che andranno quindi analizzate nel presente PEI', righe:5},
          {t:'testofisso', testo:'In base alle indicazioni del Profilo di Funzionamento (o, se non è stato ancora redatto, della Diagnosi Funzionale e del Profilo Dinamico Funzionale) sono individuate le dimensioni rispetto alle quali è necessario definire nel PEI specifici interventi. Le sezioni del PEI non coinvolte vengono omesse.'},
          ...dim.map(d => ({t:'scelta', id:`dim_${d.k}`, label:`Dimensione ${d.nome} – Sezione 4${d.L}/5${d.L}`, opz:['Va definita', 'Va omessa'], def:'Va definita', w:6})),
          {t:'nota', testo:'Le dimensioni impostate su "Va omessa" vengono nascoste nelle Sezioni 4 e 5.'},

          {t:'h', testo:'3. Raccordo con il Progetto Individuale di cui all’art. 14 della Legge 328/2000'},
          {t:'area', id:'pi_sintesi', label:'Sintesi dei contenuti del Progetto Individuale e sue modalità di coordinamento e interazione con il presente PEI, tenendo conto delle considerazioni della famiglia (se il Progetto individuale è stato già redatto)', righe:4},
          {t:'area', id:'pi_indicazioni', label:'Indicazioni da considerare nella redazione del Progetto individuale di cui all’art. 14 L. 328/2000 (se il Progetto individuale è stato richiesto e deve ancora essere redatto)', righe:3},
          {t:'nota', testo:'Il D.Lgs. 62/2024 sostituisce progressivamente il Progetto individuale con il Progetto di vita (provincia di Brescia in sperimentazione): indicare qui anche l’eventuale raccordo.'},
        ]},

        /* ---------- Sezione 4 ---------- */
        {t:'se', campo:'fasi', vale:[S14, RI], blocchi:[
          {t:'h', testo:`4. Osservazioni ${I ? 'sul/sulla bambino/a' : 'sull’alunno/a'} per progettare gli interventi di sostegno didattico`}]},
        {t:'se', campo:'fasi', vale:S14, blocchi:[
          {t:'testofisso', testo:`Punti di forza sui quali costruire gli interventi ${I ? 'educativo-didattici' : 'educativi e didattici'}.`},
          ...dim.map(d => ({t:'se', campo:`dim_${d.k}`, vale:'Va definita', blocchi:[
            {t:'area', id:`oss_${d.k}`, label:d.oss, righe:4}]}))]},
        rev(4),

        /* ---------- Sezione 5 ---------- */
        {t:'se', campo:'fasi', vale:[S59, RI, VF], blocchi:[
          {t:'h', testo:I ? '5. Interventi per il/la bambino/a: obiettivi educativo-didattici, strumenti, strategie e modalità'
            : '5. Interventi per l’alunno/a: obiettivi educativi e didattici, strumenti, strategie e modalità'}]},
        {t:'se', campo:'fasi', vale:S59, blocchi:
          dim.map(d => ({t:'se', campo:`dim_${d.k}`, vale:'Va definita', blocchi:[
            {t:'testofisso', testo:`${d.L}. ${d.tit} – ${d.desc}`},
            ...(SEC ? [
              {t:'area', id:`ob_${d.k}`, label:`${d.L}. Obiettivi, specificando anche gli esiti attesi`, righe:3},
              {t:'area', id:`int_${d.k}`, label:`${d.L}. Interventi educativi, didattici e metodologici, strategie e strumenti finalizzati al raggiungimento degli obiettivi`, righe:3},
              {t:'area', id:`verif_${d.k}`, label:`${d.L}. Verifica (metodi, criteri e strumenti utilizzati per verificare se gli obiettivi sono stati raggiunti)`, righe:2},
            ] : [

          {t:'area', id:'int_contesto', label:'Tenendo conto di quanto definito nelle Sezioni 5 e 6, descrivere gli interventi previsti sul contesto e sull’ambiente di apprendimento', righe:5}]},

          {t:'area', id:'curricolo', label:'8.1 Interventi educativo-didattici, strategie, strumenti nei diversi campi di esperienza – Modalità di sostegno educativo-didattico e ulteriori interventi di inclusione', righe:5},
          {t:'tabella', id:'campi', label:'Interventi nei campi di esperienza (compilare solo i campi interessati)',

          {t:'multi', id:'vf_tenuto', label:'Proposta del numero di ore di sostegno per l’anno successivo (art. 7, lett. d, D.Lgs. 66/2017) – tenuto conto', opz:TENUTO, col:3},

          {t:'riga', campi:[{t:'num', id:'vf_ore', label:'Ore di sostegno richieste per l’a.s. successivo', w:4}]},
          {t:'area', id:'vf_ore_motivi', label:'Con la seguente motivazione', righe:3},
          {t:'multi', id:'vf_tenuto2', label:'Proposta delle risorse per assistenza igienica e di base e delle risorse professionali per assistenza, autonomia e/o comunicazione per l’anno successivo – tenuto conto', opz:TENUTO, col:3},
          {t:'testofisso', testo:'Partendo dalle osservazioni descritte nelle Sezioni 4 e 6 e dagli interventi descritti nelle Sezioni 5 e 7, tenuto conto di quanto sopra indicato e dei risultati raggiunti, nonché di eventuali difficoltà emerse durante l’anno, si indica il fabbisogno di risorse da destinare agli interventi di assistenza igienica e di base e il fabbisogno di risorse professionali da destinare all’assistenza, all’autonomia e/o alla comunicazione – nell’ambito di quanto previsto dal D.I. 182/2020 e dall’Accordo di cui all’art. 3, comma 5-bis del D.Lgs. 66/2017 – per l’a.s. successivo.'},

          {t:'riga', campi:[

          {t:'testofisso', testo:`Proposta del numero di ore di sostegno alla ${classe} per l’anno successivo (art. 7, lett. d, D.Lgs. 66/2017). Partendo dal Verbale di accertamento e dal Profilo di Funzionamento, si individuano le principali dimensioni interessate [Sezione 4] e le condizioni di contesto [Sezione 6], con la previsione degli interventi ${I ? 'educativi' : 'educativo-didattici'} da attuare ed il relativo fabbisogno di risorse professionali per il sostegno e l’assistenza.`},
          {t:'area', id:'pp_interventi', label:'Dimensioni interessate, condizioni di contesto e interventi previsti', righe:4},

<script data-schemi="didattica">
// Moduli didattici: consigli, scrutini, relazioni, progettazione, ed. civica.
// Sorgenti: format docx e HTML forniti dalla scuola (_sorgenti/), aggiornati al quadro normativo 2026/27.
(() => {
  const ORGANO = {I:'Consiglio di Intersezione', P:'Consiglio di Interclasse', S:'Consiglio di classe'};
  const TEAM = {P:'team docente', S:'Consiglio di classe'};

  const COMP_CHIAVE = [
    'Competenza alfabetica funzionale',
    'Competenza multilinguistica',
    'Competenza matematica e competenza in scienze, tecnologie e ingegneria',
    'Competenza digitale',
    'Competenza personale, sociale e capacità di imparare a imparare',
    'Competenza in materia di cittadinanza',
    'Competenza imprenditoriale',
    'Competenza in materia di consapevolezza ed espressione culturali'
  ];

  const firmeDocenti = (id = 'firme_docenti') => ({t:'tabella', id, label:'Firme dei docenti',
    col:[{h:'Docente', w:4}, {h:'Disciplina / ambito', w:4}, {h:'Firma', w:4}], righe:6, aggiungi:true});

  /* ------------------------------------------------------------------ */
  /* 1. Verbale di Intersezione / Interclasse / Consiglio di classe      */
  /* ------------------------------------------------------------------ */
  registra({
    id: 'verbale-consiglio',
    titolo: 'Verbale del consiglio (intersezione, interclasse, classe)',
    sottotitolo: 'Organi collegiali – art. 5 D.Lgs. 297/1994; L. 62/2000',
    descrizione: 'Seduta tecnica o con i rappresentanti dei genitori, con odg e delibere',
    argomento: 'consigli',
    scuole: ['I', 'P', 'S'],
    file: 'Verbale_consiglio',
    blocchi: (s) => [
      ...H.testata(s, [
        {t:'testo', id:'n_verbale', label:'Verbale n.'},
        {t:'testo', id:'classe', label:s === 'I' ? 'Sezione/i' : 'Classe/i', nopdf:true}]),
      {t:'scelta', id:'tipo_seduta', label:'Tipo di seduta',
        opz:['tecnica (soli docenti)', 'con i rappresentanti dei genitori'], def:'tecnica (soli docenti)', nopdf:true},
      {t:'nota', testo:'La parte relativa al coordinamento didattico e alla valutazione degli alunni si svolge con la sola presenza dei docenti.'},
      ...H.apertura(`il ${ORGANO[s]} (${s === 'I' ? 'sezione/i' : 'classe/i'} {classe}), in seduta {tipo_seduta},`),
      ...H.odg(['Andamento educativo-didattico', 'Verifica della progettazione e delle attività in corso', 'Uscite didattiche e iniziative', 'Varie ed eventuali']),
      ...H.presenti([H.PRES[s], 'Docente', 'Docente', 'Docente'], 'Presenti – docenti'),
      {t:'se', campo:'tipo_seduta', vale:'con i rappresentanti dei genitori', blocchi:[
        {t:'tabella', id:'presenti_genitori', label:'Rappresentanti dei genitori',
          col:[{h:'Cognome e nome', w:5}, {h:s === 'I' ? 'Sezione' : 'Classe', w:5}, {h:'Presenza', w:2, tipo:'pres'}],
          righe:2, aggiungi:true}]},
      ...H.presidenza(H.PRES[s]),
      ...H.trattazione(),
      ...H.delibere(),
      ...H.chiusura(['Il Segretario verbalizzante', 'Il Presidente'])
    ]
  });

  /* ------------------------------------------------------------------ */
  /* 2. Verbale di scrutinio                                             */
  /* ------------------------------------------------------------------ */
  registra({
    id: 'scrutinio-finale',
    titolo: 'Verbale di scrutinio',
    sottotitolo: 'D.Lgs. 62/2017 mod. L. 150/2024 – O.M. 3/2025 – D.M. 183/2024 – D.M. 14/2024',
    descrizione: 'Scrutinio del I quadrimestre o finale, con ammissioni e certificazione',
    argomento: 'consigli',
    scuole: ['P', 'S'],
    file: 'Verbale_scrutinio',
