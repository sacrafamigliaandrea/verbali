<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Modulistica docenti – Scuola Sacra Famiglia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<!--
  Modulistica docenti – Scuola Sacra Famiglia, Orzinuovi (BS)
  Architettura:
  - single file, vanilla JS. I moduli sono SCHEMI DATI registrati con registra({...})
    (specifica in SPEC_SCHEMI.md); un unico motore li rende come form e come PDF.
  - PRIVACY: nessun dato lascia la pagina. Niente localStorage/sessionStorage/IndexedDB/cookie,
    nessuna richiesta di rete con i dati. Lo stato vive solo nella variabile STATO e viene
    azzerato uscendo dal modulo. Il PDF e' generato nel browser con jsPDF e scaricato.
  - PDF: testo vettoriale (non screenshot), A4 verticale, impaginazione compatta:
    le voci vuote e le opzioni non spuntate vengono omesse (opzione disattivabile).
  - Font PDF: Helvetica standard (WinAnsi). pulisci() normalizza i caratteri non coperti.
-->
<style>
:root{
  --blu:#123E90; --blu-2:#0c2c69; --blu-t:#e8eef9; --blu-tt:#f4f7fc;
  --ink:#1c2433; --muted:#5b6475; --line:#d9dfea; --bg:#f5f7fb; --card:#ffffff;
  --N:#2f9e3a; --I:#d81b77; --P:#ef8a00; --S:#2489cf;
  --ambra:#b7791f; --ambra-t:#fdf3e1; --verde:#2f855a; --verde-t:#e6f4ec;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Fira Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blu)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
/* ---------- barra superiore ---------- */
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top .wrap{display:flex;align-items:center;gap:14px;height:66px}
.top img{width:44px;height:44px}
.brand b{display:block;color:var(--blu);font-size:17px;letter-spacing:.2px}
.brand span{font-size:12.5px;color:var(--muted)}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--verde);background:var(--verde-t);border-radius:99px;padding:5px 11px;font-weight:500}
.pill svg{width:14px;height:14px}
/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;padding:26px 0 14px}
.hero h1{margin:0;font-size:28px;color:var(--blu-2)}
.hero p{margin:6px 0 0;color:var(--muted);max-width:720px}
.privacy{background:#fff;border:1px solid var(--line);border-left:4px solid var(--verde);border-radius:var(--r);padding:12px 16px;font-size:13.5px;color:#2d3748;margin:6px 0 18px}
.privacy b{color:var(--verde)}
.filtri{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:8px}
.seg{display:flex;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:7px}
.seg button .dot{width:10px;height:10px;border-radius:50%}
.seg button[aria-pressed=true]{background:var(--blu);color:#fff}
.cerca{flex:1;min-width:220px;position:relative}
.cerca input{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--line);border-radius:12px;background:#fff}
.cerca svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.gruppo{margin:22px 0 6px}
.gruppo h2{font-size:14px;text-transform:uppercase;letter-spacing:.8px;color:var(--blu);margin:0 0 10px;display:flex;align-items:center;gap:10px}
.gruppo h2 small{font-weight:500;color:var(--muted);text-transform:none;letter-spacing:0}
.griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.doc{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,box-shadow .15s;text-align:left}
.doc:hover,.doc:focus-visible{border-color:var(--blu);box-shadow:0 4px 14px rgba(18,62,144,.10);outline:none}
.doc b{font-size:15px;color:var(--ink)}
.doc p{margin:0;font-size:13px;color:var(--muted);flex:1}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.bdg{font-size:11.5px;font-weight:600;border-radius:6px;padding:3px 8px;color:#fff;border:0;cursor:pointer}
.bdg.N{background:var(--N)}.bdg.I{background:var(--I)}.bdg.P{background:var(--P)}.bdg.S{background:var(--S)}
.bdg:hover{filter:brightness(.92)}
.vuoto{color:var(--muted);padding:30px 0}
footer.pie{color:var(--muted);font-size:12.5px;padding:30px 0 40px;text-align:center}
/* ---------- modulo ---------- */
.bar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:66px;z-index:15}
.bar .wrap{display:flex;align-items:center;gap:10px;min-height:58px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.bar h1{font-size:17px;margin:0;color:var(--blu-2)}
.bar .meta{font-size:12.5px;color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 13px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn:hover{border-color:var(--blu);color:var(--blu)}
.btn.pri{background:var(--blu);border-color:var(--blu);color:#fff}
.btn.pri:hover{background:var(--blu-2);color:#fff}
.chk-inline{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.form{max-width:980px;margin:18px auto 80px;padding:0 20px}
.sez{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 18px;margin-bottom:14px}
.sez>h3{margin:-2px 0 12px;font-size:15px;color:var(--blu);text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;gap:9px}
.sez>h3::before{content:"";width:5px;height:18px;border-radius:3px;background:var(--acc,var(--blu))}
.g{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px 14px}
.g>*{min-width:0}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>label,.f>.lbl{font-size:12.5px;font-weight:600;color:#39445a}
.f input[type=text],.f input[type=date],.f input[type=time],.f input[type=number],.f textarea,.f select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fbfcfe;width:100%}
.f textarea{resize:vertical;min-height:64px;line-height:1.4}
.f input:focus,.f textarea:focus,.f select:focus{outline:2px solid rgba(18,62,144,.25);border-color:var(--blu);background:#fff}
.f .aiuto{font-size:12px;color:var(--muted)}
.opz{display:grid;gap:6px 16px}
.opz label{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer;font-weight:400;color:var(--ink)}
.opz input{margin-top:3px;accent-color:var(--blu);width:16px;height:16px;flex:none}
.altro{margin-top:6px}
.nota{grid-column:1/-1;background:var(--blu-tt);border:1px solid #d6e0f3;border-radius:8px;padding:9px 12px;font-size:13px;color:#2b3f66;display:flex;gap:9px}
.nota svg{flex:none;width:16px;height:16px;margin-top:2px;color:var(--blu)}
.fisso{grid-column:1/-1;font-size:14px;background:#fafbfd;border:1px dashed var(--line);border-radius:8px;padding:10px 12px;color:#2d3748}
.fisso .ph{background:var(--ambra-t);color:var(--ambra);border-radius:4px;padding:0 4px;font-size:12.5px}
.fisso .val{background:var(--blu-t);color:var(--blu-2);border-radius:4px;padding:0 4px;font-weight:500}
.tab{grid-column:1/-1;overflow-x:auto}
.tab table{width:100%;border-collapse:collapse;font-size:13.5px}
.tab th{background:var(--blu-t);color:var(--blu-2);font-weight:600;text-align:left;padding:7px 8px;border:1px solid var(--line);font-size:12.5px}
.tab td{border:1px solid var(--line);padding:0;vertical-align:top}
.tab td.fissa{background:#fafbfd;padding:7px 8px;font-weight:500;color:#39445a;min-width:140px}
.tab td input[type=text],.tab td textarea{border:0;width:100%;padding:7px 8px;background:transparent;min-height:34px;resize:vertical;display:block}
.tab td textarea{min-height:52px}
.tab td input:focus,.tab td textarea:focus{outline:2px solid rgba(18,62,144,.25);background:#fff}
.tab td.c{text-align:center;vertical-align:middle;padding:6px}
.tab td.c input{accent-color:var(--blu);width:17px;height:17px}
.tab td.azz{width:34px;text-align:center;vertical-align:middle;border-color:transparent}
.ico{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:4px;border-radius:6px;display:inline-flex}
.ico:hover{color:var(--blu);background:var(--blu-t)}
.ico svg{width:15px;height:15px}
.agg{margin-top:8px}
.elenco{display:flex;flex-direction:column;gap:6px}
.elenco .it{display:flex;gap:8px;align-items:center}
.elenco .n{width:24px;font-weight:600;color:var(--blu);text-align:right}
.elenco input{flex:1}
.firme{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;grid-column:1/-1}
.firme .f{background:#fafbfd;border:1px solid var(--line);border-radius:8px;padding:10px}
.nascosto{display:none!important}
/* ---------- anteprima ---------- */
.modal{position:fixed;inset:0;background:rgba(15,25,45,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.modal .box{background:#fff;border-radius:14px;width:min(980px,100%);height:min(92vh,1200px);display:flex;flex-direction:column;overflow:hidden}
.modal .box.small{height:auto;width:min(520px,100%);padding:22px}
.modal .hd{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.modal .hd b{flex:1;color:var(--blu-2)}
.modal iframe{flex:1;border:0;width:100%}
.modal h3{margin:0 0 8px;color:var(--blu-2)}
.modal p{margin:0 0 14px;color:#2d3748;font-size:14.5px}
.modal .az{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--blu-2);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.2)}
@media (max-width:760px){
  .wrap{padding:0 14px}
  .hero{grid-template-columns:1fr}
  .hero h1{font-size:23px}
  .g{grid-template-columns:minmax(0,1fr)}
  .g>*{grid-column:1/-1!important}
  .top .wrap{height:58px}
  .top img{width:36px;height:36px}
  .brand span{display:none}
  .top .pill span{display:none}
  .bar{top:58px}
  .bar .wrap{gap:6px;min-height:0}
  .bar .wrap>div{min-width:0!important;flex:1 1 100%!important;order:-1}
  .opz{grid-template-columns:minmax(0,1fr)!important}
  .bar h1{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .btn{padding:7px 10px;font-size:14px}
  .chk-inline{order:5}
  .form{padding:0 10px;margin-top:12px}
  .sez{padding:14px 12px}
  .tab table{min-width:560px}
  .seg button{padding:7px 10px}
}
@media print{.top,.bar{display:none}}
</style>
</head>

<script>
'use strict';
/* =====================================================================
   REGISTRO DEI MODULI E COSTANTI
   ===================================================================== */
const MODULI = [];
function registra(m){ MODULI.push(m); }

const SCUOLE = {
  N:{nome:'Green Nido', breve:'Nido', col:'#2f9e3a', pdf:[47,158,58]},
  I:{nome:"Scuola dell'Infanzia", breve:'Infanzia', col:'#d81b77', pdf:[216,27,119]},
  P:{nome:'Scuola Primaria', breve:'Primaria', col:'#ef8a00', pdf:[222,124,0]},
  S:{nome:'Scuola Secondaria di I grado', breve:'Secondaria', col:'#2489cf', pdf:[36,137,207]},
};
const ARGOMENTI = [
  ['generici','Verbali generici – struttura libera'],
  ['organi','Organi collegiali'],
  ['programmazione','Programmazione e progettazione'],
  ['consigli','Consigli, scrutini e relazioni'],
  ['glo','GLO – Gruppo di Lavoro Operativo'],
  ['pei','PEI – Piano Educativo Individualizzato'],
  ['pdp','PDP – Piano Didattico Personalizzato'],
  ['bes','BES – Bisogni Educativi Speciali'],
  ['incontri','Incontri con famiglie e specialisti'],
  ['continuita','Continuità tra gradi'],
  ['tutela','Disciplina e tutela'],
  ['valutazione','Valutazione'],
  ['esami','Esame di Stato del primo ciclo'],
  ['relazioni','Relazioni e documenti del docente'],
  ['sicurezza','Sicurezza, salute e frequenza'],
];
const LOGO = document.querySelector('.top img').src;
const SCUOLA_NOME = 'Scuola Sacra Famiglia';
const SCUOLA_SUB = "S. Paola Elisabetta Cerioli – Via Milano, 75 – 25034 Orzinuovi (BS)";

function annoScolastico(){
  const d = new Date(), y = d.getFullYear();
  return d.getMonth() >= 7 ? `${y}/${y+1}` : `${y-1}/${y}`;
}
function oggiISO(){
  const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0,10);
}
function dataIT(v){ if(!v) return ''; const [y,m,g] = v.split('-'); return `${g}/${m}/${y}`; }

/* =====================================================================
   HELPER PER GLI SCHEMI (blocchi ricorrenti)
   ===================================================================== */
const H = {
  NOMI: {N:'Green Nido', I:"Scuola dell'Infanzia", P:'Scuola Primaria', S:'Scuola Secondaria di I grado'},
  PRES: {N:'Coordinatrice pedagogica', I:'Coordinatore didattico', P:'Coordinatore didattico', S:'Coordinatore didattico'},
  testata(s, extra = []){
    // griglia a 12 colonne intere: gli extra si dividono 8 colonne, il resto va ad anno e data
    const w = extra.length ? Math.floor(8 / extra.length) : 0;
    const resto = extra.length ? (12 - w * extra.length) / 2 : 6;
    return [{t:'h', testo:'Dati generali'},
      {t:'riga', campi:[
        {t:'testo', id:'as', label:s === 'N' ? 'Anno educativo' : 'Anno scolastico', w:resto, def:annoScolastico()},
        {t:'data', id:'data', label:'Data', w:resto, oggi:true},
        ...extra.map(e => Object.assign({w}, e))]}];
  },
  apertura(organo){
    return [
      {t:'riga', campi:[
        {t:'ora', id:'ora_inizio', label:'Ora di inizio', w:3, nopdf:true},
        {t:'scelta', id:'modalita', label:'Modalità', opz:['in presenza','a distanza'], w:4, def:'in presenza', nopdf:true},
        {t:'testo', id:'luogo', label:'Luogo / piattaforma', w:5, ph:'es. aula docenti', nopdf:true}]},
      {t:'testofisso', testo:`Il giorno {data}, alle ore {ora_inizio}, {modalita} ({luogo}), si riunisce ${organo} per discutere il seguente ordine del giorno.`}
    ];
  },
  presenti(ruoli = [], titolo = 'Presenti'){
    return [{t:'h', testo:titolo},
      {t:'tabella', id:'presenti', col:[{h:'Cognome e nome', w:5}, {h:'Ruolo / qualifica', w:5}, {h:'Presenza', w:2, tipo:'pres'}],
       righe:Math.max(4, ruoli.length), init:ruoli.map(r => ['', r, 'P']), aggiungi:true},
      {t:'nota', testo:'Presenza: P = presente, A = assente, AG = assente giustificato. Le righe vuote non vengono stampate.'}];
  },
  presidenza(presidente = 'Coordinatore didattico'){
    return [{t:'riga', campi:[
        {t:'testo', id:'presidente', label:`Presiede (${presidente} o delegato)`, w:6, nopdf:true},
        {t:'testo', id:'segretario', label:'Segretario verbalizzante', w:6, nopdf:true}]},
      {t:'testofisso', testo:'Presiede {presidente}; funge da segretario verbalizzante {segretario}. Constatata la validità della seduta, il Presidente dichiara aperti i lavori.'}];
  },
  odg(punti = []){
    return [{t:'h', testo:'Ordine del giorno'}, {t:'elenco', id:'odg', init:punti, min:Math.max(3, punti.length), ph:'Punto all’ordine del giorno'}];
  },
  trattazione(){
    return [{t:'h', testo:'Trattazione dei punti'},
      {t:'nota', testo:'Per ogni punto: sintesi degli interventi (chi, che cosa), proposte emerse e decisione. Linguaggio oggettivo e descrittivo.'},
      {t:'tabella', id:'trattazione', col:[{h:'Punto', w:1}, {h:'Sintesi della discussione', w:7, tipo:'area'}, {h:'Decisioni', w:4, tipo:'area'}], righe:3, aggiungi:true}];
  },
  delibere(){
    return [{t:'tabella', id:'delibere', label:'Delibere e votazioni',
      col:[{h:'Oggetto della delibera', w:6, tipo:'area'}, {h:'Favorevoli', w:1.5}, {h:'Contrari', w:1.5}, {h:'Astenuti', w:1.5}, {h:'Esito', w:1.5}], righe:1, aggiungi:true}];
  },
  impegni(){
    return [{t:'tabella', id:'impegni', label:'Impegni operativi',
      col:[{h:'Azione / compito', w:7, tipo:'area'}, {h:'Responsabile', w:3}, {h:'Scadenza', w:2}], righe:2, aggiungi:true}];
  },
  chiusura(ruoli = ['Il Presidente', 'Il Segretario verbalizzante']){
    return [{t:'h', testo:'Chiusura'},
      {t:'riga', campi:[{t:'ora', id:'ora_fine', label:'Ora di chiusura', w:3, nopdf:true}]},
      {t:'testofisso', testo:'Esauriti i punti all’ordine del giorno, la seduta è tolta alle ore {ora_fine}. Letto, approvato e sottoscritto.'},
      {t:'firme', ruoli}];
  },
  privacy(){
    return {t:'nota', testo:'Privacy: indicare gli alunni con nome o iniziali solo quando necessario; non trascrivere diagnosi ma rinviare alla documentazione agli atti (prot. n.). Il PDF va caricato sul registro elettronico e poi eliminato dal dispositivo.'};
  },
};

/* =====================================================================
   STATO (solo in memoria)
   ===================================================================== */
let STATO = {}, MOD = null, SCU = null, BLOCCHI = [], SPORCO = false;
let FILTRO = 'tutte', CERCA = '';

function azzera(){ STATO = {}; SPORCO = false; }
window.addEventListener('beforeunload', e => { if (SPORCO){ e.preventDefault(); e.returnValue = ''; } });

/* =====================================================================
   UTILITA' DOM

function el(tag, attrs = {}, ...figli){

    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);

  for (const f of figli.flat()) if (f != null) e.append(f.nodeType ? f : document.createTextNode(f));

}

function disegnaElenco(lista){
  lista.innerHTML = '';
  const q = CERCA.trim().toLowerCase();
  let tot = 0;
  for (const [arg, nomeArg] of ARGOMENTI){
    const docs = MODULI.filter(m => m.argomento === arg && (FILTRO === 'tutte' || m.scuole.includes(FILTRO))
      && (!q || (m.titolo + ' ' + (m.descrizione || '') + ' ' + nomeArg).toLowerCase().includes(q)));
    if (!docs.length) continue;
    tot += docs.length;
    const g = el('div', {class:'griglia'});

      const scuole = FILTRO === 'tutte' ? m.scuole : [FILTRO];
      const card = el('div', {class:'doc', tabindex:'0', role:'button',
        onclick:() => apri(m.id, scuole[0]), onkeydown:e => { if (e.key === 'Enter') apri(m.id, scuole[0]); }},
        el('b', {}, m.titolo), el('p', {}, m.descrizione || ''),
        el('div', {class:'badges'}, m.scuole.filter(s => FILTRO === 'tutte' || s === FILTRO).map(s =>
          el('button', {class:'bdg ' + s, title:'Apri per ' + SCUOLE[s].nome,
            onclick:e => { e.stopPropagation(); apri(m.id, s); }}, SCUOLE[s].breve))));

  }
  if (!tot) lista.append(el('p', {class:'vuoto'}, 'Nessun modulo corrisponde alla ricerca.'));

function apri(id, s){
  MOD = MODULI.find(m => m.id === id); SCU = s; azzera();
  BLOCCHI = conAnnotazioni(MOD.blocchi(s));
  inizializza(BLOCCHI);
  const app = $('#app'); app.innerHTML = '';
  const bar = el('div', {class:'bar'}, el('div', {class:'wrap'},
    el('button', {class:'btn', onclick:esci, html:SVG.indietro + 'Elenco'}),

      el('div', {class:'meta'}, el('span', {class:'bdg ' + s, style:'cursor:default;margin-right:6px'}, SCUOLE[s].breve), MOD.sottotitolo || '')),
    el('label', {class:'chk-inline', title:'Se attivo, nel PDF vengono omesse le voci non compilate e le opzioni non spuntate'},
      el('input', {type:'checkbox', id:'compatto', checked:true}), 'PDF compatto'),
    el('button', {class:'btn', onclick:svuota, html:SVG.pulisci + 'Svuota'}),
    el('button', {class:'btn', onclick:anteprima, html:SVG.occhio + 'Anteprima'}),
    el('button', {class:'btn pri', onclick:scarica, html:SVG.scarica + 'Salva PDF'})));

/* Ogni modulo, anche il piu' dettagliato, riceve una sezione di annotazioni libere prima della
   chiusura/firme: copre i casi non previsti. Vuota = non stampata. Disattivabile con libere:false. */
function conAnnotazioni(bl){
  if (MOD.libere === false || bl.some(b => b.t === 'libere')) return bl;
  const extra = [{t:'h', testo:'Annotazioni aggiuntive'},
    {t:'nota', testo:'Sezione facoltativa: aggiungi qui punti non previsti dal modulo (ogni sezione ha titolo e testo). Se resta vuota non compare nel PDF.'},
    {t:'libere', id:'_annotazioni', init:[], sottotitoli:true, aggiungi:'Aggiungi annotazione'}];
  let i = bl.length;
  for (let k = bl.length - 1; k >= 0; k--){
    const b = bl[k];
    if (b.t === 'firme' || (b.t === 'h' && /chiusura|presa visione|firme/i.test(b.testo))){ i = k; if (b.t === 'h') break; }
  }
  // se prima delle firme c'e' un testo fisso (es. "Letto, confermato..."), inserisci prima di quello
  while (i > 0 && bl[i - 1].t === 'testofisso' && bl[i] && bl[i].t === 'firme') i--;
  return [...bl.slice(0, i), ...extra, ...bl.slice(i)];
}
function esci(){
  if (SPORCO && !confirm('Uscendo dal modulo i dati inseriti verranno cancellati. Hai già salvato il PDF?')) return;
  home();
}
function svuota(){
  if (!confirm('Cancellare tutti i dati inseriti in questo modulo?')) return;
  apri(MOD.id, SCU);
}
/* valori iniziali (default, oggi, righe tabelle) */
function inizializza(blocchi){
  for (const b of blocchi){
    if (b.t === 'riga') inizializza(b.campi);
    else if (b.t === 'se') inizializza(b.blocchi);
    else if (b.id && STATO[b.id] === undefined){
      if (b.t === 'tabella'){
        const n = b.fisse ? b.fisse.length : (b.righe || 3);
        const init = b.init || [];
        STATO[b.id] = Array.from({length:Math.max(n, init.length)}, (_, i) => b.col.map((c, j) => (init[i] && init[i][j] != null) ? init[i][j] : (c.tipo === 'x' ? false : '')));
      } else if (b.t === 'elenco') STATO[b.id] = [...(b.init || []), ...Array(Math.max(0, (b.min || 3) - (b.init || []).length)).fill('')];
      else if (b.t === 'multi') STATO[b.id] = b.def ? [...b.def] : [];
      else if (b.t === 'matrice') STATO[b.id] = {};
      else if (b.t === 'firme') STATO[b.id || 'firme'] = {};
      else if (b.t === 'libere') STATO[b.id] = (b.init || [{titolo:'', testo:''}]).map(x => Object.assign({titolo:'', testo:''}, x));
      else if (b.t === 'data' && b.oggi) STATO[b.id] = oggiISO();
      else STATO[b.id] = b.def != null ? b.def : '';
    }
    if (b.t === 'firme' && !b.id){ b.id = 'firme'; if (!STATO.firme) STATO.firme = {}; }
  }
}
function segna(){ SPORCO = true; aggiornaDinamici(); }

function disegnaForm(root){
  root.innerHTML = '';
  let sez = null, grid = null;
  const nuovaSez = (titolo) => {
    sez = el('section', {class:'sez'}); if (titolo) sez.append(el('h3', {}, titolo));
    grid = el('div', {class:'g'}); sez.append(grid); root.append(sez);
  };
  const disegna = (blocchi, dest) => {
    for (const b of blocchi){
      if (b.t === 'h'){ nuovaSez(b.testo); dest = grid; continue; }
      if (!dest){ nuovaSez(null); dest = grid; }
      if (b.t === 'se'){
        const box = el('div', {class:'g', style:'grid-column:1/-1', 'data-se':JSON.stringify([b.campo, b.vale])});
        dest.append(box);
        // i titoli dentro un "se" aprono sotto-sezioni visive
        let sub = box;
        for (const x of b.blocchi){
          if (x.t === 'h'){ sub = el('div', {class:'g', style:'grid-column:1/-1;margin-top:8px'}); box.append(el('h4', {style:'grid-column:1/-1;margin:6px 0 0;color:var(--blu);font-size:14px;text-transform:uppercase;letter-spacing:.5px;border-top:1px solid var(--line);padding-top:12px'}, x.testo), sub); }
          else disegna([x], sub);
        }
        continue;
      }
      dest.append(campo(b));
    }
  };
  disegna(BLOCCHI, null);
  aggiornaDinamici();
}
function span(b){ return `grid-column:span ${Math.round(b.w || 12)}`; }

function campo(b){

    case 'salto': return null;
    case 'riga': { const g = el('div', {class:'g', style:'grid-column:1/-1'}); b.campi.forEach(c => g.append(campo(c))); return g; }
    case 'testo': case 'data': case 'ora': case 'num': {

      const i = el('input', {type:tipo, id:'f_' + b.id, value:STATO[b.id] || '', placeholder:b.ph || null});

    }
    case 'area': {
      const i = el('textarea', {id:'f_' + b.id, rows:b.righe || 3, placeholder:b.ph || null});

      i.addEventListener('input', () => { STATO[b.id] = i.value; segna(); });
      return el('div', {class:'f', style:span(b)}, el('label', {for:'f_' + b.id}, b.label), i, b.nota ? el('span', {class:'aiuto'}, b.nota) : null);
    }
    case 'scelta': case 'multi': {

      const box = el('div', {class:'opz', style:`grid-template-columns:repeat(${multi ? (b.col || 1) : (b.col || Math.min(b.opz.length, (b.w || 12) >= 8 ? 3 : 1))},minmax(0,1fr))`});
      const nome = 'f_' + b.id;
      const opz = [...b.opz, ...(b.altro ? ['Altro'] : [])];
      const altroIn = b.altro ? el('input', {type:'text', class:'altro', placeholder:'Specificare', value:STATO[b.id + '_altro'] || ''}) : null;
      if (altroIn) altroIn.addEventListener('input', () => { STATO[b.id + '_altro'] = altroIn.value; segna(); });
      for (const o of opz){
        const i = el('input', {type:multi ? 'checkbox' : 'radio', name:nome, value:o,

        i.addEventListener('change', () => {
          if (multi){ STATO[b.id] = [...box.querySelectorAll('input:checked')].map(x => x.value); }
          else STATO[b.id] = i.value;

        if (!multi && STATO[b.id] === o) i.dataset.was = '1';
        box.append(el('label', {}, i, el('span', {}, o)));
      }
      if (altroIn) altroIn.classList.toggle('nascosto', !(multi ? STATO[b.id].includes('Altro') : STATO[b.id] === 'Altro'));
      return el('div', {class:'f', style:span(b), role:multi ? 'group' : 'radiogroup', 'aria-label':b.label || ''},
        b.label ? el('span', {class:'lbl'}, b.label) : null, box, altroIn, b.nota ? el('span', {class:'aiuto'}, b.nota) : null);
    }
    case 'tabella': return tabella(b);
    case 'matrice': {
      const t = el('table');
      t.append(el('thead', {}, el('tr', {}, el('th', {}, ''), b.opz.map(o => el('th', {style:'text-align:center'}, o)))));
      const tb = el('tbody');
      b.voci.forEach((v, r) => {

        });

function tabella(b){
  const wrap = el('div', {class:'f', style:'grid-column:1/-1'});
  const tot = b.col.reduce((a, c) => a + (c.w || 1), 0);
  const draw = () => {
    wrap.innerHTML = '';
    if (b.label) wrap.append(el('span', {class:'lbl'}, b.label));
    const t = el('table');
    const hr = el('tr');
    b.col.forEach(c => hr.append(el('th', {style:`width:${(c.w || 1) / tot * 100}%;${c.tipo === 'x' || c.tipo === 'pres' || c.tipo === 'sn' ? 'text-align:center' : ''}`}, c.h)));
    if (b.aggiungi) hr.append(el('th', {style:'width:34px;border-color:transparent;background:transparent'}));
    t.append(el('thead', {}, hr));
    const tb = el('tbody');
    STATO[b.id].forEach((riga, r) => {
      const tr = el('tr');
      b.col.forEach((c, j) => {
        if (b.fisse && j === 0){ tr.append(el('td', {class:'fissa'}, b.fisse[r])); return; }
        if (c.tipo === 'x'){
          const i = el('input', {type:'checkbox', checked:!!riga[j], 'aria-label':c.h});
          i.addEventListener('change', () => { riga[j] = i.checked; segna(); });
          tr.append(el('td', {class:'c'}, i)); return;
        }
        if (c.tipo === 'pres' || c.tipo === 'sn'){
          const opz = c.tipo === 'pres' ? ['P', 'A', 'AG'] : ['', 'Sì', 'No'];
          const s = el('select', {'aria-label':c.h, style:'border:0;background:transparent;width:100%;padding:7px 4px;text-align:center'},
            opz.map(o => el('option', {value:o, selected:riga[j] === o}, o || '–')));
          s.addEventListener('change', () => { riga[j] = s.value; segna(); });
          tr.append(el('td', {class:'c', style:'padding:0'}, s)); return;
        }
        const i = c.tipo === 'area' ? el('textarea', {rows:2, 'aria-label':c.h}) : el('input', {type:'text', value:riga[j] || '', 'aria-label':c.h});
        if (c.tipo === 'area') i.value = riga[j] || '';
        i.addEventListener('input', () => { riga[j] = i.value; segna(); });
        tr.append(el('td', {}, i));
      });
      if (b.aggiungi) tr.append(el('td', {class:'azz'}, el('button', {class:'ico', title:'Rimuovi riga', html:SVG.meno,
        onclick:() => { STATO[b.id].splice(r, 1); draw(); segna(); }})));
      tb.append(tr);
    });
    t.append(tb);
    wrap.append(el('div', {class:'tab'}, t));
    if (b.aggiungi) wrap.append(el('button', {class:'btn agg', html:SVG.piu + 'Aggiungi riga',
      onclick:() => { STATO[b.id].push(b.col.map(c => c.tipo === 'x' ? false : (c.tipo === 'pres' ? 'P' : ''))); draw(); }}));
  };
  draw();
  return wrap;
}

/* testi fissi e sezioni condizionali si aggiornano a ogni modifica */
function valoreTesto(id){
  if (id === 'scuola') return SCUOLE[SCU].nome;
  const v = STATO[id];
  if (v == null || v === '' || (Array.isArray(v) && !v.length)) return null;
  if (Array.isArray(v)) return v.map(x => x === 'Altro' ? (STATO[id + '_altro'] || 'altro') : x).join(', ');
  if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return dataIT(v);
  if (v === 'Altro') return STATO[id + '_altro'] || 'altro';
  return String(v);
}
function componi(tpl, perSchermo){
  return tpl.replace(/\{(\w+)\}/g, (_, id) => {
    const v = valoreTesto(id === 'as' ? 'as' : id);
    if (!perSchermo) return v || '________';
    return v ? `<span class="val">${esc(v)}</span>` : '<span class="ph">________</span>';
  });
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;'}[c])); }
function condizione(campoId, vale){
  const v = STATO[campoId], vv = Array.isArray(vale) ? vale : [vale];
  return Array.isArray(v) ? v.some(x => vv.includes(x)) : vv.includes(v);
}
function aggiornaDinamici(){
  document.querySelectorAll('[data-fisso]').forEach(d => d.innerHTML = componi(esc(d.dataset.fisso), true));
  document.querySelectorAll('[data-se]').forEach(d => { const [c, v] = JSON.parse(d.dataset.se); d.classList.toggle('nascosto', !condizione(c, v)); });
}

/* =====================================================================
   PDF (jsPDF) – impaginazione A4 verticale compatta
   ===================================================================== */
const PDF = {M:12, W:186, TOP:36, TOPn:20, BOT:282};
const BLU = [18, 62, 144], INK = [28, 36, 51], GRIGIO = [95, 104, 120], LINEA = [200, 207, 220];
const PT = 0.3528; // mm per punto

/* Helvetica standard copre WinAnsi: normalizza cio' che resta fuori */
function pulisci(s){
  return String(s == null ? '' : s)
    .replace(/[‘’ʼ]/g, "'").replace(/[“”«»]/g, '"')
    .replace(/[–—]/g, '-').replace(/…/g, '...').replace(/ /g, ' ')
    .replace(/[☐☑☒]/g, '').replace(/\t/g, '    ')
    .replace(/[^\x09\x0A\x0D\x20-\x7E -ÿ€]/g, '');
}
function vuoto(v){ return v == null || v === '' || v === false || (Array.isArray(v) && (!v.length || v.every(vuoto))) || (typeof v === 'object' && !Array.isArray(v) && !Object.keys(v).length); }

function creaPDF(){
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a4', orientation:'portrait', compress:true});
  const compatto = $('#compatto') ? $('#compatto').checked : true;
  const acc = SCUOLE[SCU].pdf;
  const tint = acc.map(c => Math.round(c + (255 - c) * 0.88));
  let y = 0;

  const font = (st = 'normal', sz = 9.5, col = INK) => { doc.setFont('helvetica', st); doc.setFontSize(sz); doc.setTextColor(...col); };
  const lh = sz => sz * PT * 1.22;
  const split = (t, w, sz, st = 'normal') => { font(st, sz); return doc.splitTextToSize(pulisci(t), w); };

  const intestazione = (prima) => {
    if (prima){
      doc.addImage(LOGO, 'JPEG', PDF.M, 7, 19, 19.5);
      font('bold', 13, BLU); doc.text(SCUOLA_NOME, PDF.M + 23, 13);
      font('bold', 10.5, acc); doc.text(pulisci(SCUOLE[SCU].nome), PDF.M + 23, 18.5);
      font('normal', 7.5, GRIGIO); doc.text(pulisci(SCUOLA_SUB), PDF.M + 23, 23);
      const as = STATO.as ? (SCU === 'N' ? 'Anno educativo ' : 'Anno scolastico ') + STATO.as : '';
      font('normal', 8.5, GRIGIO); if (as) doc.text(pulisci(as), PDF.M + PDF.W, 13, {align:'right'});
      doc.setDrawColor(...acc); doc.setLineWidth(0.6); doc.line(PDF.M, 28.5, PDF.M + PDF.W, 28.5);
      y = 34;
      const tl = split(MOD.titolo.toUpperCase(), PDF.W, 12.5, 'bold');
      font('bold', 12.5, BLU); doc.text(tl, PDF.M + PDF.W / 2, y + 1, {align:'center'}); y += tl.length * lh(12.5) + 0.5;
      if (MOD.sottotitolo){
        const sl = split(MOD.sottotitolo, PDF.W - 20, 8, 'italic');
        font('italic', 8, GRIGIO); doc.text(sl, PDF.M + PDF.W / 2, y + 0.5, {align:'center'}); y += sl.length * lh(8);
      }
      y += 3;
    } else {
      doc.addImage(LOGO, 'JPEG', PDF.M, 6, 9, 9.2);
      font('bold', 8.5, BLU); doc.text(SCUOLA_NOME + ' – ' + pulisci(SCUOLE[SCU].breve), PDF.M + 11, 10.5);
      font('normal', 8, GRIGIO); doc.text(pulisci(MOD.titolo), PDF.M + PDF.W, 10.5, {align:'right'});
      doc.setDrawColor(...acc); doc.setLineWidth(0.4); doc.line(PDF.M, 16.5, PDF.M + PDF.W, 16.5);
      y = PDF.TOPn;
    }
  };
  const nuovaPagina = () => { doc.addPage(); intestazione(false); };
  /* I titoli di sezione restano "in sospeso" finche' non arriva il primo contenuto:
     cosi' una sezione vuota non viene stampata e il titolo non resta orfano a fine pagina. */
  let titoloSospeso = null;
  const spazio = h => {
    if (titoloSospeso){
      const t = titoloSospeso; titoloSospeso = null;
      if (y + 9.7 + Math.max(h, 10) > PDF.BOT) nuovaPagina();
      disegnaTitolo(t);
    }
    if (y + h > PDF.BOT){ nuovaPagina(); return true; }
    return false;
  };

  /* ---- primitive ---- */
  const titolo = (t) => { titoloSospeso = t; };
  const disegnaTitolo = (t) => {
    y += 1.5;
    doc.setFillColor(...tint); doc.rect(PDF.M, y, PDF.W, 6.2, 'F');
    doc.setFillColor(...acc); doc.rect(PDF.M, y, 1.4, 6.2, 'F');
    font('bold', 9, BLU); doc.text(pulisci(t.toUpperCase()), PDF.M + 3.5, y + 4.2);
    y += 8.2;
  };
  const paragrafo = (t, sz = 9.5, st = 'normal', col = INK, x = PDF.M, w = PDF.W) => {
    const lines = split(t, w, sz, st);
    for (const l of lines){ spazio(lh(sz)); font(st, sz, col); doc.text(l, x, y + sz * PT); y += lh(sz); }
    y += 1.2;
  };
  /* celle etichetta/valore affiancate (campi brevi) */
  const celle = (items) => {
    // items: [{label, val, w(12simi)}]
    const pad = 1.6, gap = 0;
    const cols = items.map(it => {
      const w = PDF.W * it.w / 12 - gap;
      const lab = split(it.label || '', w - pad * 2, 6.8, 'bold');
      const val = split(it.val || '', w - pad * 2, 9.3);
      return {it, w, lab, val};
    });
    const h = Math.max(...cols.map(c => pad + c.lab.length * lh(6.8) + c.val.length * lh(9.3) + pad));
    spazio(h);
    let x = PDF.M;
    doc.setDrawColor(...LINEA); doc.setLineWidth(0.2);
    for (const c of cols){
      doc.rect(x, y, c.w, h);
      font('bold', 6.8, GRIGIO); doc.text(c.lab, x + pad, y + pad + 6.8 * PT);
      font('normal', 9.3, INK); doc.text(c.val, x + pad, y + pad + c.lab.length * lh(6.8) + 9.3 * PT + 0.3);
      x += c.w + gap;
    }
    y += h;
  };
  let inCelle = []; // accumula campi brevi consecutivi per impaginarli su righe da 12
  const flushCelle = () => {
    if (!inCelle.length) return;
    let riga = [], tot = 0;
    const out = () => { if (!riga.length) return; const s = riga.reduce((a, r) => a + r.w, 0); riga.forEach(r => r.w = r.w * 12 / s); celle(riga); riga = []; tot = 0; };
    for (const it of inCelle){ if (tot + it.w > 12.01) out(); riga.push(it); tot += it.w; }
    out(); inCelle = []; y += 1.8;
  };
  const areaTesto = (label, testo) => {
    flushCelle();
    spazio(lh(7) + lh(9.5) * 2 + 2);
    font('bold', 7.5, GRIGIO); doc.text(pulisci(label || ''), PDF.M, y + 7.5 * PT); y += lh(7.5) + 0.4;
    const lines = split(testo, PDF.W - 4, 9.5);
    let y0 = y;
    for (const l of lines){
      if (spazio(lh(9.5))) y0 = y;
      font('normal', 9.5, INK); doc.text(l, PDF.M + 3, y + 9.5 * PT);
      y += lh(9.5);
      doc.setDrawColor(...acc); doc.setLineWidth(0.5); doc.line(PDF.M + 0.6, y0, PDF.M + 0.6, y);
    }
    y += 2.4;
  };
  const opzioniComplete = (label, opz, sel, altro) => {
    flushCelle();
    if (label){ spazio(lh(7.5) + 5); font('bold', 7.5, GRIGIO); doc.text(pulisci(label), PDF.M, y + 7.5 * PT); y += lh(7.5) + 0.6; }
    const colW = opz.length > 4 && opz.every(o => o.length < 40) ? PDF.W / 2 : PDF.W;
    let col = 0, rowH = 0;
    for (const o of opz){
      const testo = o === 'Altro' && altro ? `Altro: ${altro}` : o;
      const lines = split(testo, colW - 7, 9);
      const h = lines.length * lh(9) + 0.8;
      if (col === 0) spazio(h);
      const x = PDF.M + col * colW;
      doc.setDrawColor(...GRIGIO); doc.setLineWidth(0.25); doc.rect(x + 0.5, y + 0.6, 2.8, 2.8);
      if (sel.includes(o)){ doc.setDrawColor(...BLU); doc.setLineWidth(0.5); doc.line(x + 0.9, y + 1, x + 2.9, y + 3); doc.line(x + 2.9, y + 1, x + 0.9, y + 3); }
      font('normal', 9, INK); doc.text(lines, x + 5, y + 9 * PT);
      rowH = Math.max(rowH, h);
      if (colW < PDF.W && col === 0){ col = 1; } else { col = 0; y += rowH; rowH = 0; }
    }
    if (col === 1) y += rowH;
    y += 2;
  };
  const tabellaPDF = (label, cols, righe, opts = {}) => {
    flushCelle();
    const tot = cols.reduce((a, c) => a + (c.w || 1), 0);
    const ws = cols.map(c => PDF.W * (c.w || 1) / tot);
    const pad = 1.4, sz = opts.sz || 8.6;
    const header = () => {
      const hl = cols.map((c, j) => split(c.h, ws[j] - pad * 2, 7.6, 'bold'));
      const h = Math.max(...hl.map(l => l.length)) * lh(7.6) + pad * 2;
      let x = PDF.M;
      doc.setDrawColor(...LINEA); doc.setLineWidth(0.2);
      cols.forEach((c, j) => {
        doc.setFillColor(...tint); doc.rect(x, y, ws[j], h, 'FD');
        font('bold', 7.6, BLU); doc.text(hl[j], x + (c.centro ? ws[j] / 2 : pad), y + pad + 7.6 * PT, c.centro ? {align:'center'} : undefined);
        x += ws[j];
      });
      y += h;
    };
    if (label){ spazio(lh(7.5) + 14); font('bold', 7.5, GRIGIO); doc.text(pulisci(label), PDF.M, y + 7.5 * PT); y += lh(7.5) + 0.8; }
    spazio(14); header();
    for (const r of righe){
      const cl = r.map((v, j) => split(v, ws[j] - pad * 2, sz, (opts.primaGrassetto && j === 0) ? 'bold' : 'normal'));
      const h = Math.max(...cl.map(l => l.length || 1)) * lh(sz) + pad * 2;
      if (y + h > PDF.BOT){ nuovaPagina(); header(); }
      let x = PDF.M;
      doc.setDrawColor(...LINEA); doc.setLineWidth(0.2);
      r.forEach((v, j) => {
        if (opts.primaGrassetto && j === 0){ doc.setFillColor(248, 249, 252); doc.rect(x, y, ws[j], h, 'FD'); } else doc.rect(x, y, ws[j], h);
        font((opts.primaGrassetto && j === 0) ? 'bold' : 'normal', sz, INK);
        doc.text(cl[j], x + (cols[j].centro ? ws[j] / 2 : pad), y + pad + sz * PT, cols[j].centro ? {align:'center'} : undefined);
        x += ws[j];
      });
      y += h;
    }
    y += 3;
  };
  const firmePDF = (ruoli, nomi) => {
    flushCelle();
    const n = ruoli.length, perRiga = n === 1 ? 1 : (n === 4 || n === 2 ? 2 : 3);
    const w = PDF.W / perRiga;
    for (let i = 0; i < n; i += perRiga){
      spazio(20);
      y += 3;
      for (let k = 0; k < perRiga && i + k < n; k++){
        const x = PDF.M + k * w, cx = x + w / 2;
        font('bold', 8.5, INK); doc.text(pulisci(ruoli[i + k]), cx, y + 3, {align:'center'});
        if (nomi[i + k]){ font('normal', 8.5, GRIGIO); doc.text(pulisci(nomi[i + k]), cx, y + 7, {align:'center'}); }
        doc.setDrawColor(...GRIGIO); doc.setLineWidth(0.25); doc.line(x + 8, y + 15, x + w - 8, y + 15);
      }
      y += 18;
    }
  };

  /* ---- percorso dei blocchi ---- */
  const percorri = (blocchi) => {
    for (let k = 0; k < blocchi.length; k++){
      const b = blocchi[k];
      if (b.nopdf) continue; // campo gia' riportato in una formula (testofisso)
      switch (b.t){
        case 'h': flushCelle(); titolo(b.testo); break;
        case 'nota': break;
        case 'salto': flushCelle(); if (!titoloSospeso) nuovaPagina(); break;
        case 'se': if (condizione(b.campo, b.vale)) percorri(b.blocchi); break;
        case 'riga': b.campi.forEach(c => percorri([Object.assign({}, c, {_inRiga:true})])); break;
        case 'testo': case 'data': case 'ora': case 'num': case 'scelta': {
          let v = b.t === 'data' ? dataIT(STATO[b.id]) : STATO[b.id];
          if (b.t === 'scelta' && v === 'Altro') v = 'Altro: ' + (STATO[b.id + '_altro'] || '');
          if (b.t === 'scelta' && !compatto && !b._inRiga){ opzioniComplete(b.label, [...b.opz, ...(b.altro ? ['Altro'] : [])], [STATO[b.id]], STATO[b.id + '_altro']); break; }
          if (compatto && vuoto(v)) break;
          inCelle.push({label:b.label, val:v || '', w:b.w || (b.t === 'testo' ? 12 : 4)});
          break;
        }
        case 'area': {
          const v = STATO[b.id];
          if (compatto && vuoto(v)) break;
          if ((v || '').length < 70 && !(v || '').includes('\n') && compatto){ inCelle.push({label:b.label, val:v, w:b.w || 12}); break; }
          areaTesto(b.label, v || '');
          break;
        }
        case 'multi': {
          const sel = STATO[b.id] || [];
          if (compatto){
            if (!sel.length) break;
            const voci = sel.map(x => x === 'Altro' ? 'Altro: ' + (STATO[b.id + '_altro'] || '') : x);
            const breve = voci.join('; ');
            if (breve.length < 90) inCelle.push({label:b.label || '', val:breve, w:b.w || 12});
            else { flushCelle(); if (b.label){ spazio(8); font('bold', 7.5, GRIGIO); doc.text(split(b.label, PDF.W, 7.5, 'bold'), PDF.M, y + 7.5 * PT); y += split(b.label, PDF.W, 7.5, 'bold').length * lh(7.5) + 0.6; }
              for (const v of voci){ const l = split(v, PDF.W - 6, 9.3); spazio(l.length * lh(9.3)); doc.setFillColor(...acc); doc.circle(PDF.M + 1.6, y + 1.9, 0.7, 'F'); font('normal', 9.3, INK); doc.text(l, PDF.M + 4.5, y + 9.3 * PT); y += l.length * lh(9.3) + 0.3; }
              y += 2; }
          } else opzioniComplete(b.label, [...b.opz, ...(b.altro ? ['Altro'] : [])], sel, STATO[b.id + '_altro']);
          break;
        }
        case 'testofisso': {
          flushCelle();
          const nx = blocchi[k + 1];
          if (nx && nx.t === 'firme'){ const righe = split(componi(b.testo, false), PDF.W, 9.5).length; spazio(righe * lh(9.5) + 24); }
          paragrafo(componi(b.testo, false)); break;
        }
        case 'elenco': {
          const voci = (STATO[b.id] || []).filter(v => v && v.trim());
          if (compatto && !voci.length) break;
          flushCelle();
          if (b.label){ spazio(8); font('bold', 7.5, GRIGIO); doc.text(pulisci(b.label), PDF.M, y + 7.5 * PT); y += lh(7.5) + 0.6; }
          (voci.length ? voci : ['', '', '']).forEach((v, i) => {
            const l = split(v || '________________________________', PDF.W - 8, 9.5);
            spazio(l.length * lh(9.5));
            font('bold', 9.5, BLU); doc.text((i + 1) + '.', PDF.M + 5, y + 9.5 * PT, {align:'right'});
            font('normal', 9.5, INK); doc.text(l, PDF.M + 7, y + 9.5 * PT); y += l.length * lh(9.5) + 0.4;
          });
          y += 2;
          break;
        }
        case 'tabella': {
          const dati = STATO[b.id] || [];
          const cols = b.col.map(c => ({h:c.h, w:c.w || 1, centro:['x', 'pres', 'sn'].includes(c.tipo)}));
          let righe = dati.map((r, i) => r.map((v, j) => {
            if (b.fisse && j === 0) return b.fisse[i];
            if (b.col[j].tipo === 'x') return v ? 'X' : '';
            return v == null ? '' : String(v);
          }));
          // una riga e' utile se contiene dati diversi da quelli precompilati (es. solo il ruolo)
          const init = b.init || [];
          const utile = (r, i) => r.some((v, j) => !(b.fisse && j === 0) && b.col[j].tipo !== 'pres' && v !== '' && !(init[i] && init[i][j] === dati[i][j]));
          if (compatto) righe = righe.filter(utile);
          if (!righe.length){ break; }
          tabellaPDF(b.label, cols, righe, {primaGrassetto:!!b.fisse});
          break;
        }
        case 'matrice': {
          const val = STATO[b.id] || {};
          let righe = b.voci.map((v, i) => [v, ...b.opz.map(o => val[i] === o ? 'X' : '')]);
          if (compatto) righe = righe.filter((r, i) => val[i]);
          if (!righe.length) break;
          tabellaPDF(b.label, [{h:'', w:5}, ...b.opz.map(o => ({h:o, w:1.3, centro:true}))], righe, {primaGrassetto:true});
          break;
        }
        case 'firme': percorriFirme(b); break;
        case 'libere': {
          flushCelle();
          for (const sz of (STATO[b.id] || [])){
            if (compatto && !sz.titolo.trim() && !sz.testo.trim()) continue;
            if (b.sottotitoli){ areaTesto(sz.titolo || '', sz.testo || ''); }
            else { titolo(sz.titolo || 'Sezione'); paragrafo(sz.testo || ''); }
          }
          break;
        }
      }
    }
  };
  const percorriFirme = (b) => { flushCelle(); firmePDF(b.ruoli, b.ruoli.map((_, i) => (STATO[b.id] || {})[i] || '')); };

  intestazione(true);
  percorri(BLOCCHI);
  flushCelle();

  /* piè di pagina con numerazione */
  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++){
    doc.setPage(i);
    doc.setDrawColor(...LINEA); doc.setLineWidth(0.2); doc.line(PDF.M, 287, PDF.M + PDF.W, 287);
    font('normal', 7, GRIGIO);
    doc.text('Scuola Sacra Famiglia – Orzinuovi (BS) · sacrafamiglia.edu.it', PDF.M, 291);
    doc.text(`Pagina ${i} di ${n}`, PDF.M + PDF.W, 291, {align:'right'});
  }
  doc.setProperties({title:pulisci(MOD.titolo), subject:pulisci(SCUOLE[SCU].nome), creator:'Modulistica docenti – Scuola Sacra Famiglia'});
  return doc;
}

function nomeFile(){
  const base = (MOD.file || MOD.id).replace(/[^A-Za-z0-9_-]+/g, '_');
  const d = STATO.data || oggiISO();
  return `${base}_${SCUOLE[SCU].breve}_${d}.pdf`;
}
let URL_ANTEPRIMA = null;
function anteprima(){
  if (!window.jspdf){ alert('Libreria PDF non caricata: controlla la connessione e ricarica la pagina.'); return; }
  const doc = creaPDF();
  if (URL_ANTEPRIMA) URL.revokeObjectURL(URL_ANTEPRIMA);
  URL_ANTEPRIMA = URL.createObjectURL(doc.output('blob'));
  const chiudi = () => { m.remove(); URL.revokeObjectURL(URL_ANTEPRIMA); URL_ANTEPRIMA = null; };
  const m = el('div', {class:'modal', onclick:e => { if (e.target === m) chiudi(); }},
    el('div', {class:'box'},
      el('div', {class:'hd'}, el('b', {}, 'Anteprima PDF – ' + MOD.titolo),
        el('button', {class:'btn pri', html:SVG.scarica + 'Salva PDF', onclick:() => { chiudi(); scarica(); }}),
        el('button', {class:'btn', html:SVG.chiudi + 'Chiudi', onclick:chiudi})),
      el('iframe', {src:URL_ANTEPRIMA, title:'Anteprima PDF'})));
  document.body.append(m);
}
function scarica(){
  if (!window.jspdf){ alert('Libreria PDF non caricata: controlla la connessione e ricarica la pagina.'); return; }
  const doc = creaPDF();
  doc.save(nomeFile());
  SPORCO = false;
  const m = el('div', {class:'modal'}, el('div', {class:'box small'},
    el('h3', {}, 'PDF salvato'),
    el('p', {}, `Il file "${nomeFile()}" è stato scaricato sul dispositivo. Caricalo sul registro elettronico e poi eliminalo dalla cartella Download.`),
    el('p', {}, 'Vuoi cancellare i dati del modulo e tornare all’elenco?'),
    el('div', {class:'az'},
      el('button', {class:'btn', onclick:() => m.remove()}, 'Resta nel modulo'),
      el('button', {class:'btn pri', onclick:() => { m.remove(); home(); }}, 'Cancella e torna all’elenco'))));

    id:'disciplinare', argomento:'tutela', scuole:['S'], file:'Verbale_consiglio_straordinario',
    titolo:'Verbale di Consiglio di classe straordinario',
    sottotitolo:'Procedimento disciplinare – D.P.R. 249/1998 come modificato dal D.P.R. 134/2025',
    descrizione:'Contestazione, audizione e delibera del provvedimento disciplinare',
    blocchi:(s) => [
      ...H.testata(s, [{t:'testo', id:'n_verbale', label:'Verbale n.'}, {t:'testo', id:'classe', label:'Classe'}]),
      {t:'riga', campi:[{t:'testo', id:'alunno', label:'Alunno/a', w:4}, {t:'testo', id:'contestazione', label:'Contestazione addebiti (prot. / data)', w:4}, {t:'testo', id:'convocazione', label:'Convocazione (prot. / data)', w:4}]},
      ...H.apertura('il Consiglio di classe in seduta straordinaria, nella composizione prevista dal regolamento di disciplina'),
      ...H.odg(['Esame dei fatti contestati', 'Audizione dell’alunno/a alla presenza dei genitori', 'Deliberazione in merito al provvedimento disciplinare']),
      ...H.presenti(['Coordinatore didattico (Presidente)', 'Coordinatore di classe', 'Docente', 'Docente', 'Docente', 'Rappresentante dei genitori', 'Rappresentante dei genitori']),
      ...H.presidenza('Coordinatore didattico'),
      {t:'nota', testo:'Il rappresentante dei genitori in conflitto di interessi si astiene dalla deliberazione. Nomi di vittime o testimoni minorenni: «omissis» o iniziali.'},
      {t:'h', testo:'1. Fatti contestati'},
      {t:'riga', campi:[{t:'testo', id:'quando', label:'Data, luogo e circostanze', w:6}, {t:'testo', id:'fonti', label:'Fonti (chi ha rilevato / riferito)', w:6}]},
      {t:'testo', id:'norma', label:'Norma del regolamento violata'},
      {t:'area', id:'fatti', label:'Descrizione oggettiva dei fatti', righe:4},
      {t:'h', testo:'2. Audizione'},
      {t:'riga', campi:[{t:'ora', id:'ora_ammissione', label:'Ore ammissione', w:3}, {t:'scelta', id:'genitori', label:'Genitori', opz:['presenti', 'assenti, regolarmente convocati'], w:6}, {t:'ora', id:'ora_uscita', label:'Ore uscita', w:3}]},
      {t:'area', id:'audizione', label:'Sintesi della versione dell’alunno/a e delle osservazioni dei genitori', righe:4},
      {t:'h', testo:'3. Valutazione e deliberazione'},
      {t:'area', id:'valutazione', label:'Gravità, conseguenze, situazione personale; proporzionalità e gradualità (art. 4 c. 5)', righe:4},
      {t:'scelta', id:'provvedimento', label:'Provvedimento deliberato', opz:[
        'Nessun provvedimento / richiamo',
        'Allontanamento fino a 2 giorni, con attività di approfondimento sulle conseguenze dei comportamenti svolte a scuola (art. 4 c. 8-bis)',
        'Allontanamento da 3 a 15 giorni, con attività di cittadinanza attiva e solidale presso struttura convenzionata o, in mancanza, a favore della comunità scolastica',
        'Proposta al Consiglio d’istituto di allontanamento oltre i 15 giorni']},
      {t:'riga', campi:[{t:'testo', id:'durata', label:'Durata e date', w:4}, {t:'testo', id:'attivita', label:'Attività previste e docente / referente incaricato', w:8}]},
      {t:'testo', id:'struttura', label:'Struttura convenzionata (se prevista)'},
      {t:'riga', campi:[{t:'num', id:'fav', label:'Favorevoli', w:3}, {t:'num', id:'con', label:'Contrari', w:3}, {t:'num', id:'ast', label:'Astenuti', w:3}, {t:'scelta', id:'esito', label:'Esito', opz:['approvato', 'respinto'], w:3}]},
      {t:'testofisso', testo:'Il provvedimento sarà comunicato per iscritto alla famiglia, con l’indicazione che contro di esso è ammesso ricorso all’Organo di garanzia interno entro 15 giorni dalla comunicazione (art. 5 D.P.R. 249/1998).'},
      {t:'nota', testo:'Verificare che regolamento di disciplina e Patto di corresponsabilità siano adeguati al D.P.R. 134/2025 e l’elenco USR Lombardia delle strutture per la cittadinanza solidale.'},
      ...H.chiusura(),
    ],
  });

  /* ---------- VERBALE RISERVATO: SITUAZIONE DI DISAGIO ---------- */
  registra({
    id:'disagio', argomento:'tutela', scuole:['N', 'I', 'P', 'S'], file:'Verbale_riservato',
    titolo:'Verbale riservato – situazione di disagio',
    sottotitolo:'Documento riservato – conservazione separata dal fascicolo ordinario',
    descrizione:'Fatti osservati, valutazione del Coordinatore ed eventuale segnalazione',
    blocchi:(s) => [
      ...H.testata(s, [{t:'testo', id:'codice', label:ALUNNO[s] + ' (codice)'}, {t:'testo', id:'sezione', label:SEZ[s]}]),
      {t:'nota', testo:'Procedura: chi osserva annota subito solo fatti e parole testuali del minore tra virgolette, con data e ora, e consegna la nota al Coordinatore. Non si svolgono indagini, non si interroga il minore, non si fanno domande suggestive. Se si sospetta maltrattamento o abuso la famiglia non va informata prima della valutazione del Coordinatore.'},
      {t:'tabella', id:'partecipanti', label:'Partecipanti (ristretti)', col:[{h:'Cognome e nome', w:6}, {h:'Ruolo', w:6}], righe:3,
        init:[['', s === 'N' ? 'Coordinatrice pedagogica' : 'Coordinatore didattico'], ['', s === 'N' ? 'Educatrice che ha osservato' : 'Docente che ha osservato'], ['', 'Referente']], aggiungi:true},
      {t:'h', testo:'Fatti osservati'},
      {t:'tabella', id:'fatti', col:[{h:'Data e ora', w:2}, {h:'Chi ha osservato', w:3}, {h:'Fatto osservato / parole testuali del minore', w:7, tipo:'area'}], righe:3, aggiungi:true},
      {t:'h', testo:'Valutazione e decisione del Coordinatore'},
      {t:'multi', id:'decisione', label:'Decisione', opz:[
        'Monitoraggio e osservazione con nuova valutazione',
        'Colloquio con la famiglia (solo se non pregiudizievole per il minore)',
        'Attivazione dei servizi sociali del Comune',
        'Segnalazione alla Procura della Repubblica presso il Tribunale per i minorenni (situazione di pregiudizio)',
        'Denuncia all’Autorità giudiziaria (reato perseguibile d’ufficio, art. 331 c.p.p.)']},
      {t:'area', id:'motivazione', label:'Motivazione'},
      {t:'riga', campi:[{t:'testo', id:'atto', label:'Estremi dell’atto trasmesso (prot. / data)', w:6}, {t:'testo', id:'destinatario', label:'Destinatario', w:6}]},
      {t:'nota', testo:'Il personale delle scuole paritarie è di regola incaricato di pubblico servizio: l’omessa denuncia di reati perseguibili d’ufficio è sanzionata (artt. 361-362 c.p.). Questo PDF NON va caricato sul registro elettronico: si consegna al Coordinatore per la conservazione riservata.'},
      {t:'testofisso', testo:'Letto, confermato e sottoscritto.'},
      {t:'firme', ruoli:['Il Coordinatore', 'Il verbalizzante']},
    ],
  });
})();

</script>
<script data-schemi="inclusione">
/* =====================================================================
   INCLUSIONE: GLO (iniziale, intermedio, finale, PEI provvisorio),
   incontro di rete al nido, moduli BES e condivisione PDP.
   Riferimenti: art. 15 c. 10 L. 104/1992; D.Lgs. 66/2017 mod. D.Lgs. 96/2019;
   D.I. 182/2020 coordinato con D.I. 153/2023; D.Lgs. 62/2024 (Brescia in
   sperimentazione dal 1/1/2025, avvio nazionale 1/1/2027);
   L. 170/2010, D.M. 5669/2011, Dir. 27/12/2012, C.M. 8/2013.
   Nota: nei verbali non si trascrivono diagnosi, si rinvia alla
   documentazione agli atti (prot.).
   ===================================================================== */
(() => {
  /* ---------- utilita' comuni ---------- */
  const AL = s => s === 'I' ? 'bambino/a' : 'alunno/a';
  const AL_CAP = s => s === 'I' ? 'Bambino/a' : 'Alunno/a';
  const CLASSE = s => s === 'I' ? 'Sezione' : 'Classe';
  const TEAM = s => ({I:'Docenti di sezione', P:'Team docenti', S:'Consiglio di classe'})[s];
  const TEAM_ART = s => ({I:'dai docenti di sezione', P:'dal Team docenti', S:'dal Consiglio di classe'})[s];
  const GLO_SOTTO = 'Art. 15 c. 10-11 L. 104/1992 – D.Lgs. 66/2017 mod. D.Lgs. 96/2019 – D.I. 182/2020 mod. D.I. 153/2023';

  const DIMENSIONI = [
    'Dimensione della relazione, dell’interazione e della socializzazione',
    'Dimensione della comunicazione e del linguaggio',
    'Dimensione dell’autonomia e dell’orientamento',
    'Dimensione cognitiva, neuropsicologica e dell’apprendimento',
  ];
  const DIM_BREVI = ['Relazione, interazione e socializzazione', 'Comunicazione e linguaggio',
    'Autonomia e orientamento', 'Cognitiva, neuropsicologica e dell’apprendimento'];

  const OBIETTIVI_GEN = (successivo) => [
    'Potenziare l’autonomia globale, personale, sociale, scolastica',
    'Favorire l’inclusione con il gruppo dei pari e con gli adulti',
    'Incrementare la soglia dell’attenzione verso le proposte didattiche/educative',
    'Stimolare/potenziare le abilità cognitive',
    'Migliorare la qualità della vita dell’alunno/a, l’autostima e l’autodeterminazione',
    successivo ? 'Rispettare le regole del nuovo ambiente scolastico' : 'Rispettare le regole dell’ambiente scolastico',
    'Favorire il successo formativo dell’alunno/a',
  ];

  const LIVELLI = ['parziale', 'sufficiente', 'adeguato', 'soddisfacente'];
  const MOTIVAZIONI = [
    'A causa delle specifiche caratteristiche di funzionamento dell’alunno/a è necessario lavorare ciclicamente sugli obiettivi dichiarati per consentirne l’acquisizione/consolidamento',
    'È necessario lavorare ancora sugli obiettivi dichiarati per consolidarli',
  ];

  /* dati alunno + riferimenti della seduta */
  const datiGLO = (s) => [
    ...H.testata(s, [
      {t:'testo', id:'alunno', label:`${AL_CAP(s)} (iniziali o codice)`},
      {t:'testo', id:'classe', label:CLASSE(s)}]),
    {t:'riga', campi:[
      {t:'testo', id:'n_verbale', label:'Verbale n.', w:2},
      {t:'testo', id:'convocazione', label:'Convocazione individuale (prot. n. e data)', w:5},
      {t:'testo', id:'decreto_glo', label:'Decreto di costituzione del GLO (prot. n. e data)', w:5}]},
    H.privacy(),
    {t:'nota', testo:'Verbale con dati relativi alla salute (art. 9 GDPR): conservazione nel fascicolo personale riservato, accesso ai soli componenti del GLO. Convocazioni sempre individuali; non pubblicare in aree del registro visibili alla classe.'},
  ];

  /* apertura della seduta */
  const aperturaGLO = (s) => [
    {t:'h', testo:'Apertura della seduta'},
    ...H.apertura(`il Gruppo di Lavoro Operativo per l’inclusione (GLO) relativo al/alla ${AL(s)} {alunno}, ${CLASSE(s).toLowerCase()} {classe}, della {scuola}`),
    {t:'nota', testo:'La modalità a distanza è ammessa in forma telematica sincrona (art. 4 D.I. 182/2020). Indicare il luogo (es. aula Sportello Benessere) o la piattaforma.'},
  ];

  /* composizione del GLO: righe fisse per componente */
  const composizioneGLO = (s) => {
    const fisse = [TEAM(s), 'Docente di sostegno', 'Referente / F.S. Inclusione',
      'Servizi socio-sanitari (UONPIA – UMV)', 'Genitori / esercenti la responsabilità genitoriale',
      'Assistente all’autonomia e alla comunicazione',
      'Altre figure professionali specifiche, interne ed esterne alla scuola'];
    if (s === 'S') fisse.push('Alunno/a (per la parte che lo/la riguarda)');
    return [
      {t:'h', testo:'Composizione del GLO'},
      {t:'testofisso', testo:'Si è riunito il Gruppo di Lavoro Operativo così composto:'},
      {t:'tabella', id:'glo_comp', col:[{h:'Componente', w:4}, {h:'Nominativi', w:6, tipo:'area'}, {h:'Presenza', w:2, tipo:'pres'}],
       fisse, init:fisse.map(() => ['', '', 'P'])},
      {t:'nota', testo:'Presenza: P = presente, A = assente, AG = assente giustificato. La seduta è valida anche se non tutte le componenti sono rappresentate (art. 4 D.I. 182/2020). L’esperto indicato dalla famiglia partecipa a titolo consultivo e non decisionale.'},
    ];
  };

  const presidenzaGLO = () => [{t:'h', testo:'Presidenza'}, ...H.presidenza('Coordinatore didattico')];

  /* documentazione agli atti (senza diagnosi) */
  const documentazione = (pref, label = 'Documentazione agli atti') => [
    {t:'multi', id:pref + '_doc', label, col:2, altro:true, opz:[
      'Verbale di accertamento della condizione di disabilità (L. 104/1992)',
      'Certificazione ai fini dell’inclusione scolastica',
      'Profilo di funzionamento (D.Lgs. 66/2017)',
      'Certificazione INPS – valutazione di base (D.Lgs. 62/2024)']},
    {t:'riga', campi:[
      {t:'data', id:pref + '_doc_data', label:'Data del documento', w:4},
      {t:'testo', id:pref + '_doc_prot', label:'Protocollo di acquisizione (prot. n.)', w:8}]},
    {t:'nota', testo:'Non trascrivere diagnosi o codici ICD: indicare solo il tipo di documento esaminato, la data e il protocollo. Con il D.Lgs. 62/2024 (Brescia in sperimentazione) possono coesistere documenti di regimi diversi.'},
  ];

  /* verifica degli obiettivi (intermedia o finale) */
  const verificaPEI = (s, titolo) => {
    const didattici = s === 'I' ? 'Obiettivi educativo-didattici (campi di esperienza)' : 'Obiettivi didattici';
    const voci = [...DIMENSIONI.map((d, i) => `${i + 1}. ${d}`), didattici];
    const brevi = [...DIM_BREVI, didattici];
    const out = [
      {t:'h', testo:titolo},
      {t:'nota', testo:'Per ogni dimensione indicare il livello di raggiungimento degli obiettivi dichiarati nel PEI e le motivazioni.'},
      {t:'matrice', id:'ver_livelli', label:'Gli obiettivi dichiarati nel PEI sono stati raggiunti in modo:', voci, opz:LIVELLI},
    ];
    brevi.forEach((b, i) => out.push(
      {t:'multi', id:`ver_mot_${i + 1}`, label:`Motivazioni – ${b}`, opz:MOTIVAZIONI, altro:true}));
    out.push({t:'area', id:'ver_note', label:'Eventuali osservazioni sulla verifica', righe:3});
    return out;
  };

  /* sotto-sezione di modifica: scelta + blocchi condizionali */
  const sezModifica = (id, titolo, blocchi, nessuna) => [
    {t:'scelta', id, label:titolo, opz:['Nessuna modifica', 'Modifiche'], def:'Nessuna modifica', w:12,
     nota:'Nessuna modifica: ' + nessuna},
    {t:'se', campo:id, vale:'Modifiche', blocchi},
  ];
  const quattroDim = (pref) => DIM_BREVI.map((d, i) =>
    ({t:'area', id:`${pref}_${i + 1}`, label:d, righe:2, ph:'Punti di forza e/o aree di miglioramento oggetto di revisione'}));

  const modifichePEI = (s, lettera) => {
    const out = [
      {t:'h', testo:`${lettera}. Modifiche e integrazioni al PEI`},
      {t:'nota', testo:'Per ogni sezione scegliere "Modifiche" solo se si revisiona il PEI: compaiono i campi da compilare. Aggiornare poi le corrispondenti sezioni del PEI.'},
      ...sezModifica('mod_glo', 'Composizione del GLO', [
        {t:'tabella', id:'mod_glo_tab', label:'Modifiche e/o integrazioni alla composizione del GLO successive alla prima convocazione',
         col:[{h:'Data', w:2}, {h:'Cognome e nome', w:3}, {h:'Titolo o ruolo nel GLO', w:3}, {h:'Variazione (nuovo membro, sostituzione...)', w:4}],
         righe:2, aggiungi:true}],
        'non ci sono modifiche o integrazioni alla composizione del GLO successive alla prima convocazione.'),
      ...sezModifica('mod_oss', 'Osservazioni sull’alunno/a per progettare gli interventi di sostegno',
        quattroDim('mod_oss'),
        'non ci sono modifiche o integrazioni alle osservazioni sull’alunno/a per progettare gli interventi di sostegno didattico.'),
      ...sezModifica('mod_int', 'Interventi per l’alunno/a: obiettivi educativi e didattici, strumenti, strategie e modalità',
        quattroDim('mod_int'),
        'non ci sono modifiche o integrazioni agli interventi per l’alunno/a (obiettivi, strumenti, strategie e modalità).'),
      ...sezModifica('mod_ctx', 'Osservazioni sul contesto: barriere e facilitatori', [
        {t:'area', id:'mod_ctx_txt', label:'Punti oggetto di revisione', righe:3}],
        'non ci sono modifiche o integrazioni alle osservazioni sul contesto (barriere e facilitatori).'),
      ...sezModifica('mod_ictx', 'Interventi sul contesto per realizzare un ambiente di apprendimento inclusivo', [
        {t:'area', id:'mod_ictx_txt', label:'Punti oggetto di revisione', righe:3}],
        'non ci sono modifiche o integrazioni agli interventi sul contesto.'),
      ...sezModifica('mod_prog', s === 'I' ? 'Progettazione educativa (campi di esperienza)' : 'Progettazione disciplinare', [
        {t:'tabella', id:'mod_prog_tab', label:'Punti oggetto di revisione',
         col:[{h:s === 'I' ? 'Campo di esperienza' : 'Disciplina', w:3}, {h:s === 'I' ? 'Obiettivi e traguardi' : 'Obiettivi didattici', w:9, tipo:'area'}],
         righe:2, aggiungi:true}],
        'non ci sono modifiche o integrazioni alla progettazione.'),
    ];
    if (s !== 'I') out.push(
      ...sezModifica('mod_comp', 'Criteri di valutazione del comportamento ed eventuali obiettivi specifici', [
        {t:'area', id:'mod_comp_crit', label:'Criteri di valutazione', righe:2},
        {t:'area', id:'mod_comp_ob', label:'Obiettivi personalizzati', righe:2}],
        'non ci sono modifiche o integrazioni ai criteri di valutazione del comportamento e agli obiettivi specifici.'));
    out.push(
      ...sezModifica('mod_ris', 'Risorse professionali, terapie, interventi extrascolastici', [
        {t:'tabella', id:'mod_ris_tab', label:'Punti oggetto di revisione (risorse professionali dedicate, terapie e altro)',
         col:[{h:'Voce', w:4}, {h:'Revisione', w:8, tipo:'area'}],
         fisse:['Docente di sostegno', 'Assistente ad personam / all’autonomia', 'Altra figura',
           'Terapie in orario extrascolastico', 'Altri tipi di attività', 'Altro']}],
        'non ci sono modifiche o integrazioni alle risorse professionali, terapie, interventi extrascolastici.'));
    return out;
  };

  /* entita' delle difficolta', ore e richieste (verifica finale, PEI provvisorio) */
  const fabbisogno = (s) => [
    {t:'scelta', id:'entita', label:'Entità delle difficoltà nello svolgimento delle attività (Tab. C1)',
     opz:['assente', 'lieve', 'media', 'elevata', 'molto elevata'], col:5},
    {t:'riga', campi:[
      {t:'num', id:'ore_sost', nopdf:true, label:'Docente di sostegno: ore settimanali proposte', w:4},
      {t:'num', id:'ore_ass', nopdf:true, label:'Assistente all’autonomia e comunicazione: ore', w:4},
      {t:'num', id:'ore_edu', label:'Assistenza educativa: ore', w:4}]},
    {t:'area', id:'ore_motivazione', label:'Motivazione della proposta', righe:3,
     ph:'Collegare la proposta al Profilo di funzionamento / alla documentazione agli atti e agli obiettivi del PEI'},
    {t:'testofisso', testo:'Il GLO stabilisce, per l’anno scolastico successivo: docente di sostegno ore {ore_sost}; assistente per l’autonomia e la comunicazione ore {ore_ass}.'},
    {t:'tabella', id:'richieste', label:'Determinazione delle "effettive esigenze" (art. 7 c. 2 lett. d D.Lgs. 66/2017 – D.I. 182/2020)',
     col:[{h:'Richiesta', w:5}, {h:'Sì / No', w:2, tipo:'sn'}, {h:'Specificare', w:5}],
     fisse:['Assistenza educativa', 'Ausili specifici', 'Servizi di trasporto', 'Assistenza igienica e di base']},
    {t:'nota', testo:'Scuola paritaria: il docente di sostegno è a carico del gestore; la proposta di ore ha valore organizzativo e di rendicontazione. Verificare con il gestore e con l’USR Lombardia gli adempimenti (anche l’eventuale uso della piattaforma PEI digitale).'},
  ];

  const approvazione = (oggetto) => [
    {t:'scelta', id:'approvazione', nopdf:true, label:'Esito della deliberazione', opz:['all’unanimità', 'a maggioranza'], w:12},
    {t:'testofisso', testo:oggetto},
    {t:'se', campo:'approvazione', vale:'a maggioranza', blocchi:[
      {t:'area', id:'approvazione_voti', label:'Esito della votazione e componenti dissenzienti', righe:2}]},
  ];

  const dichiarazioni = () => [
    {t:'h', testo:'Dichiarazioni a verbale e posizioni difformi'},
    {t:'area', id:'dichiarazioni', label:'Dichiarazioni richieste dai componenti e motivazione delle decisioni che se ne discostano (art. 3 c. 9 D.I. 182/2020)', righe:3},
  ];

  const chiusuraGLO = () => H.chiusura(['Il Segretario', 'Il Presidente']);

  /* =====================================================================
     1. GLO INIZIALE
     ===================================================================== */
  registra({
    id:'glo-iniziale',
    titolo:'Verbale GLO iniziale',
    sottotitolo:GLO_SOTTO,
    descrizione:'Presentazione del caso e approvazione del PEI (entro il 31 ottobre)',
    argomento:'glo',
    scuole:['I', 'P', 'S'],
    file:'GLO_iniziale',
    blocchi:(s) => {
      const disc = s === 'I' ? 'Campi di esperienza' : 'Discipline';
      const tipologie = s === 'I' ? [
        'Segue la progettazione educativa della sezione, con gli stessi criteri di osservazione e valutazione',
        'Segue la progettazione educativa della sezione, con criteri di osservazione e valutazione personalizzati',
        'Rispetto alla progettazione della sezione sono applicate personalizzazioni negli obiettivi e nei traguardi dei campi di esperienza e nei criteri di osservazione e valutazione',
      ] : [
        'Segue la progettazione didattica della classe e si applicano gli stessi criteri di valutazione',
        'Segue la progettazione didattica della classe e si applicano criteri di valutazione personalizzati',
        'Rispetto alla progettazione didattica della classe sono applicate personalizzazioni negli obiettivi di apprendimento (conoscenze, abilità, traguardi di competenza) e nei criteri di valutazione',
      ];
      const out = [
        ...datiGLO(s),
        {t:'nota', testo:'Scadenza: approvazione del PEI entro il 31 ottobre (art. 15 c. 10 L. 104/1992, D.I. 182/2020).'},
        ...aperturaGLO(s),
        ...composizioneGLO(s),
        ...presidenzaGLO(),
        ...H.odg(['A. Presentazione del caso', 'B. Ore / risorse per il corrente anno scolastico',
          'C. Individuazione degli obiettivi generali', 'D. Definizione della programmazione educativo-didattica',
          'E. Approvazione del PEI', 'F. Varie ed eventuali']),

        {t:'h', testo:'A. Presentazione del caso'},
