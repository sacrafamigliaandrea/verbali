      righe:init.length + 1, aggiungi:true, init,
      ...(obbl ? {obbl:true, rif:obbl} : {})};
  };

  /* revisione intermedia e verifica conclusiva: data + punti */
  const FRASI_REV = [
    'Non si rendono necessarie revisioni: obiettivi e interventi restano confermati.',
    'Alcuni obiettivi sono stati raggiunti e vengono sostituiti con obiettivi di livello successivo.',
    'Si rimodulano gli obiettivi non ancora raggiunti, riducendone la complessità.',
    'Si introducono nuovi strumenti (agenda visiva, sintesi vocale, mappe) per sostenere la partecipazione.',
    'Si riducono i tempi delle attività individualizzate a favore del lavoro nel gruppo.',
    'Le modifiche sono state condivise con la famiglia nel corso della riunione del GLO.'];
  const FRASI_VER = [
    'Gli obiettivi previsti sono stati pienamente raggiunti.',
    'Gli obiettivi sono stati raggiunti in parte; si propone di riprenderli nel prossimo anno scolastico.',
    'Si osservano progressi significativi rispetto alla situazione di partenza.',
    'Le strategie adottate (lavoro in piccolo gruppo, supporti visivi) si sono rivelate efficaci.',
    'Alcuni strumenti sono risultati poco efficaci e se ne propone la sostituzione.',
    'La verifica è stata condotta con osservazioni sistematiche e prove strutturate, documentate agli atti.'];
  const rev = (n, label = 'Specificare i punti oggetto di eventuale revisione') => ({t:'se', campo:'fasi', vale:RI, blocchi:[
    {t:'riga', campi:[{t:'data', id:`rev${n}_data`, label:'Revisione a seguito di verifica intermedia – data', w:5}]},
    {t:'area', id:`rev${n}`, label, righe:3, ph:'es. Obiettivo 2 raggiunto: sostituito con un obiettivo di livello successivo; introdotta l’agenda visiva.', frasi:FRASI_REV}]});
  const ver = (n, label = 'Con verifica dei risultati conseguiti e valutazione sull’efficacia di interventi, strategie e strumenti') => ({t:'se', campo:'fasi', vale:VF, blocchi:[
    {t:'riga', campi:[{t:'data', id:`ver${n}_data`, label:'Verifica conclusiva degli esiti – data', w:5}]},
    {t:'area', id:`ver${n}`, label, righe:4, ph:'es. Obiettivi raggiunti in parte; efficace il lavoro in piccolo gruppo, da riproporre.', frasi:FRASI_VER}]});

  /* assistenza di base/specialistica ed esigenze sanitarie (Sez. verifica finale e PEI provvisorio) */
  const assistenza = (p, s) => [
    {t:'multi', id:`${p}_base`, label:'Assistenza di base (per azioni di mera assistenza materiale, non riconducibili ad interventi educativi)', opz:['igienica', 'spostamenti', 'mensa'], altro:true, col:4},
    {t:'area', id:`${p}_base_dati`, label:'Dati relativi all’assistenza di base (collaboratori scolastici, organizzazione oraria ritenuta necessaria)', righe:2,
      ph:'es. un collaboratore scolastico per il cambio e gli spostamenti, circa 30 minuti al giorno'},
    {t:'multi', id:`${p}_com`, label:'Assistenza specialistica all’autonomia e/o alla comunicazione (per azioni riconducibili ad interventi educativi) – Comunicazione', opz:['assistenza a bambini/e con disabilità visiva', 'assistenza a bambini/e con disabilità uditiva', `assistenza ${s === 'I' ? 'a bambini/e' : 'ad alunni/e'} con disabilità intellettive e disturbi del neurosviluppo`], col:1},
    {t:'multi', id:`${p}_aut`, label:'Educazione e sviluppo dell’autonomia, nella:', opz:['cura di sé', 'mensa'], altro:true, col:3},
    {t:'area', id:`${p}_spec_dati`, label:'Dati relativi agli interventi educativi all’autonomia e alla comunicazione (educatori, organizzazione oraria ritenuta necessaria)', righe:2,
      ph:'es. assistente all’autonomia e alla comunicazione, 10 ore settimanali nelle attività di laboratorio e in mensa'},
    {t:'testofisso', testo:'Esigenze di tipo sanitario: comprendono le eventuali somministrazioni di farmaci o altri interventi a supporto di funzioni vitali da assicurare, secondo i bisogni, durante l’orario scolastico.'},
    {t:'multi', id:`${p}_farmaci`, label:'Somministrazioni di farmaci', col:1, opz:[
      'non comportano il possesso di cognizioni specialistiche di tipo sanitario, né l’esercizio di discrezionalità tecnica da parte dell’adulto somministratore, ma solo adeguata formazione delle figure professionali coinvolte. Pertanto, possono essere coinvolte figure interne all’istituzione scolastica',
      'comportano cognizioni specialistiche e discrezionalità tecnica da parte dell’adulto somministratore, tali da richiedere il coinvolgimento di figure professionali esterne']},
    {t:'area', id:`${p}_sanitarie`, label:'Esigenze di tipo sanitario – indicazioni', righe:2,
      ph:'es. si rinvia al protocollo di somministrazione agli atti (prot. n. …); personale formato individuato'},
    {t:'nota', testo:`Altre esigenze ed interventi non riferibili esclusivamente alla specifica disabilità sono definiti nelle modalità ritenute più idonee, conservando la relativa documentazione nel fascicolo personale ${s === 'I' ? 'del bambino o della bambina' : 'dell’alunno o dell’alunna'}. Non trascrivere diagnosi o dati sanitari: rinviare alla documentazione agli atti (prot. n.).`},
  ];
  const notaOre = {t:'nota', testo:'(1) L’indicazione delle ore è finalizzata unicamente a permettere al Coordinatore didattico di formulare la richiesta complessiva d’Istituto delle misure di sostegno ulteriori rispetto a quelle didattiche, da proporre e condividere con l’Ente Territoriale (art. 15 c. 3 D.I. 182/2020).'};
  const FRASI_ORE = [
    'La richiesta tiene conto dell’entità delle difficoltà rilevate nelle dimensioni della comunicazione e dell’autonomia.',
    'Il numero di ore proposto consente il supporto in compresenza nelle attività in cui è necessario un affiancamento costante.',
    'La proposta è coerente con i risultati raggiunti e con gli obiettivi previsti per il prossimo anno scolastico.',
    'Si conferma il fabbisogno dell’anno in corso, risultato adeguato al raggiungimento degli obiettivi.',
    'Si propone un incremento delle ore in considerazione del passaggio a un nuovo ordine di scuola.',
    'Si propone una riduzione delle ore in considerazione dei progressi nelle autonomie personali e sociali.'];

  registra({
    id: 'pei',
    protocollo: true, // numero di protocollo obbligatorio (decisione della scuola)
    titolo: 'Piano Educativo Individualizzato (PEI)',
    sottotitolo: 'Art. 7 D.Lgs. 66/2017 – modello nazionale D.I. 182/2020 mod. D.I. 153/2023',
    occhiello: 'Modello nazionale – elaborato e approvato dal Gruppo di Lavoro Operativo per l’inclusione (GLO)',
    descrizione: 'PEI completo: frontespizio, GLO, sezioni 1-12, revisione intermedia, verifica finale e PEI provvisorio',
    argomento: 'pei',
    scuole: ['I', 'P', 'S'],
    file: 'PEI',
    legenda: () => 'Elementi essenziali del PEI: identificazione dell’alunno/a (anno scolastico, codice, classe o sezione), estremi della documentazione di certificazione agli atti, data di approvazione in sede di GLO e firme dei componenti. Se mancano, il PEI non risulta formalmente approvato e sottoscritto e va integrato prima della consegna alla famiglia.',
    norme: (s) => [
      'L. 104/1992, art. 12 (diritto all’educazione e all’istruzione) e art. 15 c. 10 (GLO), come modificati dal D.Lgs. 66/2017 e dal D.Lgs. 96/2019.',
      'D.Lgs. 66/2017, art. 7 (PEI: elaborato e approvato dal GLO, redatto a partire dalla scuola dell’infanzia, aggiornato in presenza di nuove condizioni; c. 2 lett. d: proposta delle risorse) e art. 5 (Profilo di Funzionamento).',
      'D.I. 29/12/2020 n. 182, come modificato dal D.I. 01/08/2023 n. 153: artt. 3-4 (composizione e funzionamento del GLO; atto di configurazione a inizio anno; GLO valido anche se non tutte le componenti sono rappresentate; verbale firmato da chi presiede e dal segretario), artt. 5-16 (contenuti del PEI), art. 18 (supporti al funzionamento e Allegati C e C1), Allegati A1/A2/A3 (modelli) e B (Linee guida).',
      'Scadenze (art. 4 D.I. 182/2020): approvazione e sottoscrizione del PEI di norma entro il 31 ottobre; almeno una verifica intermedia tra novembre e aprile; verifica finale e PEI provvisorio entro il 30 giugno.',
      'Orario ridotto: solo per eccezionali e documentate esigenze sanitarie, su richiesta della famiglia e degli specialisti, in accordo con la scuola, indicando le motivazioni (art. 13 c. 2 lett. a D.I. 182/2020 mod. D.I. 153/2023). Soppressa la possibilità di esonero da discipline (ex art. 10 c. 2 lett. d).',
      'Consiglio di Stato, sent. n. 3196/2022: annullamento parziale del D.I. 182/2020, recepito dal D.I. 153/2023.',
      'L. 328/2000, art. 14 (Progetto individuale); D.Lgs. 62/2024 (valutazione di base INPS e Progetto di vita): sperimentazione in provincia di Brescia dal 1/1/2025, applicazione su tutto il territorio nazionale dal 1/1/2027.',
      ...(s === 'I' ? [] : [
        'D.Lgs. 62/2017, art. 11: valutazione riferita al PEI; prove standardizzate con misure compensative o dispensative, adattamenti o esonero decisi dai docenti' + (s === 'S' ? '; esame conclusivo con eventuali prove differenziate predisposte sulla base del PEI.' : '.'),
        'D.Lgs. 62/2017, art. 9 e D.M. 14/2024 (modelli di certificazione delle competenze): per gli alunni con disabilità la certificazione può essere accompagnata da una nota esplicativa che rapporti gli enunciati agli obiettivi specifici del PEI.',
        s === 'P' ? 'L. 150/2024 e O.M. 3/2025: giudizi sintetici nella scuola primaria, riferiti agli obiettivi del PEI.' : 'L. 150/2024: valutazione del comportamento in decimi nella secondaria di I grado; per l’alunno/a con PEI secondo i criteri indicati nella Sezione 8.']),
      'L. 62/2000, art. 1 c. 4 lett. e: la scuola paritaria applica le norme vigenti sull’inclusione degli alunni con disabilità.',
      'Reg. UE 2016/679, art. 9, e D.Lgs. 196/2003, art. 2-sexies: dati relativi alla salute; nessuna diagnosi nel PEI, solo rinvio alla documentazione agli atti (art. 4 c. 11 D.I. 182/2020).',
      'D.L. 71/2024, art. 8, e D.M. 32/2025: conferma del docente di sostegno su richiesta della famiglia (norma per il personale statale; applicabilità alla paritaria da verificare).',
      'PEI in formato digitale su piattaforma SIDI (art. 19 c. 2 D.I. 182/2020): obbligatorietà per le scuole paritarie da verificare con l’USR Lombardia.',
    ],
    blocchi: (s) => {
      const I = s === 'I', SEC = s === 'S';
      const alunno = I ? 'il bambino o la bambina' : 'l’alunno/a';
      const dell = I ? 'del bambino o della bambina' : 'dell’alunno/a';
      const classe = I ? 'sezione' : 'classe';
      const dim = DIM(s);
      const nVF = I ? 10 : 11, nPP = I ? 11 : 12;
      const fasi = [F, S14, S59, RI, ...(I ? [] : [CC]), VF, PP];
      const orari = ['8.00 – 9.00', '9.00 – 10.00', '10.00 – 11.00', '11.00 – 12.00', '12.00 – 13.00', '13.00 – 14.00', '14.00 – 15.00', '15.00 – 16.00'].slice(0, SEC ? 6 : 8);
      const team = I ? 'dai docenti di sezione' : SEC ? 'dal Consiglio di classe' : 'dal team dei docenti';

      return [
        /* ---------- Dati identificativi (sempre stampati) ---------- */
        {t:'h', testo:'Dati identificativi'},
        {t:'riga', campi:[
          {t:'testo', id:'as', label:'Anno scolastico', w:2, def:annoScolastico(), ph:'es. 2026/2027', obbl:true, rif:R.id},
          {t:'testo', id:'codice', label:`${I ? 'Bambino/a' : 'Alunno/a'} – codice sostitutivo personale`, w:4, ph:'es. PEI-' + s + '-2026-03', obbl:true, rif:R.id},
          {t:'testo', id:'classe', label:I ? 'Sezione' : 'Classe', w:2, ph:I ? 'es. Sezione Gialli' : SEC ? 'es. 2ª B' : 'es. 3ª A', obbl:true, rif:R.id},
          {t:'testo', id:'plesso', label:'Plesso o sede', w:4, def:`${H.NOMI[s]} – Orzinuovi`, ph:`es. ${H.NOMI[s]} – Orzinuovi`}]},
        H.privacy(),
        {t:'nota', testo:'Il nome non va scritto nel modulo: si usa il codice sostitutivo personale. La corrispondenza codice/nome resta agli atti della scuola nel fascicolo personale.'},
        {t:'multi', id:'fasi', label:'Parti del PEI incluse in questo documento', opz:fasi, col:4, def:[F, S14, S59]},
        {t:'nota', testo:'Selezionare le parti da compilare: il modulo mostra e stampa solo quelle. Inizio anno (entro il 31 ottobre): Frontespizio e GLO + Sezioni 1-4 + Sezioni 5-9. Revisione intermedia (almeno una, tra novembre e aprile): i campi di revisione compaiono nelle sezioni 4-9. Fine anno (entro il 30 giugno): Verifica finale e proposte' + (I ? '' : ' (+ Certificazione competenze per le classi in uscita)') + '. PEI provvisorio (entro il 30 giugno, dopo il primo accertamento): sono prescrittive Frontespizio e GLO, Sezioni 1, 2, 4, 6 e la sezione PEI provvisorio (art. 16 c. 3 D.I. 182/2020).'},

        /* ---------- Frontespizio ---------- */
        {t:'se', campo:'fasi', vale:F, blocchi:[
          {t:'h', testo:'Documentazione di riferimento'},
          {t:'riga', campi:[
            {t:'data', id:'acc_data', label:'Accertamento della condizione di disabilità in età evolutiva ai fini dell’inclusione scolastica – rilasciato in data', w:6},
            {t:'data', id:'acc_scad', label:'Data scadenza o rivedibilità', w:3},
            {t:'scelta', id:'acc_nonind', label:'Scadenza', opz:['Non indicata'], w:3}]},
          {t:'riga', campi:[
            {t:'data', id:'inps_data', label:'Certificazione INPS – valutazione di base (nuovo sistema di accertamento) – data', w:6},
            {t:'testo', id:'inps_prot', label:'Documentazione di certificazione agli atti (prot. n.)', w:6, ph:'es. prot. n. 312 del 12/09/2026', obbl:true, rif:R.cert}]},
          {t:'nota', testo:'Indicare la data del verbale di accertamento oppure, per le certificazioni rilasciate con il nuovo sistema (D.Lgs. 62/2024, provincia di Brescia in sperimentazione dal 1/1/2025), la data della valutazione di base INPS. Il protocollo della documentazione agli atti è sempre obbligatorio.'},
          {t:'riga', campi:[
            {t:'data', id:'pf_data', label:'Profilo di Funzionamento redatto in data', w:6},
            {t:'scelta', id:'pf_nd', label:'Nella fase transitoria', opz:['Profilo di Funzionamento non disponibile'], w:6}]},
          {t:'riga', campi:[
            {t:'data', id:'df_data', label:'Diagnosi Funzionale redatta in data', w:6},
            {t:'data', id:'pdf_data', label:'Profilo Dinamico Funzionale approvato in data', w:6}]},
          {t:'riga', campi:[
            {t:'scelta', id:'pi_stato', label:'Progetto individuale', opz:['redatto', 'da redigere'], w:6},
            {t:'data', id:'pi_data', label:'Progetto individuale redatto in data', w:6}]},
          {t:'nota', testo:'Non trascrivere diagnosi: indicare solo le date e rinviare alla documentazione agli atti. Nella fase transitoria, se il Profilo di Funzionamento non è disponibile, si fa riferimento a Diagnosi Funzionale e Profilo Dinamico Funzionale.'},
          {t:'tabella', id:'date_pei', label:'Date del PEI',
            col:[{h:'Fase', w:4}, {h:'Data', w:2, ph:'es. 28/10/2026'}, {h:'Verbale allegato n.', w:2, ph:'es. 1'}, {h:`Firma del ${H.PRES[s]} (o suo delegato)`, w:4, ph:'lasciare vuoto: firma autografa'}],
            fisse:['PEI provvisorio', 'Approvazione del PEI e prima sottoscrizione', 'Verifica intermedia', 'Verifica finale e proposte per l’a.s. successivo'],
            obbl:true, rif:R.approv},
          {t:'nota', testo:'Compilare almeno la riga "Approvazione del PEI e prima sottoscrizione" con data e numero del verbale del GLO.'},

          {t:'h', testo:'Composizione del GLO – Gruppo di Lavoro Operativo per l’inclusione'},
          {t:'testofisso', testo:`Il GLO è composto ${team}, compreso il docente per le attività di sostegno, ed è presieduto dal ${H.PRES[s]} o da un suo delegato. Partecipano i genitori o gli esercenti la responsabilità genitoriale, le figure professionali interne ed esterne che interagiscono con la ${classe} e con ${alunno} e, ai fini del necessario supporto, l’unità di valutazione multidisciplinare.`},
          {t:'testo', id:'glo_atto', label:'Atto di configurazione del GLO (prot. n. e data)', ph:'es. prot. n. 245 del 15/09/2026',
            nota:'A inizio anno il Coordinatore didattico definisce con proprio atto la configurazione del GLO (art. 3 c. 8 D.I. 182/2020).'},
          glo('glo', 'Componenti del GLO', s, R.firme),
          {t:'nota', testo:'Specificare a quale titolo ciascun componente interviene al GLO. La colonna Firma resta vuota per la firma autografa sul PDF stampato. Si possono aggiungere righe per l’eventuale esperto indicato dalla famiglia (uno solo, con parere consultivo) e per altri specialisti (art. 3 cc. 6-7 D.I. 182/2020). Il GLO è valido anche se non tutte le componenti sono presenti.' + (SEC ? ' La partecipazione attiva dell’alunno/a è assicurata nel rispetto del principio di autodeterminazione (art. 3 c. 4).' : '')},
          {t:'tabella', id:'glo_mod', label:'Eventuali modifiche o integrazioni alla composizione del GLO, successive alla prima convocazione',
            col:[{h:'Data', w:2, ph:'es. 15/01/2027'}, {h:'Nome e cognome', w:3, ph:'es. Luca Verdi'}, {h:'A quale titolo interviene al GLO', w:4, ph:'es. Assistente all’autonomia e alla comunicazione'}, {h:'Variazione (nuovo membro, sostituzione, decadenza…)', w:3, ph:'es. nuovo membro'}],
            righe:2, aggiungi:true},
        ]},

        /* ---------- Sezioni 1-3 ---------- */
        {t:'se', campo:'fasi', vale:S14, blocchi:[
          {t:'h', testo:'1. Quadro informativo'},
          {t:'area', id:'quadro', label:`Situazione familiare / descrizione ${I ? 'del bambino o della bambina' : 'dell’alunno o dell’alunna'}`, righe:5,
            nota:'A cura dei genitori o esercenti la responsabilità genitoriale ovvero di altri componenti del GLO esterni alla scuola (art. 7 D.I. 182/2020). Riportare interessi, abitudini e aspettative, senza dati sanitari.',
            ph:'es. La famiglia riferisce che a casa predilige i giochi di costruzione e le attività all’aperto; le routine stabili lo/la aiutano ad affrontare i cambiamenti.',
            frasi:[
              'La famiglia riferisce che a casa predilige attività manuali e giochi di costruzione.',
              'La famiglia segnala che le routine stabili aiutano ad affrontare con serenità i cambiamenti.',
              'Nel tempo libero frequenta con piacere un’attività sportiva o ricreativa sul territorio.',
              'Durante il colloquio i genitori hanno descritto interessi, preferenze e punti di forza, di seguito riportati.',
              'La famiglia auspica il consolidamento delle autonomie personali e delle relazioni con i compagni.',
              'La famiglia mantiene contatti regolari con gli specialisti che seguono il percorso e si rende disponibile al confronto con la scuola.',
              'Il quadro informativo è stato redatto con il contributo dei genitori nel corso della riunione del GLO.']},

          {t:'h', testo:'2. Elementi generali desunti dal Profilo di Funzionamento'},
          {t:'nota', testo:'O, se non disponibile, dalla Diagnosi Funzionale e dal Profilo Dinamico Funzionale (ove compilato). Nessun dato diagnostico testuale: descrivere il funzionamento.'},
          {t:'area', id:'profilo', label:'Sintetica descrizione, considerando in particolare le dimensioni sulle quali va previsto l’intervento e che andranno quindi analizzate nel presente PEI', righe:5,
            ph:'es. Dalla documentazione agli atti emergono come prioritarie le dimensioni della comunicazione e dell’autonomia; buone potenzialità nella relazione con i pari.',
            frasi:[
              'Dal Profilo di Funzionamento agli atti emergono come prioritarie le dimensioni della comunicazione e dell’autonomia.',
              'La documentazione agli atti evidenzia buone potenzialità nella dimensione relazionale, su cui costruire gli interventi.',
              'La documentazione suggerisce di privilegiare canali visivi e attività pratiche.',
              'La dimensione cognitiva, neuropsicologica e dell’apprendimento richiede un’analisi puntuale e interventi specifici.',
              'In assenza del Profilo di Funzionamento, gli elementi sono desunti dalla Diagnosi Funzionale e dal Profilo Dinamico Funzionale agli atti.',
              'Per gli aspetti clinici si rinvia alla documentazione agli atti, non riportata nel presente documento.']},
          {t:'testofisso', testo:'In base alle indicazioni del Profilo di Funzionamento (o, se non è stato ancora redatto, della Diagnosi Funzionale e del Profilo Dinamico Funzionale) sono individuate le dimensioni rispetto alle quali è necessario definire nel PEI specifici interventi. Le sezioni del PEI non coinvolte vengono omesse.'},
          ...dim.map(d => ({t:'scelta', id:`dim_${d.k}`, label:`Dimensione ${d.nome} – Sezione 4${d.L}/5${d.L}`, opz:['Va definita', 'Va omessa'], def:'Va definita', w:6})),
          {t:'nota', testo:'Le dimensioni impostate su "Va omessa" vengono nascoste nelle Sezioni 4 e 5.'},

          {t:'h', testo:'3. Raccordo con il Progetto Individuale'},
          {t:'area', id:'pi_sintesi', label:'Sintesi dei contenuti del Progetto Individuale e sue modalità di coordinamento e interazione con il presente PEI, tenendo conto delle considerazioni della famiglia (se il Progetto individuale è stato già redatto)', righe:4,
            nota:'Progetto individuale: art. 14 L. 328/2000 (art. 6 D.I. 182/2020).',
            ph:'es. Il Progetto individuale del Comune prevede un educatore domiciliare due pomeriggi a settimana; raccordo con la scuola in incontri trimestrali.',
            frasi:[
              'Il Progetto individuale, redatto dal Comune di residenza, prevede interventi educativi domiciliari in orario extrascolastico.',
              'Le attività previste dal Progetto individuale sono coordinate con il PEI attraverso incontri periodici tra scuola, servizi sociali e famiglia.',
              'La famiglia ritiene utile un raccordo più stretto tra le attività extrascolastiche e gli obiettivi del PEI.',
              'È in corso la definizione del Progetto di vita; la scuola partecipa alla valutazione multidimensionale su invito dell’ente competente.',
              'Il Progetto individuale non è stato redatto né richiesto: la sezione non viene compilata.']},
          {t:'area', id:'pi_indicazioni', label:'Indicazioni da considerare nella redazione del Progetto individuale (se il Progetto individuale è stato richiesto e deve ancora essere redatto)', righe:3,
            ph:'es. Si suggerisce di prevedere attività di socializzazione pomeridiana sul territorio.',
            frasi:[
              'Si suggerisce di prevedere attività di socializzazione pomeridiana sul territorio.',
              'Si ritiene utile il supporto di un educatore per le autonomie negli spostamenti.',
              'Si propone il raccordo con le attività sportive o ricreative già frequentate.',

      {t:'riga', campi:[
        {t:'num', id:'in_carica', label:'Componenti in carica', w:6, nopdf:true},
        {t:'num', id:'n_presenti', label:'Presenti', w:6, nopdf:true}]},
      {t:'testofisso', testo:'Constatata la presenza di n. {n_presenti} componenti su {in_carica} in carica, il numero legale risulta raggiunto.'},
      ...H.presidenza(H.PRES[s]),
      ...H.trattazione(),
      {t:'h', testo:'Delibere e votazioni'},
      {t:'nota', testo:'Solo se il consiglio delibera. Per ogni delibera: oggetto, motivazione quando incide su terzi (art. 3 L. 241/1990) ed esito del voto. Votazioni su persone a scrutinio segreto (art. 37 c. 4 D.Lgs. 297/1994).'},
      {t:'tabella', id:'delibere', col:[
        {h:'Oggetto e motivazione', w:6, tipo:'area', ph:'es. Approvazione dell’uscita didattica al museo di scienze del 12/03: coerente con la progettazione di scienze'},
        {h:'Favorevoli', w:1.5, ph:'12'}, {h:'Contrari', w:1.5, ph:'0'}, {h:'Astenuti', w:1.5, ph:'1'}, {h:'Esito', w:1.5, ph:'approvata'}], righe:1, aggiungi:true},
      ...H.chiusura(['Il Segretario verbalizzante', 'Il Presidente'])
    ], R_CONS)
  });

  /* ------------------------------------------------------------------ */
  /* 2. Verbale di scrutinio                                             */
  /* ------------------------------------------------------------------ */
  // Conformità: aggiunta la verifica del collegio perfetto (tutti i docenti contitolari, sostituti
  // con nomina formale); in secondaria la non ammissione è ora una scelta con motivazione obbligatoria.
  const R_SCR = {
    data: 'Elemento identificativo dell’atto (CdS sez. II n. 3544/2020)',
    classe: 'Identificazione della classe scrutinata',
    presenti: 'Collegio perfetto: devono essere presenti tutti i docenti contitolari (CdS sez. VI, 2020)',
    collegio: 'Lo scrutinio è valido solo a collegio perfetto; il docente assente va sostituito con nomina formale',
    sostituzioni: 'Estremi della nomina del sostituto: senza nomina formale lo scrutinio è viziato',
    presidente: 'Presidente identificato e firmatario (Coordinatore didattico o delegato)',
    segretario: 'La firma del segretario verbalizzante è essenziale (CdS sez. II n. 3544/2020)',
    non_ammessi: 'La non ammissione va motivata per ciascun alunno (art. 3 L. 241/1990; D.Lgs. 62/2017; TAR Lazio n. 10865/2018)',
  };
  registra({
    id: 'scrutinio-finale',
    titolo: 'Verbale di scrutinio',
    sottotitolo: 'D.Lgs. 62/2017 mod. L. 150/2024 – O.M. 3/2025 – D.M. 183/2024 – D.M. 14/2024',
    descrizione: 'Scrutinio del I quadrimestre o finale, con ammissioni e certificazione',
    argomento: 'consigli',
    scuole: ['P', 'S'],
    file: 'Verbale_scrutinio',
    norme: (s) => [
      N.val,
      ...(s === 'P' ? [
        N.om3,
        'D.Lgs. 62/2017, art. 3 – ammissione alla classe successiva e alla secondaria di I grado; c. 3: non ammissione solo in casi eccezionali e comprovati da specifica motivazione, all’unanimità.',
      ] : [
        'D.Lgs. 62/2017, art. 2 c. 5 (mod. L. 150/2024) – voto di comportamento in decimi nella secondaria di I grado.',
        'D.Lgs. 62/2017, art. 5 – validità dell’anno: frequenza di almeno tre quarti del monte ore annuale personalizzato, con le deroghe deliberate dal Collegio dei docenti.',
        'D.Lgs. 62/2017, art. 6 – ammissione alla classe successiva e all’esame; non ammissione a maggioranza con adeguata motivazione; c. 2-bis (L. 150/2024): voto di comportamento inferiore a sei decimi comporta la non ammissione.',
        'D.Lgs. 62/2017, art. 7 – requisiti di ammissione all’esame di Stato (frequenza, assenza di sanzioni che escludono dallo scrutinio, partecipazione alle prove INVALSI) e voto di ammissione in decimi; D.M. 741/2017 sull’esame di Stato del primo ciclo; note MIM annuali sull’esame.',
        'D.P.R. 249/1998 come modificato dal D.P.R. 134/2025 – sanzioni disciplinari; coordinamento con la sanzione di esclusione dallo scrutinio richiamata dal D.Lgs. 62/2017: da verificare con il Regolamento di disciplina aggiornato.',
      ]),
      N.civica,
      N.cert,
      'Consiglio di Stato, sez. VI, 2020 – lo scrutinio è atto di collegio perfetto: tutti i docenti contitolari presenti, sostituti con nomina formale.',
      'TAR Lazio n. 10865/2018 e L. 241/1990, art. 3 – motivazione puntuale della non ammissione.',
      N.oocc,
      N.privacy,
    ],
    blocchi: (s) => {
      const FINALE = 'finale (II quadrimestre)';
      const NONAMM = 'Si delibera la non ammissione di uno o più alunni';
      const PH_AL = 'es. Rossi Luca';
      const valutazione = s === 'P' ? [
        {t:'testofisso', testo:'Constatata la regolarità della seduta, si aprono le operazioni di scrutinio. Su proposta dei docenti contitolari, il team docente attribuisce per ciascuna disciplina, compresa l’educazione civica, il giudizio sintetico (Ottimo, Distinto, Buono, Discreto, Sufficiente, Non sufficiente) correlato alla descrizione dei livelli di apprendimento; attribuisce il giudizio sintetico sul comportamento e formula il giudizio globale sui progressi nello sviluppo culturale, personale e sociale e sul livello globale di sviluppo degli apprendimenti. Le valutazioni sono riportate nel documento di valutazione (documentazione agli atti del registro elettronico).'},
        {t:'nota', testo:'Educazione civica: il giudizio è proposto dal docente coordinatore sulla base degli elementi raccolti dai contitolari (Linee guida D.M. 183/2024). IRC e attività alternative: nota separata con giudizio sintetico sull’interesse e sui livelli di apprendimento.'}
      ] : [
        {t:'testofisso', testo:'Constatata la regolarità della seduta, si aprono le operazioni di scrutinio. Su proposta dei singoli docenti, il Consiglio di classe attribuisce a ciascun alunno i voti in decimi nelle discipline, compresa l’educazione civica, e il voto di comportamento espresso in decimi, riferito all’intero periodo e alle competenze di cittadinanza. Le valutazioni sono riportate nel documento di valutazione (documentazione agli atti del registro elettronico).'},
        {t:'nota', testo:'Educazione civica: il voto è proposto dal docente coordinatore sulla base degli elementi raccolti dai docenti del consiglio (Linee guida D.M. 183/2024). IRC e attività alternative: nota separata con giudizio sintetico.'}
      ];

      const frasiMotiv = s === 'P' ? [
        'Nonostante gli interventi individualizzati attivati durante l’anno e comunicati alla famiglia, l’alunno/a non ha raggiunto i livelli di apprendimento essenziali in italiano e matematica, necessari per affrontare con profitto la classe successiva.',
        'Il team docente ritiene, all’unanimità, che la permanenza nella classe attuale offra all’alunno/a tempi più distesi per consolidare le strumentalità di base di lettura, scrittura e calcolo.',
        'La famiglia è stata informata con colloqui del … e del … sui livelli parzialmente raggiunti e sulle strategie di miglioramento attivate.'
      ] : [
        'Nonostante le attività di recupero attivate e comunicate alla famiglia, l’alunno/a presenta valutazioni non sufficienti in più discipline (…), con lacune tali da non consentire di affrontare con profitto la classe successiva.',
        'Il voto di comportamento attribuito è inferiore a sei decimi: il Consiglio delibera la non ammissione.',
        'L’anno scolastico non è valido per il superamento del limite di assenze, non coperto dalle deroghe deliberate dal Collegio dei docenti.',
        'La famiglia è stata informata con comunicazioni del … e del … sull’andamento e sugli interventi di recupero proposti.'
      ];
      const tabNonAmmessi = {t:'tabella', id:'non_ammessi', label:'Alunni non ammessi',
        col:[{h:'Alunno', w:3, ph:PH_AL},
          {h:s === 'P' ? 'Motivazione' : 'Motivazione (discipline, comportamento, validità)', w:7, tipo:'area', ph:frasiMotiv[0]},
          {h:'Votazione', w:2, ph:s === 'P' ? 'unanimità' : 'es. maggioranza 7 su 9'}],
        righe:1, aggiungi:true, init:s === 'P' ? [['', '', 'unanimità']] : undefined};

      const ammissioneP = [
        {t:'h', testo:'Ammissione alla classe successiva'},
        {t:'testofisso', testo:'Il team docente delibera l’ammissione alla classe successiva, o alla prima classe della scuola secondaria di I grado, dei seguenti alunni:'},
        {t:'elenco', id:'ammessi', label:'Alunni ammessi', min:5, ph:'es. Bianchi Anna'},
        {t:'scelta', id:'non_amm', label:'Non ammissioni', opz:['Nessuna non ammissione', NONAMM], def:'Nessuna non ammissione'},
        {t:'se', campo:'non_amm', vale:NONAMM, blocchi:[
          {t:'testofisso', testo:'In casi eccezionali e comprovati da specifica motivazione, il team docente delibera all’unanimità la non ammissione alla classe successiva dei seguenti alunni. La famiglia è stata preventivamente informata dei livelli di apprendimento parzialmente raggiunti e delle strategie di miglioramento attivate.'},
          tabNonAmmessi]},
        {t:'scelta', id:'quinta', label:'Classe quinta', opz:['No', 'Sì'], def:'No', w:4},
        {t:'se', campo:'quinta', vale:'Sì', blocchi:[

      ];

      const ammissioneS = [
        {t:'h', testo:'Validità dell’anno scolastico'},
        {t:'testofisso', testo:'Il Consiglio verifica per ciascun alunno la frequenza di almeno tre quarti del monte ore annuale personalizzato, applicando le deroghe deliberate dal Collegio dei docenti per assenze documentate e continuative che non pregiudicano la valutazione.'},
        {t:'tabella', id:'deroghe', label:'Alunni ammessi alla deroga',
          col:[{h:'Alunno', w:4, ph:PH_AL}, {h:'Motivo della deroga (rif. delibera del Collegio)', w:8, tipo:'area', ph:'es. assenze continuative documentate per motivi di salute – deroga lett. a) della delibera del Collegio del 5/9/2026'}], righe:1, aggiungi:true},
        {t:'tabella', id:'anno_non_valido', label:'Alunni per i quali l’anno non è valido',
          col:[{h:'Alunno', w:4, ph:PH_AL}, {h:'Motivazione', w:8, tipo:'area', ph:'es. assenze pari al 32% del monte ore, non documentate né riconducibili alle deroghe deliberate'}], righe:1, aggiungi:true},
        {t:'h', testo:'Ammissione alla classe successiva'},
        {t:'testofisso', testo:'L’ammissione è disposta anche in caso di parziale o mancata acquisizione dei livelli di apprendimento in una o più discipline; in tal caso il Consiglio può deliberare a maggioranza, con adeguata motivazione, la non ammissione. Non è ammesso alla classe successiva l’alunno con voto di comportamento inferiore a sei decimi.'},
        {t:'elenco', id:'ammessi', label:'Alunni ammessi', min:5, ph:'es. Bianchi Anna'},
        {t:'tabella', id:'carenze', label:'Alunni ammessi con carenze (comunicazione alla famiglia)',
          col:[{h:'Alunno', w:3, ph:PH_AL}, {h:'Discipline con valutazione inferiore a 6', w:4, ph:'es. matematica, inglese'}, {h:'Strategie per il miglioramento', w:5, tipo:'area', ph:'es. studio estivo guidato con schede di ripasso; verifica di settembre'}], righe:1, aggiungi:true},
        {t:'scelta', id:'non_amm', label:'Non ammissioni', opz:['Nessuna non ammissione', NONAMM], def:'Nessuna non ammissione'},
        {t:'se', campo:'non_amm', vale:NONAMM, blocchi:[
          {t:'testofisso', testo:'Il Consiglio, con adeguata motivazione, delibera la non ammissione alla classe successiva o all’esame di Stato dei seguenti alunni. La famiglia è stata informata durante l’anno dell’andamento e degli interventi di recupero attivati.'},
          tabNonAmmessi]},
        {t:'scelta', id:'terza', label:'Classe terza (ammissione all’esame di Stato)', opz:['No', 'Sì'], def:'No', w:6},
        {t:'se', campo:'terza', vale:'Sì', blocchi:[
          {t:'h', testo:'Ammissione all’esame di Stato conclusivo del primo ciclo'},
          {t:'testofisso', testo:'Il Consiglio verifica i requisiti di ammissione: frequenza di almeno tre quarti del monte ore annuale personalizzato, fatte salve le deroghe; assenza della sanzione disciplinare di esclusione dallo scrutinio finale; partecipazione alle prove nazionali INVALSI; voto di comportamento non inferiore a sei decimi. Attribuisce quindi a ciascun alunno ammesso il voto di ammissione in decimi, considerando il percorso scolastico triennale.'},
          {t:'tabella', id:'voti_ammissione', label:'Voti di ammissione all’esame',
            col:[{h:'Alunno', w:8, ph:PH_AL}, {h:'Voto di ammissione (in decimi)', w:4, ph:'es. 8'}], righe:5, aggiungi:true},
          {t:'testofisso', testo:'Il Consiglio compila la certificazione delle competenze sul modello nazionale, riferita alle competenze chiave europee, rilasciata agli alunni che superano l’esame di Stato e integrata dalle sezioni INVALSI.'}]}
      ];

      return marca([
        ...testata(s, [
          {t:'testo', id:'classe', label:'Classe', nopdf:true, ph:PH_CLASSE[s]},
          {t:'scelta', id:'periodo', label:'Scrutinio', opz:['I quadrimestre', FINALE], def:FINALE, nopdf:true}]),
        ...H.apertura(`${s === 'P' ? 'il team docente' : 'il Consiglio di classe'} della classe {classe}, con la sola componente docente, per le operazioni di scrutinio – {periodo}`),
        ...H.odg(['Operazioni di scrutinio', 'Varie ed eventuali']),
        ...H.presenti([H.PRES[s], 'Docente', 'Docente', 'Docente', 'Docente'], 'Docenti presenti'),
        {t:'nota', testo:'Partecipano tutti i docenti contitolari della classe, compresi i docenti di sostegno; IRC e attività alternative solo per gli alunni che se ne avvalgono.'},
        {t:'scelta', id:'collegio', label:'Composizione del collegio', col:1, def:'Sono presenti tutti i docenti contitolari della classe',
          opz:['Sono presenti tutti i docenti contitolari della classe', 'Uno o più docenti assenti sono sostituiti da docenti nominati formalmente']},
        {t:'se', campo:'collegio', vale:'Uno o più docenti assenti sono sostituiti da docenti nominati formalmente', blocchi:[
          {t:'tabella', id:'sostituzioni', label:'Sostituzioni',
            col:[{h:'Docente assente', w:4, ph:'es. prof. Marco Neri (inglese)'}, {h:'Sostituito da', w:4, ph:'es. prof.ssa Sara Galli'}, {h:'Estremi della nomina', w:4, ph:'es. nomina prot. n. 512 del 9/6/2027'}],
            righe:1, aggiungi:true}]},
        ...H.presidenza(H.PRES[s]),
        {t:'h', testo:'Operazioni di scrutinio'},
        {t:'riga', campi:[{t:'num', id:'scrutinati', label:'Alunni scrutinati n.', w:4}]},
        ...valutazione,
        {t:'se', campo:'periodo', vale:FINALE, blocchi:s === 'P' ? ammissioneP : ammissioneS},
        {t:'se', campo:'periodo', vale:'I quadrimestre', blocchi:[
          {t:'tabella', id:'segnalazioni', label:'Situazioni da segnalare alle famiglie',
            col:[{h:'Alunno', w:3, ph:PH_AL}, {h:'Discipline / aspetti', w:4, ph:s === 'P' ? 'es. matematica; autonomia nel lavoro' : 'es. matematica, inglese; metodo di studio'}, {h:'Strategie di miglioramento', w:5, tipo:'area', ph:'es. recupero in itinere a piccolo gruppo; colloquio con la famiglia entro febbraio'}], righe:1, aggiungi:true}]},
        H.privacy(),
        {t:'testofisso', testo:'Si procede alla trascrizione delle valutazioni sui documenti scolastici, sottoscritti da tutti i docenti della classe.'},
        ...H.chiusura(['Il Segretario verbalizzante', 'Il Coordinatore didattico']),
        firmeDocenti(s)
      ], R_SCR);
    }
  });

  /* ------------------------------------------------------------------ */
  /* 3. Relazione finale coordinata                                      */
  /* ------------------------------------------------------------------ */
  const R_DOC = {
    classe: 'Identificazione della classe cui si riferisce il documento',
    data: 'Data di redazione del documento',
    firme_docenti: 'Sottoscrizione dei docenti che redigono il documento',
  };
  registra({
    id: 'relazione-finale',
    titolo: 'Relazione finale coordinata',
    sottotitolo: 'Relazione del gruppo docente / Consiglio di classe a conclusione dell’anno',
    occhiello: 'Relazione del gruppo docente a conclusione dell’anno scolastico',
    descrizione: 'Analisi della classe, programmazione, metodi, livelli e rapporti con le famiglie',
    argomento: 'consigli',
    scuole: ['P', 'S'],
    file: 'Relazione_finale',
    legenda: () => LEG_DOC,
    norme: (s) => [
      N.autonomia,
      'D.Lgs. 297/1994, art. 5 c. 8 – verifica dell’andamento complessivo dell’attività didattica nelle classi di competenza (tramite Regolamento OO.CC. nella paritaria).',

    blocchi: (s) => {
      const liv = s === 'P'
        ? [['', 'Ottimo / Distinto', ''], ['', 'Buono', 'Potenziamento'], ['', 'Discreto / Sufficiente', 'Approfondimenti, consolidamento'], ['', 'Non sufficiente', 'Recupero, esercitazioni aggiuntive']]
        : [['', 'Voto 9-10', ''], ['', 'Voto 7-8', 'Potenziamento'], ['', 'Voto 6', 'Approfondimenti, consolidamento'], ['', 'Voto inferiore a 6', 'Recupero, esercitazioni aggiuntive']];
      return marca([
        ...testata(s, [{t:'testo', id:'classe', label:'Classe', ph:PH_CLASSE[s]}]),
        {t:'riga', campi:[
          {t:'testo', id:'coordinatore', label:'Coordinatore', w:6, ph:PH_DOC[s]},
          {t:'testo', id:'segretario', label:'Segretario', w:6, ph:s === 'S' ? 'es. prof. Luca Bianchi' : 'es. ins. Luca Bianchi'}]},

        {t:'h', testo:'Analisi della classe'},
        {t:'scelta', id:'composizione', label:'Composizione della classe', opz:['invariata rispetto all’inizio dell’anno', 'variata'], def:'invariata rispetto all’inizio dell’anno'},

        {t:'scelta', id:'atteggiamento', label:'Atteggiamento nei confronti delle conoscenze', opz:['Molto positivo', 'Abbastanza positivo', 'Accettabile', 'Talvolta negativo']},
        {t:'scelta', id:'partecipazione', label:'Partecipazione', opz:['Produttiva', 'Attiva', 'Accettabile', 'Talvolta negativa']},
        {t:'scelta', id:'preparazione', label:'Preparazione globale della classe', opz:['Soddisfacente', 'Accettabile', 'Eterogenea', 'Scarsa']},
        {t:'scelta', id:'autonomia', label:'Autonomia di lavoro', opz:['Buona', 'Accettabile', 'Difficoltosa', 'Scarsa']},
        {t:'scelta', id:'rapporto', label:'Rapporto della classe con gli insegnanti', opz:['Costruttivo', 'Buono', 'Problematico']},
        {t:'se', campo:'rapporto', vale:'Problematico', blocchi:[

          frasi:[
            'La classe si presenta nel complesso vivace ma disponibile al dialogo educativo.',
            'Nel corso dell’anno il gruppo ha raggiunto una buona coesione e una maggiore disponibilità all’aiuto reciproco.',

            'Gli alunni hanno partecipato con interesse alle attività laboratoriali e alle uscite didattiche.',

        {t:'h', testo:'Sviluppo della programmazione'},
        {t:'scelta', id:'sviluppo', label:'Progettazione disciplinare annuale', opz:['Sono stati sviluppati tutti gli aspetti', 'Non sono stati sviluppati alcuni aspetti'], def:'Sono stati sviluppati tutti gli aspetti'},

        {t:'scelta', id:'obiettivi', label:'Obiettivi educativi', opz:['Pienamente acquisiti', 'Acquisiti', 'Non ancora acquisiti']},
        {t:'scelta', id:'comportamento', label:'Sul piano comportamentale, rispetto alla situazione di partenza, la classe', opz:['è maturata verso un atteggiamento più consapevole', 'è rimasta stabile', 'ha sviluppato comportamenti problematici'], col:1},

<script data-schemi="organi">
// Moduli degli organi collegiali (argomento 'organi').
// Scuola paritaria: gli organi collegiali sono istituiti e regolati dal regolamento della scuola,
// improntati alla partecipazione democratica (art. 1 c. 4 lett. c L. 62/2000). Le norme statali
// (D.Lgs. 297/1994, O.M. 215/1991, D.Lgs. 66/2017, D.P.R. 249/1998) sono usate come riferimento.
// Riferimenti verificati a settembre 2026 (vedi proprieta' 'norme' di ciascun modulo: solo a schermo).
// Convenzioni di questo blocco:
//  - nessuna citazione normativa in cio' che si stampa (titoli, testi fissi, etichette, opzioni, firme);
//  - 'ritocca' aggiunge testo guida (ph), frasi, obbl/rif ai campi generati dagli helper H;
//  - organi deliberanti (collegio, consiglio d'istituto, organo di garanzia): obbl sugli elementi di validita';
//    riunioni non deliberanti (assemblea, dipartimento, commissione, GLI): solo minimo identificativo + legenda.
(() => {
  const SEZ = {N:'Gruppo / sezione', I:'Sezione', P:'Classe', S:'Classe'};
  const CONSIGLIO = {I:'Consiglio di intersezione', P:'Consiglio di interclasse', S:'Consiglio di classe'};

  // Applica proprieta' (ph, frasi, obbl, rif, ...) ai campi per id, anche dentro righe e blocchi 'se'
  const ritocca = (bl, mod) => bl.map(b => {
    const c = Object.assign({}, b);
    if (c.campi) c.campi = ritocca(c.campi, mod);
    if (c.blocchi) c.blocchi = ritocca(c.blocchi, mod);
    if (c.id && mod[c.id]) Object.assign(c, mod[c.id]);
    return c;
  });

  // Motivi degli elementi essenziali (solo a schermo)
  const RIF = {
    data:'Elemento identificativo dell’atto – CdS sez. II n. 3544/2020',
    organo:'Identificazione dell’organo – Regolamento degli organi collegiali della scuola (L. 62/2000, art. 1 c. 4 lett. c)',
    convocazione:'Convocazione scritta con ordine del giorno a tutti i componenti, di norma almeno 5 giorni prima – C.M. 105/1975; il componente non convocato vizia le delibere',

    regtel:'Senza una norma del Regolamento che la consenta, la seduta telematica rende annullabili le delibere – Nota MIM prot. 3803/2026',
    odg:'Si delibera solo sui punti iscritti all’ordine del giorno – C.M. 105/1975',
    presenti:'Nomi di presenti e assenti per verificare il numero legale – art. 37 c. 2 D.Lgs. 297/1994; CdS n. 3544/2020',
    quorum:'Seduta valida con la metà più uno dei componenti in carica – art. 37 c. 2 D.Lgs. 297/1994, recepito dal Regolamento',
    presidente:'Presidente identificato e firmatario del verbale – C.M. 105/1975',
    segretario:'La firma del segretario verbalizzante è requisito essenziale del verbale – CdS sez. II n. 3544/2020',
    nd_data:'Minimo identificativo della riunione: se manca è irregolarità documentale',
    nd_part:'Partecipanti: minimo identificativo della riunione (irregolarità documentale se manca)',
    nd_segr:'Il verbalizzante attesta il contenuto del verbale (irregolarità documentale se manca)',
  };
  const legendaND = (chi) => `${chi} non è un organo deliberante: gli elementi segnati con * sono il minimo identificativo del verbale (data, partecipanti, verbalizzante). La loro mancanza è un’irregolarità documentale, non causa di invalidità; le proposte diventano efficaci solo con la delibera dell’organo competente.`;
  const NORME_OOCC = [
    'L. 62/2000, art. 1 c. 4 lett. c – nella scuola paritaria gli organi collegiali sono istituiti dal regolamento della scuola e improntati alla partecipazione democratica.',
    'D.M. 267/2007 e D.M. 83/2008 (Linee guida) – requisiti per il riconoscimento e il mantenimento della parità.',
    'D.Lgs. 297/1994, art. 37 – validità delle sedute (metà più uno dei componenti in carica), maggioranza assoluta dei voti validamente espressi, prevalenza del voto del Presidente in caso di parità, voto segreto sulle persone (riferimento recepito dal Regolamento).',
    'C.M. 105/1975 – schema di regolamento: convocazione scritta con ordine del giorno, di norma con almeno 5 giorni di preavviso; verbale firmato da Presidente e segretario.',
    'Nota MIM prot. 3803 del 30/6/2026 (con allegato tecnico) – sedute deliberative a distanza solo se disciplinate dal Regolamento, con identificazione dei partecipanti, verifica del quorum, univocità del voto e verbalizzazione.',
    'CdS sez. II n. 3544/2020 – il verbale è requisito sostanziale; la firma del segretario verbalizzante è essenziale.',
    'L. 241/1990, art. 3 – obbligo di motivazione degli atti che incidono su terzi.',
  ];

  // Tabella delibere numerate (più completa di H.delibere: numero progressivo della delibera)

      righe:2, aggiungi:true},
    {t:'nota', testo:'Numerazione progressiva nell’anno scolastico (es. 5/2026-27). Salvo diversa previsione del regolamento, le delibere sono adottate a maggioranza assoluta dei voti validamente espressi; in caso di parità prevale il voto del Presidente (art. 37 D.Lgs. 297/1994). Se la delibera incide su terzi, indicarne sempre la motivazione (art. 3 L. 241/1990). Esito: approvata / respinta / approvata all’unanimità.'},
  ];

  // Numero legale: presenti su aventi diritto
  const numeroLegale = (chi = 'componenti') => [
    {t:'riga', campi:[
      {t:'num', id:'aventi_diritto', label:'Aventi diritto (componenti in carica)', w:6, nopdf:true, obbl:true, rif:RIF.quorum},

    {t:'testofisso', testo:`Accertata la presenza di n. {n_presenti} ${chi} su n. {aventi_diritto} aventi diritto e quindi del numero legale (metà più uno dei componenti in carica), il Presidente dichiara valida la seduta.`},

  // Seduta a distanza: solo se il Regolamento la prevede (norma da citare nel form, stampata come dato)

    {t:'testo', id:'reg_tel', label:'Disposizione del Regolamento degli organi collegiali che consente la seduta a distanza', nopdf:true,
      ph:'es. art. 12 del Regolamento degli organi collegiali, approvato il 5/9/2026', obbl:true, rif:RIF.regtel},
    {t:'testofisso', testo:'La seduta si svolge a distanza in modalità sincrona, come consentito dal Regolamento degli organi collegiali ({reg_tel}); il Presidente ha verificato l’identità dei partecipanti e la loro presenza per tutta la durata della seduta.'},
  ]});

  const presidenzaLibera = (labelPres, formula, phPres) => [
    {t:'riga', campi:[

  const FRASI_DICHIARAZIONI = [
    'Il/La docente … chiede che venga messo a verbale il proprio voto contrario sul punto …, motivato da …',

    'Il/La docente … si astiene dalla votazione sul punto … per ragioni di opportunità.',
    'Il/La docente … chiede che il proprio intervento sia riportato integralmente; il testo, dettato seduta stante, è il seguente: «…».',
    'Il/La docente … dichiara voto favorevole, chiedendo che l’attuazione della delibera sia verificata entro …',
    'Nessun componente chiede di mettere a verbale dichiarazioni di voto.',

  /* ------------------------------------------------------------------ */
  /* 1. COLLEGIO DEI DOCENTI                                             */
  /* ------------------------------------------------------------------ */
  const ODG_COLLEGIO = [

    'Ottobre: approvazione dell’aggiornamento del PTOF e dei progetti; piano di formazione; uscite e viaggi d’istruzione',

    'Giugno: verifica del PTOF e delle funzioni; approvazione del Piano per l’inclusione (su proposta del GLI); relazioni finali; proposte per il nuovo anno',

  registra({

    titolo:'Verbale del Collegio dei docenti',

    norme:(s) => [

      ...NORME_OOCC,
      'D.P.R. 275/1999, art. 3 e L. 107/2015, art. 1 cc. 12-14 – il PTOF è elaborato dal Collegio dei docenti.',
      'D.Lgs. 66/2017, art. 8 – il Piano per l’inclusione, proposto dal GLI, è deliberato dal Collegio e inserito nel PTOF.',
      'D.M. 221/2025 (Nuove Indicazioni nazionali) e Nota MIM 1312/2026 – dal 2026/27 si applicano all’infanzia e alle classi prime di primaria e secondaria.',
      s === 'P' ? 'L. 150/2024 e O.M. 3/2025 – valutazione con giudizi sintetici nella scuola primaria.' : null,
      s === 'S' ? 'D.Lgs. 62/2017 e L. 150/2024 – valutazione, voto di comportamento in decimi, criteri per ammissione ed esame di Stato.' : null,
      s === 'S' ? 'D.P.R. 249/1998 mod. D.P.R. 134/2025 (in vigore dal 10/10/2025) – regolamento di disciplina e Patto di corresponsabilità.' : null,
      'D.M. 183/2024 – Linee guida per l’insegnamento dell’educazione civica.',
    ].filter(Boolean),
    blocchi:(s) => ritocca([
      ...H.testata(s, [{t:'testo', id:'n_verbale', label:'Verbale n.'}, {t:'testo', id:'convocazione', label:'Convocazione (prot. / data)'}]),
      {t:'riga', campi:[
        {t:'scelta', id:'composizione', label:'Composizione', opz:['in seduta unitaria (tutti i gradi)', `della ${H.NOMI[s]}`], def:`della ${H.NOMI[s]}`, w:7, nopdf:true},

  const ODG_CONSIGLIO = [
    'Insediamento, elezione del Presidente e del segretario (se previsto)',

    id:'consiglio-istituto', argomento:'organi', scuole:['N', 'I', 'P', 'S'], file:'Verbale_Consiglio_istituto',
    titolo:'Verbale del Consiglio d’istituto',

    blocchi:(s) => ritocca([

  /* ------------------------------------------------------------------ */
  /* 3. ASSEMBLEA DEI GENITORI                                           */
  /* ------------------------------------------------------------------ */
  registra({
    id:'assemblea-genitori', argomento:'organi', scuole:['N', 'I', 'P', 'S'], file:'Verbale_assemblea_genitori',
    titolo:'Verbale di assemblea dei genitori',
    sottotitolo:'Assemblea di classe / sezione – regolamento della scuola (riferimento: art. 15 D.Lgs. 297/1994)',
    descrizione:'Assemblea di classe o sezione: programmazione, patto educativo, regole e richieste',
    legenda:() => legendaND('L’assemblea dei genitori'),
    norme:(s) => [
      'D.Lgs. 297/1994, art. 15 – assemblee dei genitori di classe/sezione (riferimento per la paritaria tramite il Regolamento): possono essere convocate anche dai rappresentanti dei genitori; vi partecipano con diritto di parola il Coordinatore e i docenti.',
      'L. 62/2000, art. 1 c. 4 lett. c – partecipazione democratica delle famiglie nella scuola paritaria.',
      s === 'N'
        ? 'D.Lgs. 65/2017; D.M. 334/2021 (Linee pedagogiche 0-6); D.M. 43/2022 (Orientamenti 0-3) – partecipazione delle famiglie al progetto educativo.'
        : 'D.M. 221/2025 (Nuove Indicazioni nazionali) e Nota MIM 1312/2026 – curricolo e programmazione illustrati alle famiglie.',
      s === 'N'
        ? 'D.G.R. Lombardia XI/2929/2020 – requisiti dei nidi: incontro con le famiglie per la presentazione del progetto educativo.'

          ? 'D.P.R. 249/1998, art. 5-bis (mod. D.P.R. 134/2025) – Patto educativo di corresponsabilità sottoscritto da genitori e studenti.'

      'Nota MIM annuale sulle elezioni degli organi collegiali a livello di istituzione scolastica (a.s. 2026/27: estremi da verificare; per il 2025/26 nota prot. 42616 del 19/9/2025) – l’assemblea precede l’elezione dei rappresentanti.',
      'Reg. UE 2016/679 (GDPR) – nel verbale non si trattano situazioni di singoli alunni.',
    ],
    blocchi:(s) => {
      const doc = s === 'N' ? 'educatrici' : 'docenti';
      const nido = s === 'N';
      return ritocca([
        ...H.testata(s, [{t:'testo', id:'sezione', label:SEZ[s]}]),
        {t:'riga', campi:[
          {t:'scelta', id:'tipo', label:'Assemblea', opz:['di inizio anno', 'in corso d’anno'], def:'di inizio anno', w:5, nopdf:true},
          {t:'testo', id:'convocata', label:'Convocata da', w:7, def:nido ? 'Coordinatrice pedagogica' : 'Coordinatore didattico', nopdf:true,
            nota:'Può essere convocata anche dai rappresentanti dei genitori, secondo il regolamento.'}]},
        ...H.apertura(`l’assemblea {tipo} dei genitori (${SEZ[s].toLowerCase()} {sezione}), convocata da {convocata},`),
        ...H.odg(nido
          ? ['Presentazione delle educatrici e del progetto educativo', 'Ambientamenti, routine e giornata al nido', 'Regole e organizzazione', 'Varie ed eventuali']

        {t:'riga', campi:[
          {t:'num', id:'n_famiglie', label:'Famiglie presenti', w:4},
          {t:'num', id:'n_totale', label:'Famiglie della ' + SEZ[s].toLowerCase(), w:4},
          {t:'testo', id:'foglio_firme', label:'Foglio firme', w:4, def:'allegato'}]},
        {t:'tabella', id:'personale', label:'Personale della scuola presente',
          col:[{h:'Cognome e nome', w:6, ph:nido ? 'es. Bianchi Laura' : 'es. Rossi Maria'}, {h:'Ruolo', w:6, ph:nido ? 'es. educatrice di riferimento' : (s === 'S' ? 'es. coordinatore di classe' : 'es. docente prevalente')}], righe:3,
          init:[['', nido ? 'Coordinatrice pedagogica' : 'Coordinatore didattico'], ['', nido ? 'Educatrice' : 'Docente'], ['', nido ? 'Educatrice' : 'Docente']], aggiungi:true},
        ...presidenzaLibera('Presiede', 'Presiede l’assemblea {presidente}; funge da segretario verbalizzante {segretario}.',
          nido ? 'es. dott.ssa Paola Rossi, Coordinatrice pedagogica' : 'es. sig.ra Anna Verdi, rappresentante dei genitori'),
        {t:'h', testo:'Presentazione della scuola'},
        {t:'area', id:'programmazione', label:nido ? 'Progetto educativo, ambientamenti e routine' : 'Programmazione annuale, progetti, uscite', righe:4,
          ph:nido
            ? 'es. Le educatrici presentano il progetto «Mani in pasta», gli ambientamenti a piccoli gruppi e la giornata tipo al nido.'
            : (s === 'S' ? 'es. Il coordinatore di classe presenta la programmazione, il progetto di orientamento e l’uscita a Brescia di marzo.' : 'es. Le docenti presentano la programmazione annuale, il progetto lettura e l’uscita didattica in fattoria di aprile.'),
          frasi:nido ? [
            'Le educatrici presentano il progetto educativo dell’anno, centrato su …, con attività di esplorazione sensoriale, gioco simbolico e motricità.',
            'Si illustrano i tempi e le modalità dell’ambientamento, a piccoli gruppi e con la presenza graduale del genitore.',
            'Si descrive la giornata al nido: accoglienza, spuntino, attività di gruppo, igiene, pranzo, riposo e ricongiungimento.',
            'Si illustrano le modalità di documentazione del percorso (diario di bordo, fotografie, pannelli) e i colloqui individuali previsti.',
            'Si presentano gli spazi, i materiali e le proposte di continuità con la Scuola dell’Infanzia.',
            'Le educatrici invitano le famiglie a condividere abitudini e ritmi del bambino per favorire un ambientamento sereno.',
          ] : [
            `I ${doc} presentano la programmazione annuale, articolata per discipline e campi di esperienza secondo il curricolo della scuola.`,
            'Vengono illustrati i progetti dell’anno: …, con i relativi tempi e le modalità di svolgimento.',
            'Si presentano le uscite didattiche previste, che saranno effettuate previa autorizzazione scritta delle famiglie.',
            s === 'P' ? 'Si illustrano i criteri di valutazione con giudizi sintetici e le modalità di comunicazione degli esiti alle famiglie.'
              : (s === 'S' ? 'Si illustrano i criteri di valutazione in decimi, il voto di comportamento e le modalità di comunicazione degli esiti.' : 'Si illustrano le modalità di osservazione e documentazione dei progressi dei bambini.'),
            'Si presentano le attività di recupero, consolidamento e potenziamento previste nel corso dell’anno.',
            s === 'S' ? 'Si presenta il percorso di orientamento, con le attività previste per la classe.' : 'Si presentano le iniziative di continuità con il grado scolastico successivo.',
          ]},
        {t:'area', id:'patto', label:'Patto educativo di corresponsabilità: punti illustrati', righe:2,
          ph:'es. Illustrati gli impegni di scuola e famiglia su puntualità, comunicazioni e colloqui; sottoscrizione entro il 30 ottobre.',
          frasi:[
            'Sono stati illustrati gli impegni della scuola: offerta formativa di qualità, ascolto, comunicazione tempestiva con le famiglie.',
            'Sono stati illustrati gli impegni della famiglia: puntualità, controllo quotidiano delle comunicazioni, partecipazione ai colloqui.',
            ...(s === 'S' ? ['Sono stati illustrati gli impegni dello studente: rispetto delle persone e delle regole, impegno nello studio, uso corretto dei dispositivi.'] : []),
            'Il Patto sarà sottoscritto dalle famiglie entro il … tramite …',
            'Il testo integrale del Patto è disponibile sul sito della scuola e in segreteria.',
          ],
          nota:'Richiamare impegni reciproci di scuola, famiglia' + (s === 'S' ? ' e studente (D.P.R. 249/1998, art. 5-bis)' : '') + '; indicare come e quando verrà sottoscritto.'},
        {t:'multi', id:'regole', label:'Regole e organizzazione illustrate', opz:[
          'Orari di entrata e uscita, ritardi', 'Deleghe per il ritiro', 'Assenze e giustificazioni',
          nido ? 'Corredo e materiale personale' : 'Materiale scolastico e compiti',
          'Comunicazioni scuola-famiglia e registro elettronico', 'Colloqui con ' + (nido ? 'le educatrici' : 'i docenti'),
          'Mensa, diete e farmaci (con documentazione)', 'Uscite didattiche e autorizzazioni',
          ...(s === 'S' ? ['Uso dei dispositivi personali'] : [])], altro:true, col:2},
        {t:'h', testo:'Interventi e richieste dei genitori'},
        {t:'tabella', id:'interventi', col:[
          {h:'Intervento / richiesta', w:7, tipo:'area', ph:'es. Un genitore chiede di anticipare il calendario dei colloqui individuali'},
          {h:'Risposta o impegno della scuola', w:5, tipo:'area', ph:'es. Il Coordinatore comunicherà le date entro il 20 ottobre'}], righe:3, aggiungi:true},
        {t:'nota', testo:'Non si discutono situazioni di singoli alunni: vanno rinviate ai colloqui individuali. Non indicare i nomi dei genitori che intervengono, se non necessario.'},
        {t:'area', id:'accordi', label:'Proposte e accordi', righe:2,
          ph:'es. Si concorda di organizzare un incontro formativo per le famiglie sull’uso consapevole dei dispositivi digitali.',
          frasi:[
            'L’assemblea propone di organizzare un incontro formativo per le famiglie su …',
            'Si concorda di raccogliere le disponibilità dei genitori per collaborare a …',
            'Le richieste emerse saranno sottoposte al Coordinatore e, se di competenza, agli organi collegiali.',
            'I rappresentanti dei genitori si impegnano a diffondere le informazioni a tutte le famiglie della ' + SEZ[s].toLowerCase() + '.',
            'Non sono emerse ulteriori proposte.',
          ]},
        ...H.chiusura(['Chi presiede', 'Il Segretario verbalizzante']),
      ], {
        as:{ph:'es. 2026/27'},
        data:{obbl:true, rif:RIF.nd_data},
        sezione:{ph:nido ? 'es. Gruppo dei Piccoli' : (s === 'I' ? 'es. Sezione Gialla' : 'es. 2ª A')},
        convocata:{ph:'es. Coordinatore didattico / rappresentanti dei genitori'},
        luogo:{ph:nido ? 'es. salone del Green Nido' : 'es. aula della classe, sede di Orzinuovi'},
        foglio_firme:{ph:'es. allegato'},
        n_famiglie:{obbl:true, rif:RIF.nd_part},
        segretario:{obbl:true, rif:RIF.nd_segr, ph:'es. sig. Marco Gialli, genitore'},
      });
    },
  });

  /* ------------------------------------------------------------------ */
  /* 4. ELEZIONE DEI RAPPRESENTANTI DEI GENITORI                         */
  /* ------------------------------------------------------------------ */
  const N_RAPPR = {I:'1 rappresentante per ciascuna sezione', P:'1 rappresentante per ciascuna classe', S:'fino a 4 rappresentanti per ciascuna classe'};
  const PREF = {I:'1 preferenza', P:'1 preferenza', S:'2 preferenze'};
  const RIF_EL = 'Necessario per la regolarità delle operazioni elettorali e della proclamazione – O.M. 215/1991, artt. 21-22';

  registra({
    id:'elezioni-rappresentanti', argomento:'organi', scuole:['I', 'P', 'S'], file:'Verbale_elezioni_rappresentanti',
    titolo:'Verbale delle operazioni di voto e scrutinio',
    occhiello:'Elezione annuale dei rappresentanti dei genitori – procedura semplificata',
    sottotitolo:'Elezione annuale dei rappresentanti dei genitori – procedura semplificata (riferimento: artt. 21-22 O.M. 215/1991)',
    descrizione:'Seggio, votanti, preferenze, proclamazione degli eletti (entro il 31 ottobre)',
    legenda:() => 'Gli elementi segnati con * servono a documentare la regolarità del seggio, dello scrutinio e della proclamazione: se mancano, l’elezione può essere contestata.',
    norme:(s) => [
      'D.Lgs. 297/1994, art. 5 – composizione dei consigli di intersezione, interclasse e classe: ' + N_RAPPR[s] + ' (riferimento per la paritaria tramite il Regolamento).',
      'O.M. 215/1991 (e successive modifiche), artt. 21-22 – elezioni annuali con procedura semplificata: assemblea, seggio con un presidente e due scrutatori, lista unica di tutti i genitori, ' + PREF[s] + ', scrutinio immediato, sorteggio in caso di parità.',
      'Nota MIM annuale sulle elezioni degli organi collegiali a livello di istituzione scolastica – operazioni concluse entro il 31 ottobre (a.s. 2026/27: estremi da verificare; per il 2025/26 nota prot. 42616 del 19/9/2025).',
      'L. 62/2000, art. 1 c. 4 lett. c – organi collegiali della scuola paritaria regolati dal Regolamento.',
      'Reg. UE 2016/679 (GDPR) – diffusione dei soli nomi degli eletti; elenco elettori e schede conservati agli atti.',
    ],
    blocchi:(s) => ritocca([
      ...H.testata(s, [{t:'testo', id:'sezione', label:SEZ[s]}, {t:'testo', id:'seggio', label:'Seggio n.'}]),
      {t:'testofisso', testo:`Elezione dei rappresentanti dei genitori nel ${CONSIGLIO[s]} – ${SEZ[s].toLowerCase()} {sezione}. Si eleggono ${N_RAPPR[s]}; ogni elettore può esprimere ${PREF[s]}. Sono elettori ed eleggibili entrambi i genitori (o chi ne fa legalmente le veci) degli ${s === 'I' ? 'bambini' : 'alunni'} iscritti.`},
      {t:'nota', testo:'Le elezioni annuali si concludono entro il 31 ottobre. Precede l’assemblea dei genitori (usare il modulo «Verbale di assemblea dei genitori»). Voto su lista unica comprendente tutti i genitori; scheda segreta. Se i votanti sono pochi, il seggio può essere accorpato con quello di altre ' + (s === 'I' ? 'sezioni' : 'classi') + ', trasferendo elenco e urna.'},
      {t:'h', testo:'Costituzione del seggio'},
      {t:'riga', campi:[
        {t:'testo', id:'pres_seggio', label:'Presidente del seggio', w:4, nopdf:true},
        {t:'testo', id:'scrutatore1', label:'Scrutatore', w:4, nopdf:true},
        {t:'testo', id:'scrutatore2', label:'Scrutatore', w:4, nopdf:true}]},
      {t:'riga', campi:[
        {t:'ora', id:'ora_apertura', label:'Apertura del seggio', w:4, nopdf:true},
        {t:'ora', id:'ora_chiusura', label:'Chiusura del seggio', w:4, nopdf:true},
        {t:'testo', id:'luogo', label:'Luogo', w:4, nopdf:true}]},
      {t:'testofisso', testo:'Il giorno {data}, alle ore {ora_apertura}, presso {luogo}, al termine dell’assemblea dei genitori si costituisce il seggio elettorale composto dai genitori {pres_seggio} (presidente), {scrutatore1} e {scrutatore2} (scrutatori). Il presidente, verificati l’elenco degli elettori, le schede e l’urna, dichiara aperte le operazioni di voto. Gli elettori votano previo riconoscimento e firmano l’elenco. Alle ore {ora_chiusura} il presidente dichiara chiuse le votazioni e si procede immediatamente allo scrutinio.'},
      {t:'h', testo:'Risultati dello scrutinio'},
      {t:'riga', campi:[
        {t:'num', id:'elettori', label:'Elettori aventi diritto', w:4},
        {t:'num', id:'votanti', label:'Votanti', w:4},
        {t:'num', id:'valide', label:'Schede valide', w:4}]},
      {t:'riga', campi:[
        {t:'num', id:'bianche', label:'Schede bianche', w:4},
        {t:'num', id:'nulle', label:'Schede nulle', w:4},
        {t:'num', id:'non_utilizzate', label:'Schede non utilizzate', w:4}]},
      {t:'nota', testo:'Controllo: votanti = schede valide + bianche + nulle.'},
      {t:'tabella', id:'voti', label:'Voti di preferenza riportati', col:[
        {h:'Cognome e nome del genitore', w:7, ph:'es. Verdi Anna'}, {h:'Voti di preferenza', w:2, ph:'es. 9'}, {h:'Note', w:3, ph:'es. genitore di due alunni: vota una sola volta'}], righe:6, aggiungi:true},
      {t:'nota', testo:'Riportare tutti i genitori che hanno ottenuto almeno un voto, in ordine decrescente. Preferenze oltre il numero consentito: si considerano valide solo le prime (verificare il regolamento); scheda con segni di riconoscimento: nulla.'},
      {t:'scelta', id:'parita', label:'Parità di voti per l’ultimo posto', opz:['Non si sono verificate parità', 'Si è proceduto a sorteggio'], def:'Non si sono verificate parità'},
      {t:'se', campo:'parita', vale:'Si è proceduto a sorteggio', blocchi:[
        {t:'area', id:'sorteggio', label:'Esito del sorteggio (genitori in parità, modalità, estratto)', righe:2,
          ph:'es. Parità a 5 voti tra i genitori Neri e Gialli; sorteggio con biglietti chiusi alla presenza del seggio: estratto il sig. Gialli.',
          frasi:[
            'Avendo i genitori … e … riportato lo stesso numero di voti per l’ultimo posto, il presidente procede al sorteggio alla presenza degli scrutatori.',
            'Il sorteggio si svolge con biglietti chiusi recanti i nomi dei genitori in parità, estratti da uno scrutatore.',
            'Risulta estratto il genitore …, che viene proclamato eletto.',
            'Nessuno dei presenti solleva obiezioni sulle modalità del sorteggio.',
          ]},
      ]},
      {t:'h', testo:'Proclamazione degli eletti'},
      {t:'tabella', id:'eletti', col:[{h:'Cognome e nome', w:7, ph:'es. Verdi Anna'}, {h:'Voti', w:2, ph:'es. 9'}, {h:'Note (es. eletto per sorteggio)', w:3, ph:'es. eletta per sorteggio'}], righe:s === 'S' ? 4 : 1, aggiungi:true},
      {t:'testofisso', testo:`Il presidente del seggio proclama eletti rappresentanti dei genitori nel ${CONSIGLIO[s]} i genitori sopra indicati. Il presente verbale, l’elenco degli elettori con le firme dei votanti e le schede scrutinate sono chiusi in plico e consegnati alla segreteria della scuola.`},
      {t:'nota', testo:'Dopo la consegna del plico il Coordinatore didattico rende noti gli eletti alle famiglie e ne dispone la nomina nel consiglio secondo il regolamento.'},
      {t:'area', id:'contestazioni', label:'Eventuali contestazioni o osservazioni', righe:2,
        ph:'es. Nessuna contestazione. Oppure: un elettore segnala che il proprio nome non compare nell’elenco; verificata l’iscrizione, è ammesso al voto.',
        frasi:[
          'Durante le operazioni di voto e di scrutinio non sono state presentate contestazioni.',
          'Un elettore non presente nell’elenco è stato ammesso al voto dopo la verifica dell’iscrizione del figlio/a da parte della segreteria.',
          'Una scheda è stata dichiarata nulla perché recava segni di riconoscimento; la decisione è stata presa all’unanimità dal seggio.',
          'Il genitore … chiede che venga messa a verbale la seguente osservazione: …',
          'Il seggio è stato accorpato con quello della ' + SEZ[s].toLowerCase() + ' … per l’esiguo numero di votanti; elenco e urna sono stati trasferiti.',
        ]},
      {t:'nota', testo:'I nomi dei genitori eletti sono resi noti alle famiglie della ' + SEZ[s].toLowerCase() + '; i nomi dei soli votati non eletti non vanno diffusi oltre il verbale.'},
      {t:'testofisso', testo:'Letto, confermato e sottoscritto.'},
      {t:'firme', ruoli:['Il Presidente del seggio', 'Lo scrutatore', 'Lo scrutatore']},
    ], {
      as:{ph:'es. 2026/27'},
      data:{obbl:true, rif:RIF_EL},
      sezione:{ph:s === 'I' ? 'es. Sezione Azzurra' : 'es. 3ª B', obbl:true, rif:RIF_EL},
      seggio:{ph:'es. 1'},

          'La durata indicativa del colloquio è di circa 20-25 minuti per candidato.',

      {t:'testofisso', testo:'Per i candidati con disabilità la sottocommissione predispone, se necessario e sulla base del PEI, prove differenziate idonee a valutare i progressi in rapporto alle potenzialità e ai livelli di apprendimento iniziali, con valore equivalente ai fini del superamento dell’esame e del diploma; i candidati utilizzano attrezzature tecniche e sussidi didattici e ogni forma di ausilio impiegata durante l’anno. Ai candidati che non si presentano all’esame è rilasciato un attestato di credito formativo.'},
      {t:'testofisso', testo:'Per i candidati con DSA le modalità di svolgimento delle prove sono coerenti con il PDP: tempi più lunghi e strumenti compensativi utilizzati in corso d’anno, senza pregiudizio per la validità delle prove. In caso di dispensa dalla prova scritta di lingua straniera la sottocommissione stabilisce una prova orale sostitutiva; in caso di esonero dalle lingue straniere sono predisposte prove differenziate con valore equivalente. Nel diploma e nei tabelloni non si fa menzione delle modalità di svolgimento.'},
