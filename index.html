<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Modulistica docenti – Scuola Sacra Famiglia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<!--
  Modulistica docenti – Scuola Sacra Famiglia, Orzinuovi (BS)
  Architettura:
  - single file, vanilla JS. I moduli sono SCHEMI DATI registrati con registra({...})
    (specifica in SPEC_SCHEMI.md); un unico motore li rende come form e come PDF.
  - PRIVACY: nessun dato lascia la pagina. Niente localStorage/sessionStorage/IndexedDB/cookie,
    nessuna richiesta di rete con i dati. Lo stato vive solo nella variabile STATO e viene
    azzerato uscendo dal modulo. Il PDF e' generato nel browser con jsPDF e scaricato.
  - PDF: testo vettoriale (non screenshot), A4 verticale, impaginazione compatta:
    le voci vuote e le opzioni non spuntate vengono omesse (opzione disattivabile).
  - Font PDF: Helvetica standard (WinAnsi). pulisci() normalizza i caratteri non coperti.
-->
<style>
:root{
  --blu:#123E90; --blu-2:#0c2c69; --blu-t:#e8eef9; --blu-tt:#f4f7fc;
  --ink:#1c2433; --muted:#5b6475; --line:#d9dfea; --bg:#f5f7fb; --card:#ffffff;
  --N:#2f9e3a; --I:#d81b77; --P:#ef8a00; --S:#2489cf;
  --ambra:#b7791f; --ambra-t:#fdf3e1; --verde:#2f855a; --verde-t:#e6f4ec;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Fira Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blu)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
/* ---------- barra superiore ---------- */
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top .wrap{display:flex;align-items:center;gap:14px;height:66px}
.top img{width:44px;height:44px}
.brand b{display:block;color:var(--blu);font-size:17px;letter-spacing:.2px}
.brand span{font-size:12.5px;color:var(--muted)}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--verde);background:var(--verde-t);border-radius:99px;padding:5px 11px;font-weight:500}
.pill svg{width:14px;height:14px}
/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;padding:26px 0 14px}
.hero h1{margin:0;font-size:28px;color:var(--blu-2)}
.hero p{margin:6px 0 0;color:var(--muted);max-width:720px}
.privacy{background:#fff;border:1px solid var(--line);border-left:4px solid var(--verde);border-radius:var(--r);padding:12px 16px;font-size:13.5px;color:#2d3748;margin:6px 0 18px}
.privacy b{color:var(--verde)}
.filtri{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:8px}
.seg{display:flex;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:7px}
.seg button .dot{width:10px;height:10px;border-radius:50%}
.seg button[aria-pressed=true]{background:var(--blu);color:#fff}
.cerca{flex:1;min-width:220px;position:relative}
.cerca input{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--line);border-radius:12px;background:#fff}
.cerca svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.gruppo{margin:22px 0 6px}
.gruppo h2{font-size:14px;text-transform:uppercase;letter-spacing:.8px;color:var(--blu);margin:0 0 10px;display:flex;align-items:center;gap:10px}
.gruppo h2 small{font-weight:500;color:var(--muted);text-transform:none;letter-spacing:0}
.griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.doc{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,box-shadow .15s;text-align:left}
.doc:hover,.doc:focus-visible{border-color:var(--blu);box-shadow:0 4px 14px rgba(18,62,144,.10);outline:none}
.doc b{font-size:15px;color:var(--ink)}
.doc p{margin:0;font-size:13px;color:var(--muted);flex:1}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.bdg{font-size:11.5px;font-weight:600;border-radius:6px;padding:3px 8px;color:#fff;border:0;cursor:pointer}
.bdg.N{background:var(--N)}.bdg.I{background:var(--I)}.bdg.P{background:var(--P)}.bdg.S{background:var(--S)}
.bdg:hover{filter:brightness(.92)}
.vuoto{color:var(--muted);padding:30px 0}
footer.pie{color:var(--muted);font-size:12.5px;padding:30px 0 40px;text-align:center}
/* ---------- modulo ---------- */
.bar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:66px;z-index:15}
.bar .wrap{display:flex;align-items:center;gap:10px;min-height:58px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.bar h1{font-size:17px;margin:0;color:var(--blu-2)}
.bar .meta{font-size:12.5px;color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 13px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn:hover{border-color:var(--blu);color:var(--blu)}
.btn.pri{background:var(--blu);border-color:var(--blu);color:#fff}
.btn.pri:hover{background:var(--blu-2);color:#fff}
.chk-inline{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.form{max-width:980px;margin:18px auto 80px;padding:0 20px}
.sez{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 18px;margin-bottom:14px}
.sez>h3{margin:-2px 0 12px;font-size:15px;color:var(--blu);text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;gap:9px}
.sez>h3::before{content:"";width:5px;height:18px;border-radius:3px;background:var(--acc,var(--blu))}
.g{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px 14px}
.g>*{min-width:0}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>label,.f>.lbl{font-size:12.5px;font-weight:600;color:#39445a}
.f input[type=text],.f input[type=date],.f input[type=time],.f input[type=number],.f textarea,.f select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fbfcfe;width:100%}
.f textarea{resize:vertical;min-height:64px;line-height:1.4}
/* testo guida (esempio) in grigio chiaro: sparisce appena si scrive */
::placeholder{color:#a9b1bf;font-style:italic;opacity:1}
.frasi{display:flex;gap:6px;align-items:center;margin-top:4px}
.frasi select{flex:1;min-width:0;border:1px dashed #c7d2e6;border-radius:8px;padding:6px 8px;background:#f7f9fd;color:#34507f;font-size:13px}
.frasi svg{width:15px;height:15px;color:#6a7fa6;flex:none}
/* campi obbligatori ai fini della validita' */
.obbl{border-left:3px solid var(--ambra);padding-left:10px;border-radius:2px}
.obbl input[type=text],.obbl input[type=date],.obbl input[type=time],.obbl input[type=number],.obbl textarea{border-color:#e7c78b;background:#fffaf0}
/* pannello riferimenti normativi (solo schermo) */
details.norme{background:#fff;border:1px solid var(--line);border-left:4px solid var(--blu);border-radius:var(--r);padding:10px 14px;margin-bottom:14px}
details.norme summary{cursor:pointer;font-weight:600;color:var(--blu);font-size:14px}
details.norme ul{margin:8px 0 2px;padding-left:18px;font-size:13px;color:#39445a}
details.norme li{margin:3px 0}
details.norme p{margin:6px 0 0;font-size:12.5px;color:var(--muted)}
.f input:focus,.f textarea:focus,.f select:focus{outline:2px solid rgba(18,62,144,.25);border-color:var(--blu);background:#fff}
.f .aiuto{font-size:12px;color:var(--muted)}
.opz{display:grid;gap:6px 16px}
.opz label{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer;font-weight:400;color:var(--ink)}
.opz input{margin-top:3px;accent-color:var(--blu);width:16px;height:16px;flex:none}
.altro{margin-top:6px}
.nota{grid-column:1/-1;background:var(--blu-tt);border:1px solid #d6e0f3;border-radius:8px;padding:9px 12px;font-size:13px;color:#2b3f66;display:flex;gap:9px}
.nota svg{flex:none;width:16px;height:16px;margin-top:2px;color:var(--blu)}
.fisso{grid-column:1/-1;font-size:14px;background:#fafbfd;border:1px dashed var(--line);border-radius:8px;padding:10px 12px;color:#2d3748}
.fisso .ph{background:var(--ambra-t);color:var(--ambra);border-radius:4px;padding:0 4px;font-size:12.5px}
.fisso .val{background:var(--blu-t);color:var(--blu-2);border-radius:4px;padding:0 4px;font-weight:500}
.tab{grid-column:1/-1;overflow-x:auto}
.tab table{width:100%;border-collapse:collapse;font-size:13.5px}
.tab th{background:var(--blu-t);color:var(--blu-2);font-weight:600;text-align:left;padding:7px 8px;border:1px solid var(--line);font-size:12.5px}
.tab td{border:1px solid var(--line);padding:0;vertical-align:top}
.tab td.fissa{background:#fafbfd;padding:7px 8px;font-weight:500;color:#39445a;min-width:140px}
.tab td input[type=text],.tab td textarea{border:0;width:100%;padding:7px 8px;background:transparent;min-height:34px;resize:vertical;display:block}
.tab td textarea{min-height:52px}
.tab td input:focus,.tab td textarea:focus{outline:2px solid rgba(18,62,144,.25);background:#fff}
.tab td.c{text-align:center;vertical-align:middle;padding:6px}
.tab td.c input{accent-color:var(--blu);width:17px;height:17px}
.tab td.azz{width:34px;text-align:center;vertical-align:middle;border-color:transparent}
.ico{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:4px;border-radius:6px;display:inline-flex}
.ico:hover{color:var(--blu);background:var(--blu-t)}
.ico svg{width:15px;height:15px}
.agg{margin-top:8px}
.elenco{display:flex;flex-direction:column;gap:6px}
.elenco .it{display:flex;gap:8px;align-items:center}
.elenco .n{width:24px;font-weight:600;color:var(--blu);text-align:right}
.elenco input{flex:1}
.firme{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;grid-column:1/-1}
.firme .f{background:#fafbfd;border:1px solid var(--line);border-radius:8px;padding:10px}
.nascosto{display:none!important}
/* elementi essenziali (obbligatori pena invalidita') */
.obbl>label::after,.obbl>.lbl::after{content:" *";color:var(--ambra);font-weight:700}
.obbl-rif{font-size:11.5px;color:var(--ambra);display:flex;gap:5px;align-items:flex-start}
.obbl-rif::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--ambra);margin-top:5px}
.obbl.manca input,.obbl.manca textarea,.obbl.manca .opz,.obbl.manca .tab,.obbl.manca .elenco{outline:2px solid var(--ambra);outline-offset:2px;border-radius:8px}
.legenda{background:var(--ambra-t);border:1px solid #f0d9a8;border-radius:var(--r);padding:11px 14px;font-size:13.5px;color:#6b4a12;margin-bottom:14px}
.legenda b{color:var(--ambra)}
.rif{font-size:13px;color:#39445a;margin:0;padding-left:18px}
.rif li{margin:2px 0}
.mancanti{margin:0 0 14px;padding-left:18px;font-size:14px;color:#2d3748;max-height:40vh;overflow:auto}
.mancanti li{margin:4px 0}
.mancanti small{display:block;color:var(--ambra)}
/* ---------- carta intestata (impaginazione di un documento del docente) ---------- */
.cta{display:flex;gap:16px;align-items:center;background:linear-gradient(90deg,var(--blu) 0%,#1d56b8 100%);color:#fff;border-radius:var(--r);padding:16px 18px;margin:4px 0 18px;cursor:pointer;border:0;width:100%;text-align:left}
.cta:hover{filter:brightness(1.06)}
.cta svg{width:34px;height:34px;flex:none}
.cta b{display:block;font-size:16px}
.cta span{font-size:13.5px;opacity:.9}
.drop{border:2px dashed #b9c6de;border-radius:12px;background:#f7f9fd;padding:26px;text-align:center;cursor:pointer;color:#39445a}
.drop.su{border-color:var(--blu);background:var(--blu-t)}
.drop b{color:var(--blu)}
.drop svg{width:36px;height:36px;color:var(--blu);display:block;margin:0 auto 8px}
.file-ok{display:flex;gap:10px;align-items:center;background:var(--verde-t);border-radius:8px;padding:10px 12px;color:#1f5e3d;font-size:14px}
.scelte-scuola{display:flex;flex-wrap:wrap;gap:8px}
.scelte-scuola button{border:2px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:600;display:flex;gap:8px;align-items:center;min-height:44px}
.scelte-scuola button .dot{width:12px;height:12px;border-radius:50%}
.scelte-scuola button[aria-pressed=true]{border-color:var(--blu);background:var(--blu-t);color:var(--blu-2)}
/* ---------- anteprima ---------- */
.modal{position:fixed;inset:0;background:rgba(15,25,45,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.modal .box{background:#fff;border-radius:14px;width:min(980px,100%);height:min(92vh,1200px);display:flex;flex-direction:column;overflow:hidden}
.modal .box.small{height:auto;width:min(520px,100%);padding:22px}
.modal .hd{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.modal .hd b{flex:1;color:var(--blu-2)}
.modal iframe{flex:1;border:0;width:100%}
.modal h3{margin:0 0 8px;color:var(--blu-2)}
.modal p{margin:0 0 14px;color:#2d3748;font-size:14.5px}
.modal .az{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--blu-2);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.2)}
@media (max-width:760px){
  .wrap{padding:0 14px}
  .hero{grid-template-columns:1fr}
  .hero h1{font-size:23px}
  .g{grid-template-columns:minmax(0,1fr)}
  .g>*{grid-column:1/-1!important}
  .top .wrap{height:58px}
  .top img{width:36px;height:36px}
  .brand span{display:none}
  .top .pill span{display:none}
  .bar{top:58px}
  .bar .wrap{gap:6px;min-height:0}
  .bar .wrap>div{min-width:0!important;flex:1 1 100%!important;order:-1}
  .opz{grid-template-columns:minmax(0,1fr)!important}
  .bar h1{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .btn{padding:7px 10px;font-size:14px}
  .chk-inline{order:5}
  .form{padding:0 10px;margin-top:12px}
  .sez{padding:14px 12px}
  .tab table{min-width:560px}
  .seg button{padding:7px 10px}
}
@media print{.top,.bar{display:none}}
/* Tablet (iPad verticale/orizzontale): barra del modulo compatta */
@media (max-width:1100px){
  .bar .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .wrap>div{min-width:0!important}
  /* campi da 1-2 colonne (es. data) troppo stretti: portati a 3 */
  .g>[style$="span 1"],.g>[style$="span 2"]{grid-column:span 3!important}
}
/* Dispositivi touch (iPad, tablet, telefoni) */
@media (pointer:coarse){
  .f input[type=text],.f input[type=date],.f input[type=time],.f input[type=number],.f textarea,.f select,
  .tab td input[type=text],.tab td textarea,.tab td select,.elenco input,.cerca input{font-size:16px}
  .f input[type=date],.f input[type=time]{min-height:44px}
  .opz label{padding:6px 0;font-size:15px}
  .opz input,.tab td.c input{width:22px;height:22px}
  .btn{min-height:44px}
  .ico{padding:10px}
  .ico svg{width:18px;height:18px}
  .bdg{padding:6px 10px;font-size:12.5px}
  .seg button{min-height:40px}
  .doc{padding:16px}
}
</style>
</head>

<script>
'use strict';
/* =====================================================================

   ===================================================================== */
const MODULI = [];
function registra(m){ MODULI.push(m); }

const SCUOLE = {
  N:{nome:'Green Nido', breve:'Nido', col:'#2f9e3a', pdf:[47,158,58]},
  I:{nome:"Scuola dell'Infanzia", breve:'Infanzia', col:'#d81b77', pdf:[216,27,119]},

  S:{nome:'Scuola Secondaria di I grado', breve:'Secondaria', col:'#2489cf', pdf:[36,137,207]},
};
const ARGOMENTI = [
  ['generici','Verbali generici – struttura libera'],
  ['organi','Organi collegiali'],
  ['programmazione','Programmazione e progettazione'],
  ['consigli','Consigli, scrutini e relazioni'],
  ['glo','GLO – Gruppo di Lavoro Operativo'],
  ['pei','PEI – Piano Educativo Individualizzato'],
  ['pdp','PDP – Piano Didattico Personalizzato'],
  ['bes','BES – Bisogni Educativi Speciali'],
  ['incontri','Incontri con famiglie e specialisti'],
  ['continuita','Continuità tra gradi'],
  ['tutela','Disciplina e tutela'],
  ['valutazione','Valutazione'],
  ['esami','Esame di Stato del primo ciclo'],
  ['relazioni','Relazioni e documenti del docente'],
  ['sicurezza','Sicurezza, salute e frequenza'],
];
const LOGO = document.querySelector('.top img').src;
const IOS = /iP(ad|hone|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const SCUOLA_NOME = 'Scuola Sacra Famiglia';
const SCUOLA_SUB = "S. Paola Elisabetta Cerioli – Via Milano, 75 – 25034 Orzinuovi (BS)";

function annoScolastico(){
  const d = new Date(), y = d.getFullYear();
  return d.getMonth() >= 7 ? `${y}/${y+1}` : `${y-1}/${y}`;
}
function oggiISO(){
  const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0,10);
}
function dataIT(v){ if(!v) return ''; const [y,m,g] = v.split('-'); return `${g}/${m}/${y}`; }

/* =====================================================================
   HELPER PER GLI SCHEMI (blocchi ricorrenti)
   ===================================================================== */
const H = {
  NOMI: {N:'Green Nido', I:"Scuola dell'Infanzia", P:'Scuola Primaria', S:'Scuola Secondaria di I grado'},
  PRES: {N:'Coordinatrice pedagogica', I:'Coordinatore didattico', P:'Coordinatore didattico', S:'Coordinatore didattico'},
  testata(s, extra = []){
    // griglia a 12 colonne intere: gli extra si dividono 8 colonne, il resto va ad anno e data
    const w = extra.length ? Math.floor(8 / extra.length) : 0;
    const resto = extra.length ? (12 - w * extra.length) / 2 : 6;
    return [{t:'h', testo:'Dati generali'},
      {t:'riga', campi:[
        {t:'testo', id:'as', label:s === 'N' ? 'Anno educativo' : 'Anno scolastico', w:resto, def:annoScolastico()},
        {t:'data', id:'data', label:'Data', w:resto, oggi:true},
        ...extra.map(e => Object.assign({w}, e))]}];
  },
  apertura(organo){
    return [
      {t:'riga', campi:[
        {t:'ora', id:'ora_inizio', label:'Ora di inizio', w:3, nopdf:true},
        {t:'scelta', id:'modalita', label:'Modalità', opz:['in presenza','a distanza'], w:4, def:'in presenza', nopdf:true},
        {t:'testo', id:'luogo', label:'Luogo / piattaforma', w:5, ph:'es. aula docenti, 1° piano – oppure Google Meet', nopdf:true}]},
      {t:'testofisso', testo:`Il giorno {data}, alle ore {ora_inizio}, {modalita} ({luogo}), si riunisce ${organo} per discutere il seguente ordine del giorno.`}
    ];
  },
  presenti(ruoli = [], titolo = 'Presenti'){
    return [{t:'h', testo:titolo},
      {t:'tabella', id:'presenti', col:[{h:'Cognome e nome', w:5, ph:'es. Rossi Maria'}, {h:'Ruolo / qualifica', w:5, ph:'es. docente di matematica'}, {h:'Presenza', w:2, tipo:'pres'}],
       righe:Math.max(4, ruoli.length), init:ruoli.map(r => ['', r, 'P']), aggiungi:true},
      {t:'nota', testo:'Presenza: P = presente, A = assente, AG = assente giustificato. Le righe vuote non vengono stampate.'}];
  },
  presidenza(presidente = 'Coordinatore didattico'){
    return [{t:'riga', campi:[
        {t:'testo', id:'presidente', label:`Presiede (${presidente} o delegato)`, w:6, nopdf:true, ph:'es. prof.ssa Maria Rossi, Coordinatore didattico'},
        {t:'testo', id:'segretario', label:'Segretario verbalizzante', w:6, nopdf:true, ph:'es. ins. Luca Bianchi'}]},
      {t:'testofisso', testo:'Presiede {presidente}; funge da segretario verbalizzante {segretario}. Constatata la validità della seduta, il Presidente dichiara aperti i lavori.'}];
  },
  odg(punti = []){
    return [{t:'h', testo:'Ordine del giorno'}, {t:'elenco', id:'odg', init:punti, min:Math.max(3, punti.length), ph:'es. Approvazione del verbale della seduta precedente'}];
  },
  trattazione(){
    return [{t:'h', testo:'Trattazione dei punti'},
      {t:'nota', testo:'Per ogni punto: sintesi degli interventi (chi, che cosa), proposte emerse e decisione. Linguaggio oggettivo e descrittivo.'},
      {t:'tabella', id:'trattazione', col:[{h:'Punto', w:1, ph:'1'}, {h:'Sintesi della discussione', w:7, tipo:'area', ph:'es. La prof.ssa Rossi illustra i risultati delle prove d’ingresso; interviene il prof. Bianchi proponendo attività di recupero a piccoli gruppi…'}, {h:'Decisioni', w:4, tipo:'area', ph:'es. Si approva all’unanimità il calendario del recupero'}], righe:3, aggiungi:true}];
  },
  delibere(){
    return [{t:'tabella', id:'delibere', label:'Delibere e votazioni',
      col:[{h:'Oggetto della delibera', w:6, tipo:'area', ph:'es. Adozione dei criteri comuni di valutazione delle prove scritte'}, {h:'Favorevoli', w:1.5, ph:'12'}, {h:'Contrari', w:1.5, ph:'0'}, {h:'Astenuti', w:1.5, ph:'1'}, {h:'Esito', w:1.5, ph:'approvata'}], righe:1, aggiungi:true}];
  },
  impegni(){
    return [{t:'tabella', id:'impegni', label:'Impegni operativi',
      col:[{h:'Azione / compito', w:7, tipo:'area', ph:'es. Predisporre la prova comune di italiano per le classi terze'}, {h:'Responsabile', w:3, ph:'es. prof.ssa Rossi'}, {h:'Scadenza', w:2, ph:'es. 15/11'}], righe:2, aggiungi:true}];
  },
  chiusura(ruoli = ['Il Presidente', 'Il Segretario verbalizzante']){
    return [{t:'h', testo:'Chiusura'},

const RIF_ESS = {

  organo:'Identificazione dell\u2019organo (Regolamento OO.CC.; artt. 5 e 7 D.Lgs. 297/1994)',

  segretario:'Firma del segretario verbalizzante essenziale (CdS sez. II n. 3544/2020)',
};
function marcaEssenziali(bl){
  const walk = (arr) => arr.map(b => {
    const c = Object.assign({}, b);
    if (c.campi) c.campi = walk(c.campi);
    if (c.blocchi) c.blocchi = walk(c.blocchi);
    if (c.id && RIF_ESS[c.id] && !c.obbl){ c.obbl = true; c.rif = RIF_ESS[c.id]; }
    return c;
  });
  return walk(bl);
}

/* Ogni modulo, anche il piu' dettagliato, riceve una sezione di annotazioni libere prima della
   chiusura/firme: copre i casi non previsti. Vuota = non stampata. Disattivabile con libere:false. */
function conAnnotazioni(bl){
  if (MOD.libere === false || bl.some(b => b.t === 'libere')) return bl;
  const extra = [{t:'h', testo:'Annotazioni aggiuntive'},
    {t:'nota', testo:'Sezione facoltativa: aggiungi qui punti non previsti dal modulo (ogni sezione ha titolo e testo). Se resta vuota non compare nel PDF.'},
    {t:'libere', id:'_annotazioni', init:[], sottotitoli:true, aggiungi:'Aggiungi annotazione'}];
  let i = bl.length;
  for (let k = bl.length - 1; k >= 0; k--){
    const b = bl[k];
    if (b.t === 'firme' || (b.t === 'h' && /chiusura|presa visione|firme/i.test(b.testo))){ i = k; if (b.t === 'h') break; }
  }
  // se prima delle firme c'e' un testo fisso (es. "Letto, confermato..."), inserisci prima di quello
  while (i > 0 && bl[i - 1].t === 'testofisso' && bl[i] && bl[i].t === 'firme') i--;
  return [...bl.slice(0, i), ...extra, ...bl.slice(i)];
}

/* valori iniziali (default, oggi, righe tabelle) */
function inizializza(blocchi){
  for (const b of blocchi){
    if (b.t === 'riga') inizializza(b.campi);
    else if (b.t === 'se') inizializza(b.blocchi);
    else if (b.id && STATO[b.id] === undefined){
      if (b.t === 'tabella'){
        const n = b.fisse ? b.fisse.length : (b.righe || 3);
        const init = b.init || [];
        STATO[b.id] = Array.from({length:Math.max(n, init.length)}, (_, i) => b.col.map((c, j) => (init[i] && init[i][j] != null) ? init[i][j] : (c.tipo === 'x' ? false : '')));
      } else if (b.t === 'elenco') STATO[b.id] = [...(b.init || []), ...Array(Math.max(0, (b.min || 3) - (b.init || []).length)).fill('')];
      else if (b.t === 'multi') STATO[b.id] = b.def ? [...b.def] : [];
      else if (b.t === 'matrice') STATO[b.id] = {};
      else if (b.t === 'firme') STATO[b.id || 'firme'] = {};
      else if (b.t === 'libere') STATO[b.id] = (b.init || [{titolo:'', testo:''}]).map(x => Object.assign({titolo:'', testo:''}, x));
      else if (b.t === 'data' && b.oggi) STATO[b.id] = oggiISO();
      else STATO[b.id] = b.def != null ? b.def : '';
    }
    if (b.t === 'firme' && !b.id){ b.id = 'firme'; if (!STATO.firme) STATO.firme = {}; }
  }
}
function segna(){ SPORCO = true; aggiornaDinamici(); }

function haObbl(bl){ return bl.some(b => b.obbl || (b.campi && haObbl(b.campi)) || (b.blocchi && haObbl(b.blocchi))); }
function disegnaForm(root){
  root.innerHTML = '';
  const norme = typeof MOD.norme === 'function' ? MOD.norme(SCU) : (MOD.norme || []);
  if (norme.length) root.append(el('details', {class:'norme'},
    el('summary', {}, 'Riferimenti normativi di questo documento'),
    el('ul', {}, norme.map(n => el('li', {}, n))),
    el('p', {}, 'I riferimenti servono a chi compila e non vengono stampati nel PDF.')));
  if (haObbl(BLOCCHI)){
    const spec = MOD.legenda ? MOD.legenda(SCU) : null;
    root.append(el('div', {class:'legenda', html:'<b>*</b> ' + (spec ? esc(spec) : 'Elementi essenziali del verbale: se mancano, il verbale o le deliberazioni possono essere invalidi o impugnabili.') + ' Sotto ciascuno è indicato il riferimento normativo; al salvataggio l\u2019app segnala quelli non compilati.'}));
  }
  let sez = null, grid = null;
  // conds: condizioni "se" annidate (tutte devono valere). Ogni titolo apre una scheda propria,
  // anche dentro un blocco condizionale: la scheda eredita le condizioni e si nasconde con esse.
  const nuovaSez = (titolo, conds) => {
    sez = el('section', {class:'sez'}); if (titolo) sez.append(el('h3', {}, titolo));
    if (conds.length) sez.dataset.se = JSON.stringify(conds);
    grid = el('div', {class:'g'}); sez.append(grid); root.append(sez);
  };
  // restituisce la griglia corrente dopo aver disegnato; 'aperte' segnala se sono state create schede
  const disegna = (blocchi, dest, conds) => {
    let aperte = false;
    for (const b of blocchi){
      if (b.t === 'h'){ nuovaSez(b.testo, conds); dest = grid; aperte = true; continue; }
      if (b.t === 'se'){
        const nc = [...conds, [b.campo, b.vale]];
        if (b.blocchi[0] && b.blocchi[0].t === 'h'){
          // il blocco inizia con un titolo: le sue schede sono condizionate, nessun contenitore
          disegna(b.blocchi, null, nc);
          aperte = true; dest = null;
        } else if (!dest){
          // serve una scheda senza titolo: la si condiziona come il blocco
          nuovaSez(null, nc);
          const r = disegna(b.blocchi, grid, nc);
          aperte = true; dest = null;
        } else {
          const box = el('div', {class:'g', style:'grid-column:1/-1', 'data-se':JSON.stringify(nc)});
          dest.append(box);
          const r = disegna(b.blocchi, box, nc);
          if (r.aperte){ aperte = true; dest = null; } // dopo schede condizionali, il contenuto successivo apre una scheda nuova
        }
        continue;
      }
      if (!dest){ nuovaSez(null, conds); dest = grid; }
      const c = campo(b); if (c) dest.append(c);
    }
    return {dest, aperte};
  };
  disegna(BLOCCHI, null, []);
  aggiornaDinamici();
}
/* Menu di frasi preimpostate: la frase scelta viene aggiunta al testo e resta modificabile */
function selettoreFrasi(frasi, area, aggiorna){
  if (!frasi || !frasi.length) return null;
  const sel = el('select', {'aria-label':'Inserisci una frase preimpostata'},
    el('option', {value:''}, 'Inserisci una frase preimpostata…'),
    frasi.map((f, k) => el('option', {value:String(k)}, f.length > 110 ? f.slice(0, 107) + '…' : f)));
  sel.addEventListener('change', () => {
    if (sel.value === '') return;
    const f = frasi[+sel.value];
    const v = area.value.trim();
    area.value = v ? v + (/[.;:]$/.test(v) ? ' ' : '. ') + f : f;
    aggiorna(area.value); sel.value = '';
    area.focus(); area.setSelectionRange(area.value.length, area.value.length);
  });
  return el('div', {class:'frasi', html:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h7"/></svg>'}, sel);
}
function span(b){ return `grid-column:span ${Math.round(b.w || 12)}`; }

function campo(b){

    e.append(el('span', {class:'obbl-rif'}, 'Elemento essenziale' + (b.rif ? ' – ' + b.rif : '')));

function campoBase(b){
  switch (b.t){
    case 'nota': return el('div', {class:'nota', html:SVG.info}, el('span', {}, b.testo));
    case 'testofisso': return el('div', {class:'fisso', 'data-fisso':b.testo});
    case 'salto': return null;
    case 'riga': { const g = el('div', {class:'g', style:'grid-column:1/-1'}); b.campi.forEach(c => g.append(campo(c))); return g; }
    case 'testo': case 'data': case 'ora': case 'num': {
      const tipo = {testo:'text', data:'date', ora:'time', num:'number'}[b.t];
      const i = el('input', {type:tipo, id:'f_' + b.id, value:STATO[b.id] || '', placeholder:b.ph || null});
      i.addEventListener('input', () => { STATO[b.id] = i.value; segna(); });
      return el('div', {class:'f', style:span(b)}, el('label', {for:'f_' + b.id}, b.label), i, b.nota ? el('span', {class:'aiuto'}, b.nota) : null);
    }
    case 'area': {
      const i = el('textarea', {id:'f_' + b.id, rows:b.righe || 3, placeholder:b.ph || null});
      i.value = STATO[b.id] || '';
      i.addEventListener('input', () => { STATO[b.id] = i.value; segna(); });
      return el('div', {class:'f', style:span(b)}, el('label', {for:'f_' + b.id}, b.label), i, selettoreFrasi(b.frasi, i, v => { STATO[b.id] = v; segna(); }), b.nota ? el('span', {class:'aiuto'}, b.nota) : null);
    }
    case 'scelta': case 'multi': {
      const multi = b.t === 'multi';
      const box = el('div', {class:'opz', style:`grid-template-columns:repeat(${multi ? (b.col || 1) : (b.col || Math.min(b.opz.length, (b.w || 12) >= 8 ? 3 : 1))},minmax(0,1fr))`});
      const nome = 'f_' + b.id;
      const opz = [...b.opz, ...(b.altro ? ['Altro'] : [])];
      const altroIn = b.altro ? el('input', {type:'text', class:'altro', placeholder:'Specificare', value:STATO[b.id + '_altro'] || ''}) : null;
      if (altroIn) altroIn.addEventListener('input', () => { STATO[b.id + '_altro'] = altroIn.value; segna(); });
      for (const o of opz){
        const i = el('input', {type:multi ? 'checkbox' : 'radio', name:nome, value:o,
          checked:multi ? STATO[b.id].includes(o) : STATO[b.id] === o});
        i.addEventListener('change', () => {
          if (multi){ STATO[b.id] = [...box.querySelectorAll('input:checked')].map(x => x.value); }
          else STATO[b.id] = i.value;
          if (altroIn) altroIn.classList.toggle('nascosto', !(multi ? STATO[b.id].includes('Altro') : STATO[b.id] === 'Altro'));

        if (!multi) i.addEventListener('click', () => { if (i.dataset.was === '1'){ i.checked = false; STATO[b.id] = ''; i.dataset.was = ''; segna(); } else { box.querySelectorAll('input').forEach(x => x.dataset.was = ''); i.dataset.was = '1'; } });
        if (!multi && STATO[b.id] === o) i.dataset.was = '1';
        box.append(el('label', {}, i, el('span', {}, o)));
      }
      if (altroIn) altroIn.classList.toggle('nascosto', !(multi ? STATO[b.id].includes('Altro') : STATO[b.id] === 'Altro'));
      return el('div', {class:'f', style:span(b), role:multi ? 'group' : 'radiogroup', 'aria-label':b.label || ''},
        b.label ? el('span', {class:'lbl'}, b.label) : null, box, altroIn, b.nota ? el('span', {class:'aiuto'}, b.nota) : null);
    }
    case 'tabella': return tabella(b);
    case 'matrice': {
      const t = el('table');
      t.append(el('thead', {}, el('tr', {}, el('th', {}, ''), b.opz.map(o => el('th', {style:'text-align:center'}, o)))));
      const tb = el('tbody');
      b.voci.forEach((v, r) => {
        const tr = el('tr', {}, el('td', {class:'fissa'}, v));
        b.opz.forEach(o => {
          const i = el('input', {type:'radio', name:`m_${b.id}_${r}`, checked:STATO[b.id][r] === o, 'aria-label':`${v}: ${o}`});
          i.addEventListener('click', () => { if (STATO[b.id][r] === o){ i.checked = false; delete STATO[b.id][r]; } else STATO[b.id][r] = o; segna(); });
          tr.append(el('td', {class:'c'}, i));
        });
        tb.append(tr);
      });
      t.append(tb);
      return el('div', {class:'f', style:'grid-column:1/-1'}, b.label ? el('span', {class:'lbl'}, b.label) : null, el('div', {class:'tab'}, t));
    }
    case 'elenco': {
      const box = el('div', {class:'elenco'});
      const draw = () => {
        box.innerHTML = '';
        STATO[b.id].forEach((v, i) => {
          const inp = el('input', {type:'text', value:v, placeholder:b.ph || '', 'aria-label':`Voce ${i + 1}`, style:'border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fbfcfe'});
          inp.addEventListener('input', () => { STATO[b.id][i] = inp.value; segna(); });
          box.append(el('div', {class:'it'}, el('span', {class:'n'}, (i + 1) + '.'), inp,
            el('button', {class:'ico', title:'Rimuovi', html:SVG.meno, onclick:() => { STATO[b.id].splice(i, 1); draw(); segna(); }})));
        });
        box.append(el('button', {class:'btn agg', html:SVG.piu + 'Aggiungi voce', onclick:() => { STATO[b.id].push(''); draw(); }}));
      };
      draw();
      return el('div', {class:'f', style:'grid-column:1/-1'}, b.label ? el('span', {class:'lbl'}, b.label) : null, box);
    }
    case 'riferimenti':
      return el('div', {class:'f', style:'grid-column:1/-1'}, el('ul', {class:'rif'}, b.voci.map(v => el('li', {}, v))));
    case 'libere': {
      const box = el('div', {class:'elenco', style:'gap:12px'});
      const draw = () => {
        box.innerHTML = '';
        STATO[b.id].forEach((sz, i) => {
          const t = el('input', {type:'text', value:sz.titolo, placeholder:b.phTitolo || 'Titolo della sezione', 'aria-label':`Titolo sezione ${i + 1}`, style:'border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fbfcfe;font-weight:600;flex:1'});
          const a = el('textarea', {rows:4, placeholder:b.phTesto || 'Testo', 'aria-label':`Testo sezione ${i + 1}`, style:'border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fbfcfe;width:100%;resize:vertical'});
          a.value = sz.testo;
          t.addEventListener('input', () => { sz.titolo = t.value; segna(); });
          a.addEventListener('input', () => { sz.testo = a.value; segna(); });
          const sposta = (d) => { const j = i + d; if (j < 0 || j >= STATO[b.id].length) return; [STATO[b.id][i], STATO[b.id][j]] = [STATO[b.id][j], STATO[b.id][i]]; draw(); segna(); };
          box.append(el('div', {style:'border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;display:flex;flex-direction:column;gap:8px'},
            el('div', {class:'it'}, el('span', {class:'n'}, (i + 1) + '.'), t,
              el('button', {class:'ico', title:'Sposta su', html:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 15l-6-6-6 6"/></svg>', onclick:() => sposta(-1)}),
              el('button', {class:'ico', title:'Sposta giù', html:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>', onclick:() => sposta(1)}),
              el('button', {class:'ico', title:'Rimuovi sezione', html:SVG.meno, onclick:() => { STATO[b.id].splice(i, 1); draw(); segna(); }})),
            a));
        });
        box.append(el('button', {class:'btn agg', html:SVG.piu + (b.aggiungi || 'Aggiungi sezione'), onclick:() => { STATO[b.id].push({titolo:'', testo:''}); draw(); }}));
      };
      draw();
      return el('div', {class:'f', style:'grid-column:1/-1'}, b.label ? el('span', {class:'lbl'}, b.label) : null, box);
    }
    case 'firme': {
      const box = el('div', {class:'firme'});
      b.ruoli.forEach((r, i) => {
        const inp = el('input', {type:'text', placeholder:'Nome e cognome (facoltativo)', value:STATO[b.id][i] || ''});
        inp.addEventListener('input', () => { STATO[b.id][i] = inp.value; segna(); });
        box.append(el('div', {class:'f'}, el('span', {class:'lbl'}, r), inp));
      });
      return el('div', {style:'grid-column:1/-1'}, el('div', {class:'lbl', style:'font-size:12.5px;font-weight:600;color:#39445a;margin-bottom:6px'}, 'Firme (lo spazio per la firma autografa viene lasciato nel PDF)'), box);
    }
  }
  return el('div', {}, '[blocco sconosciuto: ' + b.t + ']');
}

function tabella(b){
  const wrap = el('div', {class:'f', style:'grid-column:1/-1'});
  const tot = b.col.reduce((a, c) => a + (c.w || 1), 0);
  const draw = () => {
    wrap.innerHTML = '';
    if (b.label) wrap.append(el('span', {class:'lbl'}, b.label));
    const t = el('table');
    const hr = el('tr');
    b.col.forEach(c => hr.append(el('th', {style:`width:${(c.w || 1) / tot * 100}%;${c.tipo === 'x' || c.tipo === 'pres' || c.tipo === 'sn' ? 'text-align:center' : ''}`}, c.h)));
    if (b.aggiungi) hr.append(el('th', {style:'width:34px;border-color:transparent;background:transparent'}));
    t.append(el('thead', {}, hr));
    const tb = el('tbody');
    STATO[b.id].forEach((riga, r) => {
      const tr = el('tr');
      b.col.forEach((c, j) => {
        if (b.fisse && j === 0){ tr.append(el('td', {class:'fissa'}, b.fisse[r])); return; }
        if (c.tipo === 'x'){
          const i = el('input', {type:'checkbox', checked:!!riga[j], 'aria-label':c.h});
          i.addEventListener('change', () => { riga[j] = i.checked; segna(); });
          tr.append(el('td', {class:'c'}, i)); return;
        }
        if (c.tipo === 'pres' || c.tipo === 'sn'){
          const opz = c.tipo === 'pres' ? ['P', 'A', 'AG'] : ['', 'Sì', 'No'];
          const s = el('select', {'aria-label':c.h, style:'border:0;background:transparent;width:100%;padding:7px 4px;text-align:center'},
            opz.map(o => el('option', {value:o, selected:riga[j] === o}, o || '–')));
          s.addEventListener('change', () => { riga[j] = s.value; segna(); });
          tr.append(el('td', {class:'c', style:'padding:0'}, s)); return;
        }
        const i = c.tipo === 'area' ? el('textarea', {rows:2, 'aria-label':c.h, placeholder:c.ph || null}) : el('input', {type:'text', value:riga[j] || '', 'aria-label':c.h, placeholder:c.ph || null});
        if (c.tipo === 'area') i.value = riga[j] || '';
        i.addEventListener('input', () => { riga[j] = i.value; segna(); });
        tr.append(el('td', {}, i));
      });
      if (b.aggiungi) tr.append(el('td', {class:'azz'}, el('button', {class:'ico', title:'Rimuovi riga', html:SVG.meno,
        onclick:() => { STATO[b.id].splice(r, 1); draw(); segna(); }})));
      tb.append(tr);
    });
    t.append(tb);
    wrap.append(el('div', {class:'tab'}, t));
    if (b.aggiungi) wrap.append(el('button', {class:'btn agg', html:SVG.piu + 'Aggiungi riga',
      onclick:() => { STATO[b.id].push(b.col.map(c => c.tipo === 'x' ? false : (c.tipo === 'pres' ? 'P' : ''))); draw(); }}));
  };
  draw();
  return wrap;
}

/* testi fissi e sezioni condizionali si aggiornano a ogni modifica */
function valoreTesto(id){
  if (id === 'scuola') return SCUOLE[SCU].nome;
  const v = STATO[id];
  if (v == null || v === '' || (Array.isArray(v) && !v.length)) return null;
  if (Array.isArray(v)) return v.map(x => x === 'Altro' ? (STATO[id + '_altro'] || 'altro') : x).join(', ');
  if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return dataIT(v);
  if (v === 'Altro') return STATO[id + '_altro'] || 'altro';
  return String(v);
}
function componi(tpl, perSchermo){
  return tpl.replace(/\{(\w+)\}/g, (_, id) => {
    const v = valoreTesto(id === 'as' ? 'as' : id);
    if (!perSchermo) return v || '________';
    return v ? `<span class="val">${esc(v)}</span>` : '<span class="ph">________</span>';
  });
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;'}[c])); }
function condizione(campoId, vale){
  const v = STATO[campoId], vv = Array.isArray(vale) ? vale : [vale];
  return Array.isArray(v) ? v.some(x => vv.includes(x)) : vv.includes(v);
}
function aggiornaDinamici(){
  document.querySelectorAll('[data-fisso]').forEach(d => d.innerHTML = componi(esc(d.dataset.fisso), true));
  document.querySelectorAll('[data-se]').forEach(d => { const cs = JSON.parse(d.dataset.se); d.classList.toggle('nascosto', !cs.every(([c, v]) => condizione(c, v))); });
}

/* =====================================================================
   PDF (jsPDF) – impaginazione A4 verticale compatta
   ===================================================================== */
const PDF = {M:12, W:186, TOP:36, TOPn:20, BOT:282};
const BLU = [18, 62, 144], INK = [28, 36, 51], GRIGIO = [95, 104, 120], LINEA = [200, 207, 220];
const PT = 0.3528; // mm per punto

/* Helvetica standard copre WinAnsi: normalizza cio' che resta fuori */
function pulisci(s){
  return String(s == null ? '' : s)
    .replace(/[‘’ʼ]/g, "'").replace(/[“”«»]/g, '"')
    .replace(/[–—]/g, '-').replace(/…/g, '...').replace(/ /g, ' ')
    .replace(/[☐☑☒]/g, '').replace(/\t/g, '    ')
    .replace(/[^\x09\x0A\x0D\x20-\x7E -ÿ€]/g, '');
}
function vuoto(v){ return v == null || v === '' || v === false || (Array.isArray(v) && (!v.length || v.every(vuoto))) || (typeof v === 'object' && !Array.isArray(v) && !Object.keys(v).length); }

function creaPDF(man = []){
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a4', orientation:'portrait', compress:true});
  const compatto = $('#compatto') ? $('#compatto').checked : true;
  const acc = SCUOLE[SCU].pdf;
  const tint = acc.map(c => Math.round(c + (255 - c) * 0.88));
  let y = 0;

  const font = (st = 'normal', sz = 9.5, col = INK) => { doc.setFont('helvetica', st); doc.setFontSize(sz); doc.setTextColor(...col); };
  const lh = sz => sz * PT * 1.22;
  const split = (t, w, sz, st = 'normal') => { font(st, sz); return doc.splitTextToSize(pulisci(t), w); };

  const intestazione = (prima) => {
    if (prima){
      doc.addImage(LOGO, 'JPEG', PDF.M, 7, 19, 19.5);
      font('bold', 13, BLU); doc.text(SCUOLA_NOME, PDF.M + 23, 13);
      font('bold', 10.5, acc); doc.text(pulisci(SCUOLE[SCU].nome), PDF.M + 23, 18.5);
      font('normal', 7.5, GRIGIO); doc.text(pulisci(SCUOLA_SUB), PDF.M + 23, 23);
      const as = STATO.as ? (SCU === 'N' ? 'Anno educativo ' : 'Anno scolastico ') + STATO.as : '';
      font('normal', 8.5, GRIGIO); if (as) doc.text(pulisci(as), PDF.M + PDF.W, 11, {align:'right'});
      /* Riquadro per il protocollo: lasciato vuoto, lo compila la segreteria
         (a mano, con timbro o con la segnatura del registro) dopo la protocollazione. */
      // obbligatorio solo per PEI e PDP (MOD.protocollo); per gli altri documenti a scelta del docente
      const conProt = MOD.protocollo || !!($('#protocollo') && $('#protocollo').checked);
      if (conProt){
      const bx = PDF.M + PDF.W - 58, by = 13.5, bw = 58, bh = 12.5;
      doc.setDrawColor(...LINEA); doc.setLineWidth(0.3); doc.rect(bx, by, bw, bh);
      font('bold', 6.5, GRIGIO); doc.text('PROTOCOLLO (a cura della segreteria)', bx + 2, by + 3);
      font('normal', 8, INK);
      doc.text('Prot. n.', bx + 2, by + 7.3); doc.text('del', bx + 2, by + 11.2);
      doc.setDrawColor(...GRIGIO); doc.setLineWidth(0.2);
      doc.line(bx + 13, by + 7.6, bx + bw - 2, by + 7.6); doc.line(bx + 8, by + 11.5, bx + bw - 2, by + 11.5);
      }
      doc.setDrawColor(...acc); doc.setLineWidth(0.6); doc.line(PDF.M, 28.5, PDF.M + PDF.W, 28.5);
      y = 34;
      const tl = split(MOD.titolo.toUpperCase(), PDF.W, 12.5, 'bold');
      font('bold', 12.5, BLU); doc.text(tl, PDF.M + PDF.W / 2, y + 1, {align:'center'}); y += tl.length * lh(12.5) + 0.5;
      if (MOD.occhiello){ // sottotitolo descrittivo stampabile (i riferimenti normativi restano solo a schermo)
        const sl = split(MOD.occhiello, PDF.W - 20, 8, 'italic');
        font('italic', 8, GRIGIO); doc.text(sl, PDF.M + PDF.W / 2, y + 0.5, {align:'center'}); y += sl.length * lh(8);
      }
      y += 3;
    } else {
      doc.addImage(LOGO, 'JPEG', PDF.M, 6, 9, 9.2);
      font('bold', 8.5, BLU); doc.text(SCUOLA_NOME + ' – ' + pulisci(SCUOLE[SCU].breve), PDF.M + 11, 10.5);
      font('normal', 8, GRIGIO); doc.text(pulisci(MOD.titolo), PDF.M + PDF.W, 10.5, {align:'right'});
      doc.setDrawColor(...acc); doc.setLineWidth(0.4); doc.line(PDF.M, 16.5, PDF.M + PDF.W, 16.5);
      y = PDF.TOPn;
    }
  };
  const nuovaPagina = () => { doc.addPage(); intestazione(false); };
  /* I titoli di sezione restano "in sospeso" finche' non arriva il primo contenuto:
     cosi' una sezione vuota non viene stampata e il titolo non resta orfano a fine pagina. */
  let titoloSospeso = null;
  const spazio = h => {
    if (titoloSospeso){
      const t = titoloSospeso; titoloSospeso = null;
      if (y + 9.7 + Math.max(h, 10) > PDF.BOT) nuovaPagina();
      disegnaTitolo(t);
    }
    if (y + h > PDF.BOT){ nuovaPagina(); return true; }
    return false;
  };

  /* ---- primitive ---- */
  const titolo = (t) => { titoloSospeso = t; };
  const disegnaTitolo = (t) => {
    y += 1.5;
    doc.setFillColor(...tint); doc.rect(PDF.M, y, PDF.W, 6.2, 'F');
    doc.setFillColor(...acc); doc.rect(PDF.M, y, 1.4, 6.2, 'F');
    font('bold', 9, BLU); doc.text(pulisci(t.toUpperCase()), PDF.M + 3.5, y + 4.2);
    y += 8.2;
  };
  const paragrafo = (t, sz = 9.5, st = 'normal', col = INK, x = PDF.M, w = PDF.W) => {
    const lines = split(t, w, sz, st);
    for (const l of lines){ spazio(lh(sz)); font(st, sz, col); doc.text(l, x, y + sz * PT); y += lh(sz); }
    y += 1.2;
  };
  /* celle etichetta/valore affiancate (campi brevi) */
  const celle = (items) => {
    // items: [{label, val, w(12simi)}]
    const pad = 1.6, gap = 0;
    const cols = items.map(it => {
      const w = PDF.W * it.w / 12 - gap;
      const lab = split(it.label || '', w - pad * 2, 6.8, 'bold');
      const val = split(it.val || '', w - pad * 2, 9.3);
      return {it, w, lab, val};
    });
    const h = Math.max(...cols.map(c => pad + c.lab.length * lh(6.8) + c.val.length * lh(9.3) + pad));
    spazio(h);
    let x = PDF.M;
    doc.setDrawColor(...LINEA); doc.setLineWidth(0.2);
    for (const c of cols){
      doc.rect(x, y, c.w, h);
      font('bold', 6.8, GRIGIO); doc.text(c.lab, x + pad, y + pad + 6.8 * PT);
      font('normal', 9.3, INK); doc.text(c.val, x + pad, y + pad + c.lab.length * lh(6.8) + 9.3 * PT + 0.3);
      x += c.w + gap;
    }
    y += h;
  };
  let inCelle = []; // accumula campi brevi consecutivi per impaginarli su righe da 12
  const flushCelle = () => {
    if (!inCelle.length) return;
    let riga = [], tot = 0;
    const out = () => { if (!riga.length) return; const s = riga.reduce((a, r) => a + r.w, 0); riga.forEach(r => r.w = r.w * 12 / s); celle(riga); riga = []; tot = 0; };
    for (const it of inCelle){ if (tot + it.w > 12.01) out(); riga.push(it); tot += it.w; }
    out(); inCelle = []; y += 1.8;
  };
  const areaTesto = (label, testo) => {
    flushCelle();
    spazio(lh(7) + lh(9.5) * 2 + 2);
    font('bold', 7.5, GRIGIO); doc.text(pulisci(label || ''), PDF.M, y + 7.5 * PT); y += lh(7.5) + 0.4;
    const lines = split(testo, PDF.W - 4, 9.5);
    let y0 = y;
    for (const l of lines){
      if (spazio(lh(9.5))) y0 = y;
      font('normal', 9.5, INK); doc.text(l, PDF.M + 3, y + 9.5 * PT);
      y += lh(9.5);
      doc.setDrawColor(...acc); doc.setLineWidth(0.5); doc.line(PDF.M + 0.6, y0, PDF.M + 0.6, y);
    }
    y += 2.4;
  };
  const opzioniComplete = (label, opz, sel, altro) => {
    flushCelle();
    if (label){ spazio(lh(7.5) + 5); font('bold', 7.5, GRIGIO); doc.text(pulisci(label), PDF.M, y + 7.5 * PT); y += lh(7.5) + 0.6; }
    const colW = opz.length > 4 && opz.every(o => o.length < 40) ? PDF.W / 2 : PDF.W;
    let col = 0, rowH = 0;
    for (const o of opz){
      const testo = o === 'Altro' && altro ? `Altro: ${altro}` : o;
      const lines = split(testo, colW - 7, 9);
      const h = lines.length * lh(9) + 0.8;
      if (col === 0) spazio(h);
      const x = PDF.M + col * colW;
      doc.setDrawColor(...GRIGIO); doc.setLineWidth(0.25); doc.rect(x + 0.5, y + 0.6, 2.8, 2.8);
      if (sel.includes(o)){ doc.setDrawColor(...BLU); doc.setLineWidth(0.5); doc.line(x + 0.9, y + 1, x + 2.9, y + 3); doc.line(x + 2.9, y + 1, x + 0.9, y + 3); }
      font('normal', 9, INK); doc.text(lines, x + 5, y + 9 * PT);
      rowH = Math.max(rowH, h);
      if (colW < PDF.W && col === 0){ col = 1; } else { col = 0; y += rowH; rowH = 0; }
    }
    if (col === 1) y += rowH;
    y += 2;
  };
  const tabellaPDF = (label, cols, righe, opts = {}) => {
    flushCelle();
    const tot = cols.reduce((a, c) => a + (c.w || 1), 0);
    const ws = cols.map(c => PDF.W * (c.w || 1) / tot);
    const pad = 1.4, sz = opts.sz || 8.6;
    const header = () => {
      const hl = cols.map((c, j) => split(c.h, ws[j] - pad * 2, 7.6, 'bold'));
      const h = Math.max(...hl.map(l => l.length)) * lh(7.6) + pad * 2;
      let x = PDF.M;
      doc.setDrawColor(...LINEA); doc.setLineWidth(0.2);
      cols.forEach((c, j) => {
        doc.setFillColor(...tint); doc.rect(x, y, ws[j], h, 'FD');
        font('bold', 7.6, BLU); doc.text(hl[j], x + (c.centro ? ws[j] / 2 : pad), y + pad + 7.6 * PT, c.centro ? {align:'center'} : undefined);
        x += ws[j];
      });
      y += h;
    };
    if (label){ spazio(lh(7.5) + 14); font('bold', 7.5, GRIGIO); doc.text(pulisci(label), PDF.M, y + 7.5 * PT); y += lh(7.5) + 0.8; }
    spazio(14); header();
    for (const r of righe){
      const cl = r.map((v, j) => split(v, ws[j] - pad * 2, sz, (opts.primaGrassetto && j === 0) ? 'bold' : 'normal'));
      const h = Math.max(...cl.map(l => l.length || 1)) * lh(sz) + pad * 2;
      if (y + h > PDF.BOT){ nuovaPagina(); header(); }
      let x = PDF.M;
      doc.setDrawColor(...LINEA); doc.setLineWidth(0.2);
      r.forEach((v, j) => {
        if (opts.primaGrassetto && j === 0){ doc.setFillColor(248, 249, 252); doc.rect(x, y, ws[j], h, 'FD'); } else doc.rect(x, y, ws[j], h);
        font((opts.primaGrassetto && j === 0) ? 'bold' : 'normal', sz, INK);
        doc.text(cl[j], x + (cols[j].centro ? ws[j] / 2 : pad), y + pad + sz * PT, cols[j].centro ? {align:'center'} : undefined);
        x += ws[j];
      });
      y += h;
    }
    y += 3;
  };
  const firmePDF = (ruoli, nomi) => {
    flushCelle();
    const n = ruoli.length, perRiga = n === 1 ? 1 : (n === 4 || n === 2 ? 2 : 3);
    const w = PDF.W / perRiga;
    for (let i = 0; i < n; i += perRiga){
      spazio(20);
      y += 3;
      for (let k = 0; k < perRiga && i + k < n; k++){
        const x = PDF.M + k * w, cx = x + w / 2;
        font('bold', 8.5, INK); doc.text(pulisci(ruoli[i + k]), cx, y + 3, {align:'center'});
        if (nomi[i + k]){ font('normal', 8.5, GRIGIO); doc.text(pulisci(nomi[i + k]), cx, y + 7, {align:'center'}); }
        doc.setDrawColor(...GRIGIO); doc.setLineWidth(0.25); doc.line(x + 8, y + 15, x + w - 8, y + 15);
      }
      y += 18;
    }
  };

  /* ---- percorso dei blocchi ---- */
  const percorri = (blocchi) => {
    for (let k = 0; k < blocchi.length; k++){
      const b = blocchi[k];
      if (b.nopdf) continue; // campo gia' riportato in una formula (testofisso)
      switch (b.t){
        case 'h': flushCelle(); titolo(b.testo); break;
        case 'nota': break;
        case 'salto': flushCelle(); if (!titoloSospeso) nuovaPagina(); break;
        case 'se': if (condizione(b.campo, b.vale)) percorri(b.blocchi); break;
        case 'riga': b.campi.forEach(c => percorri([Object.assign({}, c, {_inRiga:true})])); break;
        case 'testo': case 'data': case 'ora': case 'num': case 'scelta': {
          let v = b.t === 'data' ? dataIT(STATO[b.id]) : STATO[b.id];
          if (b.t === 'scelta' && v === 'Altro') v = 'Altro: ' + (STATO[b.id + '_altro'] || '');
          if (b.t === 'scelta' && !compatto && !b._inRiga){ opzioniComplete(b.label, [...b.opz, ...(b.altro ? ['Altro'] : [])], [STATO[b.id]], STATO[b.id + '_altro']); break; }
          if (compatto && vuoto(v)) break;
          inCelle.push({label:b.label, val:v || '', w:b.w || (b.t === 'testo' ? 12 : 4)});
          break;
        }
        case 'area': {
          const v = STATO[b.id];
          if (compatto && vuoto(v)) break;
          if ((v || '').length < 70 && !(v || '').includes('\n') && compatto){ inCelle.push({label:b.label, val:v, w:b.w || 12}); break; }
          areaTesto(b.label, v || '');
          break;
        }
        case 'multi': {
          const sel = STATO[b.id] || [];
          if (compatto){
            if (!sel.length) break;
            const voci = sel.map(x => x === 'Altro' ? 'Altro: ' + (STATO[b.id + '_altro'] || '') : x);
            const breve = voci.join('; ');
            if (breve.length < 90) inCelle.push({label:b.label || '', val:breve, w:b.w || 12});
            else { flushCelle(); if (b.label){ spazio(8); font('bold', 7.5, GRIGIO); doc.text(split(b.label, PDF.W, 7.5, 'bold'), PDF.M, y + 7.5 * PT); y += split(b.label, PDF.W, 7.5, 'bold').length * lh(7.5) + 0.6; }
              for (const v of voci){ const l = split(v, PDF.W - 6, 9.3); spazio(l.length * lh(9.3)); doc.setFillColor(...acc); doc.circle(PDF.M + 1.6, y + 1.9, 0.7, 'F'); font('normal', 9.3, INK); doc.text(l, PDF.M + 4.5, y + 9.3 * PT); y += l.length * lh(9.3) + 0.3; }
              y += 2; }
          } else opzioniComplete(b.label, [...b.opz, ...(b.altro ? ['Altro'] : [])], sel, STATO[b.id + '_altro']);
          break;
        }
        case 'testofisso': {
          flushCelle();
          const nx = blocchi[k + 1];
          if (nx && nx.t === 'firme'){ const righe = split(componi(b.testo, false), PDF.W, 9.5).length; spazio(righe * lh(9.5) + 24); }
          paragrafo(componi(b.testo, false)); break;
        }
        case 'elenco': {
          const voci = (STATO[b.id] || []).filter(v => v && v.trim());
          if (compatto && !voci.length) break;
          flushCelle();
          if (b.label){ spazio(8); font('bold', 7.5, GRIGIO); doc.text(pulisci(b.label), PDF.M, y + 7.5 * PT); y += lh(7.5) + 0.6; }
          (voci.length ? voci : ['', '', '']).forEach((v, i) => {
            const l = split(v || '________________________________', PDF.W - 8, 9.5);
            spazio(l.length * lh(9.5));
            font('bold', 9.5, BLU); doc.text((i + 1) + '.', PDF.M + 5, y + 9.5 * PT, {align:'right'});
            font('normal', 9.5, INK); doc.text(l, PDF.M + 7, y + 9.5 * PT); y += l.length * lh(9.5) + 0.4;
          });
          y += 2;
          break;
        }
        case 'tabella': {
          const dati = STATO[b.id] || [];
          const cols = b.col.map(c => ({h:c.h, w:c.w || 1, centro:['x', 'pres', 'sn'].includes(c.tipo)}));
          let righe = dati.map((r, i) => r.map((v, j) => {
            if (b.fisse && j === 0) return b.fisse[i];
            if (b.col[j].tipo === 'x') return v ? 'X' : '';
            return v == null ? '' : String(v);
          }));
          // una riga e' utile se contiene dati diversi da quelli precompilati (es. solo il ruolo)
          const init = b.init || [];
          const utile = (r, i) => r.some((v, j) => !(b.fisse && j === 0) && b.col[j].tipo !== 'pres' && v !== '' && !(init[i] && init[i][j] === dati[i][j]));
          if (compatto) righe = righe.filter(utile);
          if (!righe.length){ break; }
          tabellaPDF(b.label, cols, righe, {primaGrassetto:!!b.fisse});
          break;
        }
        case 'matrice': {
          const val = STATO[b.id] || {};
          let righe = b.voci.map((v, i) => [v, ...b.opz.map(o => val[i] === o ? 'X' : '')]);
          if (compatto) righe = righe.filter((r, i) => val[i]);
          if (!righe.length) break;
          tabellaPDF(b.label, [{h:'', w:5}, ...b.opz.map(o => ({h:o, w:1.3, centro:true}))], righe, {primaGrassetto:true});
          break;
        }
        case 'firme': percorriFirme(b); break;
        case 'riferimenti': break; // riferimenti normativi: solo a schermo, mai in stampa
        case 'libere': {
          flushCelle();
          for (const sz of (STATO[b.id] || [])){
            if (compatto && !sz.titolo.trim() && !sz.testo.trim()) continue;
            if (b.sottotitoli){ areaTesto(sz.titolo || '', sz.testo || ''); }
            else { titolo(sz.titolo || 'Sezione'); paragrafo(sz.testo || ''); }
          }
          break;
        }

    }
  };
  const percorriFirme = (b) => { flushCelle(); firmePDF(b.ruoli, b.ruoli.map((_, i) => (STATO[b.id] || {})[i] || '')); };

  intestazione(true);
  if (man.length){
    // banda di avviso: documento incompleto (ambra, mai rosso)
    const testo = 'VERBALE INCOMPLETO – elementi essenziali non compilati: ' + man.map(x => x.label).join('; ');
    const l = split(testo, PDF.W - 6, 8.5, 'bold');
    const h = l.length * lh(8.5) + 4;
    doc.setFillColor(253, 243, 225); doc.setDrawColor(183, 121, 31); doc.setLineWidth(0.4);
    doc.rect(PDF.M, y, PDF.W, h, 'FD');
    font('bold', 8.5, [140, 90, 20]); doc.text(l, PDF.M + 3, y + 2 + 8.5 * PT);
    y += h + 3;
  }
  percorri(BLOCCHI);
  flushCelle();

  /* piè di pagina con numerazione */
  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++){
    doc.setPage(i);
    doc.setDrawColor(...LINEA); doc.setLineWidth(0.2); doc.line(PDF.M, 287, PDF.M + PDF.W, 287);
    font('normal', 7, GRIGIO);
    doc.text('Scuola Sacra Famiglia – Orzinuovi (BS) · sacrafamiglia.edu.it', PDF.M, 291);
    doc.text(`Pagina ${i} di ${n}`, PDF.M + PDF.W, 291, {align:'right'});
    if (man.length){ font('bold', 7, [140, 90, 20]); doc.text('BOZZA INCOMPLETA', PDF.M + PDF.W / 2, 291, {align:'center'}); }
  }
  doc.setProperties({title:pulisci(MOD.titolo), subject:pulisci(SCUOLE[SCU].nome), creator:'Modulistica docenti – Scuola Sacra Famiglia'});
  return doc;
}

let PDFLIB_PROMESSA = null;
function caricaPdfLib(){
  if (window.PDFLib) return Promise.resolve(window.PDFLib);
  if (!PDFLIB_PROMESSA) PDFLIB_PROMESSA = new Promise((ok, ko) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js';
    sc.onload = () => ok(window.PDFLib); sc.onerror = () => { PDFLIB_PROMESSA = null; ko(new Error('rete')); };
    document.head.append(sc);
  });
  return PDFLIB_PROMESSA;
}

async function impagina(soloAnteprima, nomeScelto){

      n => impagina(false, n));

    const t = pulisci(txt); const w = font.widthOfTextAtSize(t, size);

  };
  pagine.forEach((ep, i) => {
    const pg = out.addPage([W, Hp]);
    const completa = i === 0 || CI.pagineInt === 'tutte';
    let top;
    if (completa){
      pg.drawImage(logo, {x:M, y:Hp - mm(7) - mm(19.5), width:mm(19), height:mm(19.5)});
      T(pg, SCUOLA_NOME, M + mm(23), mm(13), 13, fB, blu);
      T(pg, SCUOLE[CI.scuola].nome, M + mm(23), mm(18.5), 10.5, fB, acc);
      T(pg, SCUOLA_SUB, M + mm(23), mm(23), 7.5, fR, grigio);

        const bx = M + mm(186) - mm(58), by = mm(13.5), bw = mm(58), bh = mm(12.5);

        T(pg, 'PROTOCOLLO (a cura della segreteria)', bx + mm(2), by + mm(3), 6.5, fB, grigio);
        T(pg, 'Prot. n.', bx + mm(2), by + mm(7.3), 8, fR, ink);
        T(pg, 'del', bx + mm(2), by + mm(11.2), 8, fR, ink);
        pg.drawLine({start:{x:bx + mm(13), y:Hp - by - mm(7.6)}, end:{x:bx + bw - mm(2), y:Hp - by - mm(7.6)}, thickness:0.5, color:grigio});
        pg.drawLine({start:{x:bx + mm(8), y:Hp - by - mm(11.5)}, end:{x:bx + bw - mm(2), y:Hp - by - mm(11.5)}, thickness:0.5, color:grigio});
      }
      pg.drawLine({start:{x:M, y:Hp - mm(28.5)}, end:{x:M + mm(186), y:Hp - mm(28.5)}, thickness:1.6, color:acc});

    } else {

      T(pg, SCUOLA_NOME + ' - ' + SCUOLE[CI.scuola].breve, M + mm(11), mm(10.5), 8.5, fB, blu);
      if (CI.titolo) T(pg, CI.titolo.slice(0, 80), M + mm(186), mm(10.5), 8, fR, grigio, 'right');

  salvaFile(blob, nome);

/* =====================================================================
   NOME DEI FILE – criterio unico per tutti i salvataggi
   AAAA-MM-GG_Grado_Documento_Classe_Autore[_BOZZA].pdf
   - data del documento in formato ISO: i file si ordinano da soli in ordine cronologico;
   - nessun nome di alunno (privacy: i nomi dei file sono visibili negli elenchi);
   - niente spazi ne' accenti; parti separate da "_", parole da "-".
   L'autore NON viene memorizzato (nessun dato salvato): e' proposto dai campi del modulo.
   ===================================================================== */
function slug(t, max = 40){
  return String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^A-Za-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, max).replace(/-+$/, '');
}
function nomeStandard(p){
  const parti = [p.data || oggiISO(), slug(p.grado, 12), slug(p.doc, 40), slug(String(p.classe || '').replace(/[ªº°\s]/g, ''), 12), slug(p.autore, 30)].filter(Boolean);
  return parti.join('_') + (p.bozza ? '_BOZZA' : '') + (p.ext || '.pdf');
}
function pulisciAutore(v){
  return String(v).replace(/\b(prof\.?ssa|prof\.?|ins\.?|insegnante|dott\.?ssa|dott\.?|sig\.?ra|sig\.?|maestra|maestro)\s*/gi, '')
    .split(/[,;(]/)[0].trim();
}
function autoreProposto(){
  for (const k of ['verbalizzante', 'segretario', 'compilatore', 'docente', 'insegnante', 'insegnanti', 'referente', 'coordinatore']){
    const v = STATO[k]; if (typeof v === 'string' && v.trim()) return pulisciAutore(v);
  }
  const f = STATO.firme && STATO.firme[0];
  return f ? pulisciAutore(f) : '';
}
function classeProposta(){
  for (const k of ['classe', 'sezione', 'classi', 'gruppi', 'gruppo']){ const v = STATO[k]; if (typeof v === 'string' && v.trim()) return v.trim(); }
  return '';
}
/* Finestra di conferma del nome: autore obbligatorio, nome modificabile */

/* =====================================================================
   BOZZA CIFRATA (lavori lunghi in piu' sessioni)
   L'app non conserva nulla: la bozza e' un FILE che il docente scarica e custodisce.
   Contenuto cifrato con AES-256-GCM; chiave derivata dalla password con PBKDF2-SHA-256
   (600.000 iterazioni, sale casuale 16 byte, IV casuale 12 byte). In chiaro nel file restano
   solo i parametri crittografici: modulo, grado e dati sono tutti dentro il testo cifrato.
   La password non viene mai salvata: se si perde, la bozza non e' recuperabile.
   Base64 con ciclo sui byte (mai String.fromCharCode.apply: stack overflow su Safari).
   ===================================================================== */
const BOZZA_ITER = 600000;
function b64(buf){ const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
function deb64(t){ const s = atob(t); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
async function chiave(password, sale){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', hash:'SHA-256', salt:sale, iterations:BOZZA_ITER}, base, {name:'AES-GCM', length:256}, false, ['encrypt', 'decrypt']);
}
function passwordValida(p){ return p.length >= 10 && /[A-Za-z]/.test(p) && /\d/.test(p); }
function cryptoDisponibile(){
  if (window.crypto && crypto.subtle) return true;
  alert('Il salvataggio cifrato richiede una connessione sicura (https). Apri l’app dal suo indirizzo ufficiale.');
  return false;
}
function salvaBozza(){
  if (!cryptoDisponibile()) return;
  const p1 = el('input', {type:'password', autocomplete:'new-password', placeholder:'almeno 10 caratteri, con lettere e numeri'});
  const p2 = el('input', {type:'password', autocomplete:'new-password', placeholder:'ripeti la password'});
  const msg = el('div', {class:'aiuto', style:'min-height:18px'});
  const m = el('div', {class:'modal'}, el('div', {class:'box small', style:'width:min(560px,100%)'},
    el('h3', {}, 'Salva bozza cifrata'),
    el('p', {style:'font-size:14px'}, 'Il lavoro viene salvato in un file protetto da password, da riaprire con «Riprendi una bozza salvata». L’app non conserva né la bozza né la password.'),
    el('div', {class:'g', style:'margin-bottom:6px'},
      el('div', {class:'f', style:'grid-column:span 6'}, el('label', {}, 'Password'), p1),
      el('div', {class:'f', style:'grid-column:span 6'}, el('label', {}, 'Conferma password'), p2)),
    msg,
    el('ul', {class:'rif', style:'margin:8px 0 14px'},
      el('li', {}, 'Se dimentichi la password la bozza non è recuperabile.'),
      el('li', {}, 'Conserva il file solo su dispositivi o spazi della scuola; non inviarlo via email o chat.'),
      el('li', {}, 'Dopo aver salvato il PDF definitivo, elimina la bozza.')),
    el('div', {class:'az'},
      el('button', {class:'btn', onclick:() => m.remove()}, 'Annulla'),
      el('button', {class:'btn pri', html:SVG.lucchetto + 'Continua', onclick:() => {
        if (!passwordValida(p1.value)){ msg.textContent = 'La password deve avere almeno 10 caratteri, con lettere e numeri.'; msg.style.color = 'var(--ambra)'; p1.focus(); return; }
        if (p1.value !== p2.value){ msg.textContent = 'Le due password non coincidono.'; msg.style.color = 'var(--ambra)'; p2.focus(); return; }
        const pw = p1.value; m.remove();
        dialogoNome({titolo:'Nome del file di bozza', ext:'.bozza', data:STATO.data || oggiISO(), grado:SCUOLE[SCU].breve, doc:(MOD.file || MOD.id).replace(/_/g, '-'),
          classe:classeProposta(), autore:autoreProposto()}, nome => cifraEScarica(pw, nome));
      }}))));
  document.body.append(m);
  setTimeout(() => p1.focus(), 50);
}
async function cifraEScarica(password, nome){
  try {
    const sale = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    const dati = {app:'modulistica-sacrafamiglia', versione:1, modulo:MOD.id, scuola:SCU, salvata:new Date().toISOString(),
      compatto:$('#compatto') ? $('#compatto').checked : true, protocollo:$('#protocollo') ? $('#protocollo').checked : false, stato:STATO};
    const k = await chiave(password, sale);
    const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, k, new TextEncoder().encode(JSON.stringify(dati)));
    const file = JSON.stringify({formato:'bozza-modulistica-sf', v:1, kdf:'PBKDF2-SHA256', iter:BOZZA_ITER, sale:b64(sale), iv:b64(iv), dati:b64(ct)});
    salvaFile(new Blob([file], {type:'application/octet-stream'}), nome);
    SPORCO = false;
    const m = el('div', {class:'modal'}, el('div', {class:'box small'},
      el('h3', {}, 'Bozza salvata'),
      el('p', {}, IOS ? `Il file "${nome}" è nell’app File, cartella Download.` : `Il file "${nome}" è stato scaricato sul dispositivo.`),
      el('p', {}, 'Per continuare più tardi: pagina iniziale › «Riprendi una bozza salvata», scegli il file e inserisci la password.'),

}
function riprendiBozza(){
  if (!cryptoDisponibile()) return;
  const inFile = el('input', IOS ? {type:'file'} : {type:'file', accept:'.bozza'});
  const pw = el('input', {type:'password', autocomplete:'current-password', placeholder:'password della bozza'});
  const msg = el('div', {class:'aiuto', style:'min-height:18px'});
  const m = el('div', {class:'modal'}, el('div', {class:'box small', style:'width:min(560px,100%)'},
    el('h3', {}, 'Riprendi una bozza salvata'),
    el('p', {style:'font-size:14px'}, 'Scegli il file .bozza e inserisci la password con cui l’hai salvato. Il file viene letto solo in questa pagina.'),
    el('div', {class:'g', style:'margin-bottom:6px'},
      el('div', {class:'f', style:'grid-column:span 12'}, el('label', {}, 'File di bozza'), inFile),
      el('div', {class:'f', style:'grid-column:span 12'}, el('label', {}, 'Password'), pw)),
    msg,
    el('div', {class:'az'},
      el('button', {class:'btn', onclick:() => m.remove()}, 'Annulla'),
      el('button', {class:'btn pri', html:SVG.riprendi + 'Apri la bozza', onclick:async () => {
        const f = inFile.files[0];
        const errore = t => { msg.textContent = t; msg.style.color = 'var(--ambra)'; };
        if (!f) return errore('Scegli il file di bozza.');
        if (!pw.value) return errore('Inserisci la password.');
        let busta;
        try { busta = JSON.parse(await f.text()); if (busta.formato !== 'bozza-modulistica-sf') throw 0; }
        catch (e){ return errore('Il file scelto non è una bozza di questa app.'); }
        let dati;
        try {
          errore('Apertura in corso…'); msg.style.color = 'var(--muted)';
          const k = await chiave(pw.value, deb64(busta.sale));
          const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:deb64(busta.iv)}, k, deb64(busta.dati));
          dati = JSON.parse(new TextDecoder().decode(pt));
        } catch (e){ return errore('Password errata oppure file danneggiato.'); }
        const mod = MODULI.find(x => x.id === dati.modulo);
        if (!mod || !mod.scuole.includes(dati.scuola)) return errore('Il modulo di questa bozza non è più disponibile nell’app.');
        m.remove();
        caricaStato(dati);
      }}))));
  document.body.append(m);

/* Ripopola il modulo: i campi ancora presenti riprendono il valore salvato; i nuovi restano vuoti */
function caricaStato(dati){
  apri(dati.modulo, dati.scuola);
  let ripresi = 0, scartati = 0;
  for (const [k, v] of Object.entries(dati.stato || {})){
    if (!(k in STATO) && !k.endsWith('_altro')){ scartati++; continue; }
    const cur = STATO[k];
    if (cur !== undefined && cur !== null && typeof cur !== typeof v){ scartati++; continue; }
    STATO[k] = v; ripresi++;
  }
  if ($('#compatto')) $('#compatto').checked = dati.compatto !== false;
  if ($('#protocollo') && !MOD.protocollo) $('#protocollo').checked = !!dati.protocollo;
  disegnaForm($('.form'));
  SPORCO = true;
  const quando = new Date(dati.salvata).toLocaleString('it-IT', {dateStyle:'short', timeStyle:'short'});
  toast(`Bozza del ${quando} riaperta` + (scartati ? `: ${scartati} campi non più presenti nel modulo aggiornato` : ''));
}

/* elementi essenziali non compilati (solo nelle parti visibili) */
function mancanti(){
  const out = [];
  const pieno = (b) => {
    const v = STATO[b.id];
    switch (b.t){
      case 'multi': return Array.isArray(v) && v.length > 0;
      case 'elenco': return Array.isArray(v) && v.some(x => x && x.trim());
      case 'libere': return Array.isArray(v) && v.some(x => (x.testo || '').trim());
      case 'tabella': {
        const init = b.init || [];
        return (v || []).some((r, i) => r.some((x, j) => !(b.fisse && j === 0) && b.col[j].tipo !== 'pres' && x !== '' && x !== false && !(init[i] && init[i][j] === x)));
      }
      case 'matrice': return v && Object.keys(v).length > 0;
      default: return v != null && String(v).trim() !== '';
    }
  };
  const walk = (bl, sezione) => {
    for (const b of bl){
      if (b.t === 'h') sezione = b.testo;
      if (b.t === 'riga') walk(b.campi, sezione);
      else if (b.t === 'se'){ if (condizione(b.campo, b.vale)) walk(b.blocchi, sezione); }
      else if (b.obbl && !pieno(b)) out.push({id:b.id, label:b.label || sezione || b.id, rif:b.rif || ''});
    }
  };
  walk(BLOCCHI, '');
  return out;
}
function evidenzia(lista){
  document.querySelectorAll('.obbl.manca').forEach(e => e.classList.remove('manca'));
  lista.forEach(m => { const e = document.querySelector(`[data-obbl="${m.id}"]`); if (e) e.classList.add('manca'); });
  const primo = lista[0] && document.querySelector(`[data-obbl="${lista[0].id}"]`);
  if (primo) primo.scrollIntoView({behavior:'smooth', block:'center'});
}
let URL_ANTEPRIMA = null;
function anteprima(){
  if (!window.jspdf){ alert('Libreria PDF non caricata: controlla la connessione e ricarica la pagina.'); return; }
  const doc = creaPDF(mancanti());
  if (URL_ANTEPRIMA) URL.revokeObjectURL(URL_ANTEPRIMA);
  URL_ANTEPRIMA = URL.createObjectURL(doc.output('blob'));
  if (IOS){
    // Safari iOS/iPadOS: un PDF in iframe mostra solo la prima pagina. Si apre in una nuova scheda
    // (dalla scheda si torna qui senza perdere i dati, che restano in questa pagina).
    const w = window.open(URL_ANTEPRIMA, '_blank');
    if (!w) toast('Consenti l\u2019apertura di nuove schede per vedere l\u2019anteprima.');
    const u = URL_ANTEPRIMA; setTimeout(() => URL.revokeObjectURL(u), 60000); URL_ANTEPRIMA = null;
    return;
  }
  const chiudi = () => { m.remove(); URL.revokeObjectURL(URL_ANTEPRIMA); URL_ANTEPRIMA = null; };
  const m = el('div', {class:'modal', onclick:e => { if (e.target === m) chiudi(); }},
    el('div', {class:'box'},
      el('div', {class:'hd'}, el('b', {}, 'Anteprima PDF – ' + MOD.titolo),
        el('button', {class:'btn pri', html:SVG.scarica + 'Salva PDF', onclick:() => { chiudi(); scarica(); }}),
        el('button', {class:'btn', html:SVG.chiudi + 'Chiudi', onclick:chiudi})),
      el('iframe', {src:URL_ANTEPRIMA, title:'Anteprima PDF'})));
  document.body.append(m);
}
/* Scarica un Blob come file. Safari iPadOS 13+ supporta l'attributo download (file in File > Download). */
function salvaFile(blob, nome){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nome; a.rel = 'noopener';
  if (!('download' in a)) { window.open(url, '_blank'); }
  else { document.body.append(a); a.click(); a.remove(); }
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
function scarica(forza){
  if (!window.jspdf){ alert('Libreria PDF non caricata: controlla la connessione e ricarica la pagina.'); return; }
  const man = mancanti();
  if (man.length && !forza){
    const m = el('div', {class:'modal'}, el('div', {class:'box small'},
      el('h3', {}, 'Mancano elementi essenziali'),
      el('p', {}, 'Senza questi elementi il verbale o le deliberazioni possono essere invalidi o impugnabili:'),
      el('ul', {class:'mancanti'}, man.map(x => el('li', {}, x.label, x.rif ? el('small', {}, x.rif) : null))),
      el('div', {class:'az'},
        el('button', {class:'btn pri', onclick:() => { m.remove(); evidenzia(man); }}, 'Completa il modulo'),
        el('button', {class:'btn', onclick:() => { m.remove(); scarica(true); }}, 'Salva come bozza incompleta'))));
    document.body.append(m);
    return;
  }
  document.querySelectorAll('.obbl.manca').forEach(e => e.classList.remove('manca'));
  dialogoNome({data:STATO.data || oggiISO(), grado:SCUOLE[SCU].breve, doc:(MOD.file || MOD.id).replace(/_/g, '-'),
    classe:classeProposta(), autore:autoreProposto(), bozza:man.length > 0}, nome => salvaModulo(man, nome));
}
function salvaModulo(man, nome){
  const doc = creaPDF(man);
  salvaFile(doc.output('blob'), nome);
  SPORCO = false;
  const m = el('div', {class:'modal'}, el('div', {class:'box small'},
    el('h3', {}, 'PDF salvato'),
    el('p', {}, IOS
      ? `Il file "${nome}" è nell’app File, cartella Download (se Safari chiede conferma, tocca "Scarica"). Caricalo sul registro elettronico e poi eliminalo dall’app File.`
      : `Il file "${nome}" è stato scaricato sul dispositivo. Caricalo sul registro elettronico e poi eliminalo dalla cartella Download.`),
    el('p', {}, 'Vuoi cancellare i dati del modulo e tornare all’elenco?'),
    el('div', {class:'az'},
      el('button', {class:'btn', onclick:() => m.remove()}, 'Resta nel modulo'),
      el('button', {class:'btn pri', onclick:() => { m.remove(); home(); }}, 'Cancella e torna all’elenco'))));

        'D.M. 328/2022 – Linee guida per l’orientamento: moduli di almeno 30 ore annue nella secondaria di I grado; E-Portfolio.',
        'D.M. 14/2024 – modelli di certificazione delle competenze.',
        'D.I. 182/2020 (mod. D.I. 153/2023) – PEI; L. 170/2010 e D.M. 5669/2011 – DSA; Dir. 27/12/2012 e C.M. 8/2013 – BES e PDP.',
        privacy];
    },
    blocchi:(s) => {

      return [

        {t:'testofisso', testo:nido
          ? 'Il giorno {data}, alle ore {ora_inizio}, {modalita} ({luogo}), si riunisce il Collettivo educativo del Green Nido per discutere il seguente ordine del giorno.'

          righe:Math.max(4, RUOLI[s].length), init:RUOLI[s].map(x => ['', x, 'P']), aggiungi:true, obbl:true, rif:r('presenti')},

        {t:'se', campo:'organo', vale:COLLEGIALI, blocchi:[
          {t:'riga', campi:[

            {t:'num', id:'n_presenti', label:'Presenti', w:4, nopdf:true, obbl:true, rif:R.quorum},
            {t:'testo', id:'art_reg', label:'Articolo del Regolamento OO.CC. sul numero legale', w:4, nopdf:true, ph:'es. art. 5'}]},
          {t:'testofisso', testo:'Il Presidente, constatata la presenza di n. {n_presenti} componenti su {in_carica} in carica, accertato il numero legale ai sensi di {art_reg} del Regolamento degli organi collegiali, dichiara aperta la seduta.'}]},
        {t:'riga', campi:[
          {t:'testo', id:'presidente', label:`Presiede (${H.PRES[s]} o delegato)`, w:6, nopdf:true, obbl:true, rif:r('presidente'), ph:nido ? 'es. dott.ssa Anna Neri, Coordinatrice pedagogica' : 'es. prof.ssa Maria Rossi, Coordinatore didattico'},

  /* ---------- COLLOQUIO CON LA FAMIGLIA ---------- */
  /* Riunioni non deliberanti (colloqui, incontri, commissioni): minimo identificativo */
  const LEG_INCONTRO = 'Il colloquio non è una seduta di un organo collegiale: gli elementi segnati con * sono il minimo identificativo del verbale (data, partecipanti, verbalizzante). La loro mancanza è un’irregolarità documentale che ne riduce il valore di prova, non una causa di invalidità.';
  const RIF_INC = {

  const firmeFamiglia = (extra = []) => [
    {t:'h', testo:'Presa visione'},

    {t:'nota', testo:'Linguaggio oggettivo e descrittivo: fatti datati, «la famiglia riferisce…», «si osserva che…». Niente ipotesi diagnostiche, giudizi sulla persona o sulla famiglia, nomi di altri alunni (usare «omissis»). Mai trasmettere il verbale via chat. Con genitori separati, entrambi hanno diritto alle informazioni (Nota MIUR 5336/2015).'},

    {t:'firme', ruoli:['Per la scuola', 'Il verbalizzante', 'Il genitore', 'Il genitore', ...extra]},
  ];
  const piccoli = (s) => s === 'N' || s === 'I';

  registra({
    id:'colloquio-famiglia', argomento:'incontri', scuole:['N', 'I', 'P', 'S'], file:'Verbale_colloquio_famiglia',

(() => {

  /* ---------- norme comuni ---------- */

    'L. 104/1992, art. 12 (diritto all’educazione e all’istruzione) e art. 15 c. 10 (GLO per ciascun alunno con disabilità), come sostituito dal D.Lgs. 66/2017 mod. D.Lgs. 96/2019',

  ];
  const N_PRIVACY = 'Reg. UE 2016/679 (GDPR) art. 9 e D.Lgs. 196/2003 art. 2-sexies: dati relativi alla salute, conservazione nel fascicolo riservato';

  /* rif degli elementi essenziali del GLO */
  const RG = {
    data:'Elemento identificativo del verbale (D.I. 182/2020 art. 4 c. 8)',
    alunno:'Identificazione dell’alunno cui si riferisce il GLO (art. 15 c. 10 L. 104/1992)',

    glo_comp:'Composizione e presenze: il GLO è valido anche se non tutte le componenti sono presenti, ma va documentato chi c’era (D.I. 182/2020 artt. 3 e 4 c. 4)',
    presidente:'Il verbale è firmato da chi presiede (D.I. 182/2020 art. 4 c. 8)',
    segretario:'Il verbale è firmato dal segretario verbalizzante individuato tra i presenti (D.I. 182/2020 art. 4 c. 8)',
  };
  const essGLO = (extra = {}) => {
    const m = {};
    Object.keys(RG).forEach(k => { m[k] = {obbl:true, rif:RG[k]}; });
    Object.keys(extra).forEach(k => { m[k] = Object.assign({}, m[k] || {}, extra[k]); });
